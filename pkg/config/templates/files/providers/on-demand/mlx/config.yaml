# MANAGED FILE : overwritten on every cluster sync.
# Edit on the coordinator, never here.
description: "Apple MLX inference engine for Apple Silicon"
features:
  tools: {}
  vision:
    default: true
    when: vision_config
    runtime: mlx-vlm
    execution:
      type: python
      command: python3
      args: ["-m", "mlx_vlm.server", "--host", "127.0.0.1", "--port", "${PORT}", "--model", "${MODEL_PATH}"]
      wire_model: path
    # messages is left out so it is translated: native /v1/messages drops a tool_result
    # image that carries no text, which Claude Code sends after Read.
    wire_endpoints: [chat_completions, responses]
    exclude_parameters: [chat-template, top-p, temp, top-k, min-p,
      num-draft-tokens, use-default-chat-template, chat-template-args, decode-concurrency,
      prompt-concurrency, prompt-cache-size, prompt-cache-bytes, pipeline]
    health_check:
      path: /v1/models
      interval: 30s
      timeout: 5s
      retries: 3
      readiness_probe:
        logPatterns:
          success:
            - {pattern: "Application startup complete", isRegex: false}
            - {pattern: "Uvicorn running on", isRegex: false}
          failure:
            - {pattern: "Traceback (most recent call last)", isRegex: false}
        serve:
          path: /v1/chat/completions
          method: POST
          body: '{"model":"${WIRE_MODEL}","messages":[{"role":"user","content":"ping"}],"max_tokens":1}'
        timeout: 600s
  embeddings:
    default: false
    runtime: mlx-vlm
    execution:
      type: python
      command: python3
      args: ["-m", "mlx_vlm.server", "--host", "127.0.0.1", "--port", "${PORT}", "--embedding-model", "${MODEL_PATH}"]
      wire_model: path
    wire_endpoints: [embeddings]
    exclude_parameters: [chat-template, top-p, max-tokens, temp, top-k, min-p,
      num-draft-tokens, use-default-chat-template, chat-template-args, decode-concurrency,
      prompt-concurrency, prompt-cache-size, prompt-cache-bytes, pipeline]
    health_check:
      path: /v1/models
      interval: 30s
      timeout: 5s
      retries: 3
      readiness_probe:
        logPatterns:
          success:
            - {pattern: "Application startup complete", isRegex: false}
            - {pattern: "Uvicorn running on", isRegex: false}
          failure:
            - {pattern: "Traceback (most recent call last)", isRegex: false}
        serve:
          path: /v1/embeddings
          method: POST
          body: '{"model":"${WIRE_MODEL}","input":"ping"}'
        timeout: 600s
  reranking:
    default: false
    runtime: mlx-vlm
    execution:
      type: python
      command: python3
      args: ["-m", "mlx_vlm.server", "--host", "127.0.0.1", "--port", "${PORT}", "--reranker-model", "${MODEL_PATH}"]
      wire_model: path
    wire_endpoints: [rerank]
    exclude_parameters: [chat-template, top-p, max-tokens, temp, top-k, min-p,
      num-draft-tokens, use-default-chat-template, chat-template-args, decode-concurrency,
      prompt-concurrency, prompt-cache-size, prompt-cache-bytes, pipeline]
    health_check:
      path: /v1/models
      interval: 30s
      timeout: 5s
      retries: 3
      readiness_probe:
        logPatterns:
          success:
            - {pattern: "Application startup complete", isRegex: false}
            - {pattern: "Uvicorn running on", isRegex: false}
          failure:
            - {pattern: "Traceback (most recent call last)", isRegex: false}
        serve:
          path: /v1/rerank
          method: POST
          body: '{"model":"${WIRE_MODEL}","query":"ping","documents":["ping"]}'
        timeout: 600s
install:
  runtimes:
    mlx:
      package: mlx-lm
      startup_import: mlx_lm.server
      version_constraint: ""
      indexes: {primary: https://pypi.org/simple, extra: []}
      companions:
        mlx: {constraint: "", build: metal}
      verify:
        imports: [mlx.core, mlx_lm.server]
        checks: [pip_check, imports, metal_available]
      only_binary: true
      timeout: 30m
      toolkit: ""
    mlx-vlm:
      package: mlx-vlm
      startup_import: mlx_vlm.server
      version_constraint: ""
      indexes: {primary: https://pypi.org/simple, extra: []}
      companions:
        mlx: {constraint: "", build: metal}
      verify:
        imports: [mlx.core, mlx_vlm.server]
        checks: [pip_check, imports, metal_available]
      only_binary: true
      timeout: 30m
      toolkit: ""
protocol: openai
search:
  registry: huggingface
enabled: false
# pinned_version is release-managed and refreshed on startup.
# An explicit install-call version overrides this seed.
# version_source below reports whether upstream has moved on.
pinned_version: "0.31.3"
version_source:
  type: pypi
  package: mlx-lm
  # pep440, not semver: PyPI identifiers can carry an epoch, extra release
  # segments, or a .postN suffix, and a semver parser silently drops those.
  compare: pep440
# MLX targets Apple's Metal stack : Apple Silicon only.
platforms:
  - {os: darwin, arch: arm64}
requirements:
  disk_space: "2GB"
  # Python 3.14 deadlocks mlx_lm's http.server worker mid-SSE (observed
  # via `sample` on a live wedged PID inside lock_PyThread_acquire_lock).
  # Cap at 3.13 until upstream validates the newer minor. The installer
  # honors this range via pkg/prov_apps/install/interpreter.Select, so a
  # 3.14-only host fails preflight with an actionable "brew install
  # python@3.13" hint rather than silently building a broken venv.
  python:
    min: "3.9"
    max: "3.14"
capabilities:
  formats: [mlx]
  # mlx_lm.server exposes Chat and Completions; zzRouter derives the translation shims.
  wire_endpoints: [chat_completions, completions]

defaults:
  parameters:
    max-tokens: "4096"            # MLX default is 512, too low for thinking models
  metadata:
    shutdown_timeout: "gpu"
    processor_type: "Metal GPU"

runtime:
  failure_patterns:
    - pattern: "kIOGPUCommandBufferCallbackErrorOutOfMemory"
      isRegex: false
      class: memory
    - pattern: "[malloc] Unable to allocate"
      isRegex: false
      class: memory
    - pattern: "[metal::malloc] Unable to allocate"
      isRegex: false
      class: memory
    - pattern: "[metal::malloc] Resource limit"
      isRegex: false
      class: memory
    - pattern: "[metal::malloc] Attempting to allocate"
      isRegex: false
      class: memory
    - pattern: "Only 'text' content type is supported."
      isRegex: false
      class: unsupported_input
    - pattern: "jinja2.exceptions.TemplateError:"
      isRegex: false
      class: chat_template_rejected
  port_range: [8090, 8099]
  base_port: 8090
  keep_alive: 30m
  max_concurrent_requests: 1  # Metal GPU processes one request at a time

  execution:
    type: python
    command: python3
    args:
      - "-m"
      - "mlx_lm"
      - "server"
      - "--model"
      - "${MODEL_PATH}"
      - "--port"
      - "${PORT}"
    # mlx_lm has no --served-model-name: it loads whatever token the request
    # carries and echoes it back, mapping only the literal "default_model"
    # to --model. So it must be addressed by path on the wire; zzRouter
    # restores the client-facing name on the way out.
    wire_model: path
  # mlx_lm.server 0.31.3 has none of the flags only mlx_vlm.server reads.
  exclude_parameters: [vision-cache-size, enable-thinking, thinking-budget,
    thinking-start-token, thinking-end-token, kv-bits, kv-key-bits, kv-value-bits,
    kv-key-scheme, kv-value-scheme, kv-quant-scheme, kv-group-size, max-kv-size,
    quantized-kv-start, expert-cache-gb, draft-kind, draft-block-size, max-num-seqs,
    top-logprobs-k]

  health_check:
    path: /v1/models
    interval: 30s
    timeout: 5s
    retries: 3
    readiness_probe:
      logPatterns:
        failure:
          - pattern: "Traceback (most recent call last)"
            isRegex: false
        success:
          # mlx_lm starts its listener before loading weights, so this line
          # means "process is up", not "ready" : the serve check decides.
          - pattern: "INFO - Starting httpd"
            isRegex: false
      serve:
        path: /v1/chat/completions
        body: '{"model":"${WIRE_MODEL}","messages":[{"role":"user","content":"ping"}],"max_tokens":1}'
      timeout: 600s
