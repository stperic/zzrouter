# MANAGED FILE : overwritten on every cluster sync.
description: ComfyUI image and video GPU tenant
enabled: false
run_scope: node
platforms:
  - {os: linux, arch: amd64}
  - {os: windows, arch: amd64}
requirements:
  disk_space: "20GB"
  # ComfyUI at the pinned version declares requires-python >=3.10; its README reports 3.14 working.
  python: {min: "3.10", max: "3.15"}
  gpu: {vendor: nvidia, policy: required}
install:
  runtimes:
    comfyui:
      source:
        version: "0.44.0"
        url: https://github.com/Comfy-Org/ComfyUI/archive/refs/tags/v0.44.0.tar.gz
        sha256: 7d796d74f42fe862eb55d1c217349fee92c2cac5d4ababe06c8b73f90c936dc0
        strip_components: 1
        requirements: requirements.txt
        entrypoint: main.py
      indexes:
        primary: https://pypi.org/simple
        extra: []
        platforms:
          windows:
            extra: [https://download.pytorch.org/whl/cu132]
      companions:
        torch: {constraint: "", build: cuda}
        torchvision: {constraint: "", build: cuda}
      verify:
        imports: [torch, torchvision, aiohttp]
        checks: [pip_check, imports, cuda_companions, cuda_available]
      only_binary: true
      timeout: 90m
defaults:
  parameters:
    gpu-reserve-mib: "8192"
    listen: "0.0.0.0"
    keep-alive: "5m"
runtime:
  data_dir: data
  data_subdirs: [custom_nodes]
  model_store:
    directory: models
    categories: [diffusion_models, text_encoders, vae, loras, checkpoints, controlnet, clip_vision, upscale_models, embeddings, audio_encoders, model_patches, latent_upscale_models]
  base_port: 8188
  port_range: [8188, 8188]
  execution:
    type: python
    command: python
    args: ["main.py", "--port", "${PORT}", "--base-directory", "${DATA_DIR}"]
    working_dir: source
  health_check:
    path: /system_stats
    interval: 2s
    timeout: 3s
    readiness_probe:
      timeout: 2m
      serve: {path: /system_stats}
  activity_probe:
    path: /queue
    busy_when_nonempty: [queue_running, queue_pending]
