# Long-tail llama.cpp parameters. Go spine carries ctx-size + n-gpu-layers.
provider: llamacpp
cache_log:
  pools: 'llama_kv_cache: size = +[0-9.]+ MiB \( *([0-9]+) cells, *[0-9]+ layers, *[0-9]+/([0-9]+) seqs\)'
  slots: "srv +load_model: initializing, n_slots = ([0-9]+), n_ctx_slot = ([0-9]+), kv_unified = '(true|false)'"
parameters:
  ctx-size:
    auto: "0"
    auto_context_source: native
    served: meta.n_ctx
  # Read because diagnostics.memory names n-gpu-layers with kind layers.
  n-gpu-layers:
    placement_log:
      layers: 'offloaded (\d+)/(\d+) layers to GPU'
      cpu_overrides: 'tensor overrides to CPU'
      weights: '(CPU)?\S* model buffer size = +([\d.]+) MiB'
  cache-type-k:
    type: string
    kv_cache_dtype: k
    description: KV key cache encoding; sizing supports f16, bf16, f32, q8_0, q4_0, q4_1, q5_0, q5_1 and iq4_nl
  cache-type-v:
    type: string
    kv_cache_dtype: v
    description: KV value cache encoding; sizing supports f16, bf16, f32, q8_0, q4_0, q4_1, q5_0, q5_1 and iq4_nl
  threads:
    type: int
    min: 1
    description: Number of CPU threads for decoding
  batch-size:
    type: int
    min: 1
    description: Logical batch size (prompt processing)
  ubatch-size:
    type: int
    min: 1
    description: Physical micro-batch size
  parallel:
    sequence_slots: true
    recurrent_state_rows: 4
    type: int
    min: 1
    description: Number of sequence slots; recurrent states allocate one row per slot
  flash-attn:
    type: bool
    description: Enable flash attention kernels when available
  verbose:
    type: bool
    description: Enable verbose llama-server logging
  chat-template-file:
    type: asset
    description: Jinja chat template overriding the model's own, by asset name
# Per-endpoint overlay schemas. The resolver applies these on top of the
# base parameters when an instance is launched for a given endpoint, so
# the same flag (e.g. "embeddings: true") is only legal under the matching
# endpoint scope. Agents discover which params apply to each endpoint by
# fetching GET /providers/llamacpp/schema.
endpoints:
  embeddings:
    parameters:
      embeddings:
        type: bool
        description: Serve the embeddings endpoint (mode-exclusive with chat)
      pooling:
        type: string
        description: Pooling strategy for embeddings
        enum: [none, mean, cls, last, rank]
  reranking:
    parameters:
      reranking:
        type: bool
        description: Serve the reranking endpoint (mode-exclusive with chat)

diagnostics:
  runtime: llamacpp
  runtimes:
    llamacpp: {kernels: prebuilt}
  memory: {kind: layers, parameter: n-gpu-layers}
