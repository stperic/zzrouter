# Long-tail vLLM parameters. Go spine in pkg/prov_apps/schema/registry.go
# carries launcher-load-bearing shape (max-model-len, gpu-memory-utilization,
# tensor-parallel-size, dtype). Everything here augments it.
provider: vllm
cache_log:
  tokens: 'GPU KV cache size: ([0-9][0-9,]*) tokens'
  concurrency: 'Maximum concurrency for ([0-9][0-9,]*) tokens per request: ([0-9]+(?:\.[0-9]+)?)x'
parameters:
  max-model-len:
    auto: "auto"
    auto_min_context_tokens: 4096
    served: max_model_len
  enable-auto-tool-choice:
    type: bool
    description: Enable automatic tool calling
  tool-call-parser:
    type: string
    description: Tool parser for this model family, from the model publisher's serving instructions
  reasoning-parser:
    type: string
    description: Separates thinking text from content independently of tool calling; choose for this model family from the model publisher's serving instructions
  enable-chunked-prefill:
    type: bool
    description: Enable chunked prefill for long contexts
  max-num-seqs:
    type: int
    min: 1
    description: Maximum concurrent sequences vLLM batches per forward pass; max_num_seqs in engine logs names this parameter. A Mamba-cache refusal reports the supported upper bound as at most N.
  quantization:
    type: string
    description: Quantization scheme (awq | gptq | fp8 | ...)
  hf-overrides:
    type: string
    context_override: true
    description: Overrides to the model configuration
  kv-cache-dtype:
    type: string
    kv_cache_dtype: both
    description: KV cache encoding; sizing supports auto (model dtype), fp8, fp8_e4m3 and fp8_e5m2
  block-size:
    type: int
    min: 1
    description: KV cache block size in tokens
  chat-template:
    type: asset
    description: Jinja chat template overriding the model's own, by asset name
  # Every other flag vllm serve 0.29.0 accepts that an operator may set. Flags
  # the runtime passes, paths, plugins, multi-node, auth, TLS, CORS and logging
  # stay out.
  api-server-count: {type: int, min: 1, description: "API server processes"}
  chat-template-content-format: {type: string, enum: [auto, openai, string], description: "How message content is rendered for the chat template"}
  trust-request-chat-template: {type: bool, description: "Accept chat templates supplied in requests"}
  default-chat-template-kwargs: {type: string, description: "Default chat template parameters as a JSON object"}
  response-role: {type: string, description: "Role returned when add_generation_prompt is set"}
  return-tokens-as-token-ids: {type: bool, description: "Return logprob tokens as token_id:N strings"}
  exclude-tools-when-tool-choice-none: {type: bool, description: "Omit tools from the prompt when tool_choice is none"}
  enable-prompt-tokens-details: {type: bool, description: "Report prompt token details in usage"}
  enable-per-request-metrics: {type: bool, description: "Include per-request timing metrics in responses"}
  enable-server-load-tracking: {type: bool, description: "Track server load metrics"}
  enable-force-include-usage: {type: bool, description: "Include usage in every response"}
  sse-keep-alive-interval: {type: int, min: 0, description: "Seconds between SSE keep-alive comments, 0 off"}
  enable-tokenizer-info-endpoint: {type: bool, description: "Serve the tokenizer info endpoint"}
  no-cohere-is-reasoning-model: {type: bool, description: "Treat Cohere models as non-reasoning"}
  cohere-format: {type: string, enum: [cmd3, cmd4], description: "Cohere prompt format for tokenizer-mode cohere"}
  fingerprint-mode: {type: string, enum: [custom, full, hash, none], description: "Format of the system_fingerprint field"}
  fingerprint-value: {type: string, description: "system_fingerprint value in custom mode"}
  enable-request-id-headers: {type: bool, description: "Add X-Request-Id headers to responses"}
  disable-fastapi-docs: {type: bool, description: "Disable the OpenAPI schema and docs endpoints"}
  h11-max-incomplete-event-size: {type: int, description: "Max bytes of an incomplete HTTP event"}
  h11-max-header-count: {type: int, description: "Max HTTP headers per request"}
  enable-offline-docs: {type: bool, description: "Serve API docs from bundled assets"}
  no-enable-flash-late-interaction: {type: bool, description: "Run late-interaction scoring off the GPU"}
  runner: {type: string, enum: [auto, draft, generate, pooling], description: "Model runner type"}
  convert: {type: string, enum: [auto, classify, embed, none], description: "Adapt the model to another task"}
  tokenizer-mode: {type: string, description: "Tokenizer mode, e.g. auto, hf, slow, mistral"}
  trust-remote-code: {type: bool, description: "Run custom modeling code shipped with the model"}
  seed: {type: int, description: "Random seed"}
  quantization-config: {type: string, description: "Per-layer quantization config as JSON"}
  allow-deprecated-quantization: {type: bool, description: "Allow deprecated quantization methods"}
  enforce-eager: {type: bool, description: "Disable CUDA graphs and always run eagerly"}
  enable-return-routed-experts: {type: bool, description: "Return routed experts"}
  return-sampling-mask: {type: bool, description: "Return the post-processing token support"}
  max-logprobs: {type: int, description: "Max logprobs returned per token, -1 unlimited"}
  logprobs-mode: {type: string, enum: [processed_logits, processed_logprobs, raw_logits, raw_logprobs], description: "Content of returned logprobs"}
  use-fp64-gumbel: {type: bool, description: "Use FP64 noise for Gumbel sampling"}
  enable-trace-replay: {type: bool, description: "Allow requests to replay a token trace"}
  disable-sliding-window: {type: bool, description: "Disable sliding window attention"}
  no-disable-cascade-attn: {type: bool, description: "Allow cascade attention"}
  skip-tokenizer-init: {type: bool, description: "Skip tokenizer init; requests carry token ids"}
  enable-prompt-embeds: {type: bool, description: "Accept prompt embeddings as input"}
  config-format: {type: string, enum: [auto, hf, mistral], description: "Format of the model config"}
  pooler-config: {type: string, description: "Pooling model output config as JSON"}
  generation-config: {type: string, enum: [auto, vllm], description: "auto reads the model's generation config, vllm ignores it"}
  override-generation-config: {type: string, description: "Generation config overrides as JSON"}
  enable-sleep-mode: {type: bool, description: "Enable engine sleep mode"}
  enable-cumem-allocator: {type: bool, description: "Use the cumem GPU allocator"}
  model-impl: {type: string, enum: [auto, terratorch, transformers, vllm], description: "Model implementation"}
  renderer-num-workers: {type: int, min: 1, description: "Renderer worker threads"}
  load-format: {type: string, description: "Weight format to load, e.g. auto, safetensors, pt"}
  safetensors-load-strategy: {type: string, enum: [eager, lazy, prefetch, torchao], description: "Safetensors loading strategy"}
  safetensors-prefetch-num-threads: {type: int, description: "Threads prefetching safetensors files"}
  safetensors-prefetch-block-size: {type: int, description: "Safetensors prefetch read size in bytes"}
  pt-load-map-location: {type: string, description: "Map location for PyTorch checkpoints"}
  attention-backend: {type: string, description: "Attention backend, auto selects"}
  mamba-backend: {type: string, description: "Mamba SSU backend"}
  mamba-ssu-algorithm: {type: string, enum: [auto, horizontal, simple, vertical], description: "FlashInfer selective state update algorithm"}
  enable-mamba-cache-stochastic-rounding: {type: bool, description: "Stochastic rounding for fp16 SSM state"}
  mamba-cache-philox-rounds: {type: int, min: 0, description: "Philox rounds for stochastic rounding"}
  distributed-executor-backend: {type: string, enum: [external_launcher, mp, ray, uni], description: "Backend for distributed workers"}
  pipeline-parallel-size: {type: int, min: 1, description: "Pipeline parallel groups"}
  distributed-timeout-seconds: {type: int, description: "Timeout for distributed operations"}
  cpu-distributed-timeout-seconds: {type: int, description: "Timeout for CPU communication groups"}
  numa-bind: {type: bool, description: "Bind GPU workers to NUMA-local CPUs and memory"}
  device-ids: {type: string, description: "Comma-separated GPU ids or UUIDs to use"}
  decode-context-parallel-size: {type: int, min: 1, description: "Ranks sharding the decode KV cache"}
  dcp-comm-backend: {type: string, enum: [a2a, ag_rs], description: "Decode context parallel communication backend"}
  dcp-q-replicate: {type: bool, description: "Replicate the MLA query projection per DCP group"}
  no-dcp-q-replicate: {type: bool, description: "Do not replicate the MLA query projection"}
  dcp-kv-cache-interleave-size: {type: int, description: "Deprecated: use cp-kv-cache-interleave-size"}
  cp-kv-cache-interleave-size: {type: int, description: "KV cache interleave size across context parallel ranks"}
  prefill-context-parallel-size: {type: int, min: 1, description: "Ranks splitting prefill computation"}
  data-parallel-size: {type: int, min: 1, description: "Data parallel groups"}
  data-parallel-backend: {type: string, enum: [mp, ray], description: "Data parallel backend"}
  enable-expert-parallel: {type: bool, description: "Use expert parallelism for MoE layers"}
  enable-batch-sharded-sampling: {type: bool, description: "Shard sampling across tensor parallel ranks"}
  no-enable-batch-sharded-sampling: {type: bool, description: "Sample the whole batch on every rank"}
  enable-ep-weight-filter: {type: bool, description: "Load only local expert weights"}
  all2all-backend: {type: string, description: "All2All backend for expert parallel communication"}
  enable-dbo: {type: bool, description: "Enable dual batch overlap"}
  ubatch-size: {type: int, description: "Micro-batch size"}
  enable-elastic-ep: {type: bool, description: "Enable elastic expert parallelism"}
  dbo-decode-token-threshold: {type: int, description: "Dual batch overlap threshold for decode batches"}
  dbo-prefill-token-threshold: {type: int, description: "Dual batch overlap threshold for prefill batches"}
  disable-nccl-for-dp-synchronization: {type: bool, description: "Use Gloo for data parallel synchronization"}
  no-disable-nccl-for-dp-synchronization: {type: bool, description: "Use NCCL for data parallel synchronization"}
  enable-eplb: {type: bool, description: "Enable expert parallelism load balancing"}
  eplb-config: {type: string, description: "Expert parallelism load balancing config as JSON"}
  expert-placement-strategy: {type: string, enum: [linear, round_robin], description: "MoE expert placement strategy"}
  max-parallel-loading-workers: {type: int, description: "Max parallel model loading workers"}
  ray-workers-use-nsight: {type: bool, description: "Profile Ray workers with nsight"}
  disable-custom-all-reduce: {type: bool, description: "Use NCCL instead of the custom all-reduce"}
  enable-fault-tolerance: {type: bool, description: "Enable engine fault tolerance"}
  fault-tolerance-config: {type: string, description: "Fault tolerance config as JSON"}
  kv-cache-memory-bytes: {type: int, description: "KV cache size per GPU in bytes, overrides utilization"}
  num-gpu-blocks-override: {type: int, description: "Override the profiled number of GPU blocks"}
  enable-prefix-caching: {type: bool, description: "Enable prefix caching"}
  no-enable-prefix-caching: {type: bool, description: "Disable prefix caching"}
  prefix-caching-hash-algo: {type: string, enum: [sha256, sha256_cbor, xxhash, xxhash_cbor], description: "Prefix caching hash algorithm"}
  prefix-cache-retention-interval: {type: int, min: 0, description: "Tokens between retained prefix-cache checkpoints"}
  kv-sharing-fast-prefill: {type: bool, description: "Skip prefill tokens in eligible KV sharing layers"}
  mamba-cache-dtype: {type: string, enum: [auto, bfloat16, float16, float32], description: "Mamba cache dtype"}
  mamba-ssm-cache-dtype: {type: string, enum: [auto, bfloat16, float16, float32], description: "Mamba SSM state cache dtype"}
  mamba-block-size: {type: int, description: "Mamba cache block size in tokens"}
  prefix-match-unit: {type: int, description: "Finest token boundary for prefix-cache hits"}
  mamba-cache-mode: {type: string, enum: [align, all, none], description: "Mamba prefix cache strategy"}
  replayssm-buffer-len: {type: int, description: "ReplaySSM history buffer length"}
  use-replayssm: {type: bool, description: "Use the ReplaySSM Mamba2 decode kernel"}
  kv-offloading-size: {type: float, description: "KV cache CPU offload buffer in GiB"}
  kv-offloading-backend: {type: string, enum: [lmcache, native], description: "KV cache offloading backend"}
  offload-backend: {type: string, enum: [auto, prefetch, uva], description: "Weight offloading backend"}
  cpu-offload-gb: {type: float, min: 0, description: "Weights offloaded to CPU per GPU in GiB"}
  offload-group-size: {type: int, description: "Layers per prefetch offload group, 0 off"}
  offload-num-in-group: {type: int, description: "Layers offloaded per group"}
  offload-prefetch-step: {type: int, description: "Layers prefetched ahead"}
  language-model-only: {type: bool, description: "Disable all multimodal inputs"}
  limit-mm-per-prompt: {type: string, description: "Max multimodal items per prompt as JSON"}
  enable-mm-embeds: {type: bool, description: "Accept multimodal embeddings as input"}
  media-io-kwargs: {type: string, description: "Media processing arguments per modality as JSON"}
  mm-processor-kwargs: {type: string, description: "Multimodal processor overrides as JSON"}
  mm-processor-cache-gb: {type: float, min: 0, description: "Multimodal processor cache in GiB, 0 off"}
  mm-processor-cache-type: {type: string, enum: [lru, shm], description: "Multimodal processor cache type"}
  mm-hasher-algorithm: {type: string, enum: [blake3, sha256, sha512], description: "Multimodal input cache hash"}
  mm-shm-cache-max-object-size-mb: {type: int, description: "Max object size in the shm cache in MiB"}
  mm-encoder-only: {type: bool, description: "Skip the language component"}
  mm-encoder-tp-mode: {type: string, enum: [data, weights], description: "Encoder tensor parallel mode"}
  mm-encoder-attn-backend: {type: string, description: "Vision encoder attention backend"}
  mm-encoder-attn-dtype: {type: string, enum: [fp8], description: "Vision encoder attention dtype"}
  mm-encoder-fp8-scale-save-margin: {type: float, description: "Margin applied to auto-saved FP8 scales"}
  interleave-mm-strings: {type: bool, description: "Interleave multimodal prompts in string format"}
  skip-mm-profiling: {type: bool, description: "Skip multimodal memory profiling"}
  video-pruning-rate: {type: float, min: 0, max: 1, description: "Fraction of video tokens pruned, below 1"}
  video-pruning-method: {type: string, enum: [evs, vidcom2], description: "Video token pruning algorithm"}
  mm-tensor-ipc: {type: string, enum: [direct_rpc, torch_shm], description: "IPC method for multimodal tensors"}
  mm-processor-device: {type: string, enum: [auto, cpu, cuda], description: "Device for the HF multimodal processor"}
  mm-ipc-gpu-memory-gb: {type: float, min: 0, description: "GPU memory for frontend multimodal work in GiB"}
  mm-device-do-normalize: {type: bool, description: "Normalize multimodal inputs on the device"}
  no-mm-device-do-normalize: {type: bool, description: "Normalize multimodal inputs on the CPU"}
  enable-lora: {type: bool, description: "Enable LoRA adapter handling"}
  max-loras: {type: int, min: 1, description: "Max LoRAs in a batch"}
  max-lora-rank: {type: int, min: 1, max: 512, description: "Max LoRA rank"}
  lora-dtype: {type: string, enum: [auto, bfloat16, float16], description: "LoRA dtype"}
  enable-tower-connector-lora: {type: bool, description: "LoRA for the vision tower and connector"}
  max-cpu-loras: {type: int, description: "Max LoRAs kept in CPU memory"}
  fully-sharded-loras: {type: bool, description: "Fully shard LoRA layers across tensor parallel"}
  specialize-active-lora: {type: bool, description: "Capture CUDA graphs per active LoRA count"}
  enable-mixed-moe-lora-format: {type: bool, description: "Serve 2D and 3D MoE LoRA formats together"}
  enable-moe-shared-loras: {type: bool, description: "Load MoE expert adapters in shared-outer layout"}
  show-hidden-metrics-for-version: {type: string, description: "Show metrics hidden since this version"}
  per-request-spec-decode-metrics: {type: string, enum: [detailed, none, summary], description: "Speculative decoding metrics in responses"}
  kv-cache-metrics: {type: bool, description: "Enable KV cache residency metrics"}
  kv-cache-metrics-sample: {type: float, min: 0, max: 1, description: "Sampling rate for KV cache metrics"}
  cudagraph-metrics: {type: bool, description: "Enable CUDA graph metrics"}
  enable-layerwise-nvtx-tracing: {type: bool, description: "Enable layerwise NVTX tracing"}
  enable-mfu-metrics: {type: bool, description: "Enable model FLOPs utilization metrics"}
  jit-monitor-mode: {type: string, enum: [error, warn], description: "Handling of post-warmup JIT compilation"}
  max-num-batched-tokens: {type: int, description: "Max tokens processed per iteration"}
  max-num-scheduled-tokens: {type: int, description: "Max tokens scheduled per iteration"}
  max-num-queued-reqs: {type: int, description: "Max in-flight requests before 503"}
  max-num-queued-tokens: {type: int, description: "Max prompt tokens in prefill before 503"}
  long-prefill-token-threshold: {type: int, min: 0, description: "Prompt length counted as a long prefill, 0 off"}
  scheduling-policy: {type: string, enum: [fcfs, priority], description: "Scheduling policy"}
  no-enable-chunked-prefill: {type: bool, description: "Disable chunked prefill"}
  disable-chunked-mm-input: {type: bool, description: "Do not split multimodal items across steps"}
  no-scheduler-reserve-full-isl: {type: bool, description: "Admit requests when only the first chunk fits"}
  watermark: {type: float, min: 0, max: 1, description: "Fraction of KV blocks kept free on admission, below 1"}
  prefill-schedule-interval: {type: int, min: 1, description: "Engine steps between prefill admissions"}
  disable-hybrid-kv-cache-manager: {type: bool, description: "Same KV cache size for all attention layers"}
  no-disable-hybrid-kv-cache-manager: {type: bool, description: "Use the hybrid KV cache manager"}
  async-scheduling: {type: bool, description: "Enable async scheduling"}
  no-async-scheduling: {type: bool, description: "Disable async scheduling"}
  stream-interval: {type: int, min: 1, description: "Tokens buffered per streamed chunk"}
  max-cudagraph-capture-size: {type: int, description: "Max CUDA graph capture size"}
  ir-op-priority: {type: string, description: "IR op dispatch priority as JSON"}
  enable-flashinfer-autotune: {type: bool, description: "Run FlashInfer autotuning during warmup"}
  no-enable-flashinfer-autotune: {type: bool, description: "Skip FlashInfer autotuning"}
  enable-bf16x3-router-gemm: {type: bool, description: "Use the experimental SM100 BF16x3 router GEMM"}
  moe-backend: {type: string, description: "MoE expert kernel backend"}
  linear-backend: {type: string, description: "Linear layer GEMM backend"}
  optimization-level: {type: int, min: 0, max: 3, description: "Startup time versus performance, 0 to 3"}
  performance-mode: {type: string, enum: [balanced, interactivity, throughput], description: "Runtime performance mode"}
  attention-config: {type: string, description: "Attention config as JSON"}
  kernel-config: {type: string, description: "Kernel config as JSON"}
  additional-config: {type: string, description: "Platform-specific config as JSON"}
  reasoning-config: {type: string, description: "Reasoning model config as JSON"}
  diffusion-config: {type: string, description: "Diffusion LLM config as JSON"}
  spec-method: {type: string, description: "Speculative decoding method, e.g. mtp or ngram"}
  spec-tokens: {type: int, min: 1, description: "Speculative tokens per step"}
  fail-on-environ-validation: {type: bool, description: "Fail when environment validation fails"}
  shutdown-timeout: {type: int, min: 0, description: "Graceful shutdown seconds, 0 aborts"}
  gdn-prefill-backend: {type: string, enum: [flashinfer, triton, cutedsl], description: "GDN prefill backend"}
  kda-prefill-backend: {type: string, enum: [auto, triton, flashkda], description: "KDA prefill backend"}

diagnostics:
  runtime: vllm
  runtimes:
    vllm:
      imports: [torch, torchaudio, torchvision, vllm.entrypoints.cli.main, vllm.entrypoints.openai.api_server, vllm.v1.engine.core, flashinfer.comm.fd_exchange]
      packages: [vllm, torch, torchaudio, torchvision, flashinfer-python, flashinfer-cubin, flashinfer-jit-cache]
      checks: [pip_check, imports, cuda_companions, cuda_available]
      kernels: prebuilt_or_jit
      toolkit_minimum: {"12": "12.9"}
      workaround: {VLLM_USE_FLASHINFER_SAMPLER: "0"}
  memory:
    kind: fraction_total
    parameter: gpu-memory-utilization
    device_count_parameter: tensor-parallel-size
    # auto reserves max(2048 MiB, ceil(5% of total)) per GPU by default.
    # Release-owned metadata: positive MiB overrides it; zero/omitted uses the default.
    # auto_safety_margin_mib: 8192
