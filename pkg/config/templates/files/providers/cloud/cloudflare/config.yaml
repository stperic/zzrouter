# MANAGED FILE : overwritten on every cluster sync.
# Edit on the coordinator, never here.
description: "Serverless inference with global edge network"
enabled: false
connection:
  fields:
    - id: account_id
      label: Account ID
      type: identifier
      env: CLOUDFLARE_ACCOUNT_ID
      required: true
      secret: false
    - id: api_key
      label: API key
      type: text
      env: CLOUDFLARE_API_KEY
      required: true
      secret: true
runtime:
  endpoint: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai
  model_url: "https://developers.cloudflare.com/workers-ai/models/%s/"
  models_path: /models/search
  models_response_key: result
  api:
    auth_type: bearer
    auth_header: "Authorization"
    auth_prefix: "Bearer "
    token: "${CLOUDFLARE_API_KEY}"
  health_check:
    path: /models/search
    interval: 60s
    timeout: 10s
    retries: 3
capabilities:
  wire_endpoints: [chat_completions]
