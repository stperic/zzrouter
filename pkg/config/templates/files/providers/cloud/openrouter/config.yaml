# MANAGED FILE : overwritten on every cluster sync.
# Edit on the coordinator, never here.
description: "Cloud inference gateway with 300+ models"
enabled: false
runtime:
  endpoint: https://openrouter.ai/api
  model_url: "https://openrouter.ai/models/%s"
  api:
    auth_type: bearer
    auth_header: "Authorization"
    auth_prefix: "Bearer "
    token: "${OPENROUTER_API_KEY}"
  health_check:
    path: /v1/models
    interval: 60s
    timeout: 10s
    retries: 3
capabilities:
  wire_endpoints: [chat_completions, completions, responses_compat]
