# MANAGED FILE : overwritten on every cluster sync.
# Edit on the coordinator, never here.
description: "Claude frontier AI models"
enabled: false
runtime:
  endpoint: https://api.anthropic.com
  model_url: "https://docs.anthropic.com/en/docs/about-claude/models#%s"
  api:
    auth_type: custom
    custom_headers:
      x-api-key: "${ANTHROPIC_API_KEY}"
      anthropic-version: "2023-06-01"
  health_check:
    path: /v1/models
    interval: 60s
    timeout: 10s
    retries: 3
capabilities:
  wire_endpoints: [chat_completions, messages, responses_compat]
