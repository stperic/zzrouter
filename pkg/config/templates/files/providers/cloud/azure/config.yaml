# MANAGED FILE : overwritten on every cluster sync.
# Edit on the coordinator, never here.
description: "OpenAI and open models on Azure"
enabled: false
runtime:
  endpoint: "${AZURE_OPENAI_ENDPOINT:-https://YOUR_RESOURCE.openai.azure.com/openai}"
  models_path: "/deployments?api-version=2023-03-15-preview"  # Lists deployed models only (not the full catalog)
  api:
    auth_type: custom
    custom_headers:
      api-key: "${AZURE_OPENAI_API_KEY}"
  health_check:
    path: /models
    interval: 60s
    timeout: 10s
    retries: 3
capabilities:
  wire_endpoints: [chat_completions, completions, embeddings, responses]
