# MANAGED FILE : overwritten on every cluster sync.
# Edit on the coordinator, never here.
description: "Frontier multimodal AI models"
enabled: false
connection:
  fields:
    - id: api_key
      label: API key
      type: text
      env: GEMINI_API_KEY
      required: true
      secret: true
runtime:
  endpoint: https://generativelanguage.googleapis.com/v1beta/openai
  model_url: "https://aistudio.google.com/app/prompts/new_chat?model=%s"
  api:
    auth_type: bearer
    auth_header: "Authorization"
    auth_prefix: "Bearer "
    token: "${GEMINI_API_KEY}"
  health_check:
    path: /models
    interval: 60s
    timeout: 10s
    retries: 3
capabilities:
  wire_endpoints: [chat_completions]
