# MANAGED FILE : overwritten on every cluster sync.
# Edit on the coordinator, never here.
description: "GPT and reasoning models"
enabled: false
runtime:
  endpoint: https://api.openai.com
  model_url: "https://platform.openai.com/docs/models#%s"
  api:
    auth_type: bearer
    auth_header: "Authorization"
    auth_prefix: "Bearer "
    token: "${OPENAI_API_KEY}"
  health_check:
    path: /v1/models
    interval: 60s
    timeout: 10s
    retries: 3
capabilities:
  wire_endpoints: [chat_completions, completions, embeddings, responses]
