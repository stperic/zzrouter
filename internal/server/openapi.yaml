  # =========================================================================
  # OpenAI /v1/* stateful pass-through routes
  # =========================================================================
  #
  # Every operation in this block is a pure reverse proxy to the provider
  # configured as openai_compat.default_backend in node.yaml. zzRouter does
  # NOT parse, validate, or rewrite the request/response bodies for these
  # routes , it only enforces auth, routing, and size limits. The
  # authoritative wire schemas live at
  #   https://platform.openai.com/docs/api-reference
  # and change with every OpenAI revision; documenting them here would
  # drift immediately. Instead, each operation declares:
  #
  #   - tags + security (empty , no auth required on the compat surface)
  #   - a short summary explaining which upstream resource is affected
  #   - an `application/json` 200 response with `type: object`
  #   - the full set of error responses zzRouter can emit BEFORE the
  #     request reaches the upstream (400/401/404/413/429/500/502/503/504)
  #
  # POST operations that accept multipart bodies declare
  # `multipart/form-data` on the requestBody.
  #
  # The authoritative route list is in
  # internal/server/routes_compat_passthrough.go. The drift-check test
  # openapi_drift_v1_test.go enforces one-to-one correspondence.
  #
  # When a future session vendors openai/openai-openapi, replace this
  # block with a generated file; the shape matches so the drift check
  # continues to pass without changes.
  # =========================================================================

  # ---------- Responses retrieval / cancel ----------

  /v1/responses/{response_id}:
    parameters:
      - in: path
        name: response_id
        required: true
        schema: { type: string }
    get:
      tags: [OpenAICompat]
      operationId: openaiGetResponse
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Retrieve a response (pass-through)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '404': { $ref: '#/components/responses/OpenAINotFound' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }
        '502': { $ref: '#/components/responses/OpenAIBadGateway' }
        '503': { $ref: '#/components/responses/OpenAIUnavailable' }
    delete:
      tags: [OpenAICompat]
      operationId: openaiDeleteResponse
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Delete a response (pass-through)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '404': { $ref: '#/components/responses/OpenAINotFound' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }
        '502': { $ref: '#/components/responses/OpenAIBadGateway' }
        '503': { $ref: '#/components/responses/OpenAIUnavailable' }

  /v1/responses/{response_id}/cancel:
    parameters:
      - in: path
        name: response_id
        required: true
        schema: { type: string }
    post:
      tags: [OpenAICompat]
      operationId: openaiCancelResponse
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Cancel an in-progress response (pass-through)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '404': { $ref: '#/components/responses/OpenAINotFound' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }
        '502': { $ref: '#/components/responses/OpenAIBadGateway' }
        '503': { $ref: '#/components/responses/OpenAIUnavailable' }

  /v1/responses/{response_id}/input_items:
    parameters:
      - in: path
        name: response_id
        required: true
        schema: { type: string }
    get:
      tags: [OpenAICompat]
      operationId: openaiListResponseInputItems
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: List input items for a response (pass-through)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '404': { $ref: '#/components/responses/OpenAINotFound' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }
        '502': { $ref: '#/components/responses/OpenAIBadGateway' }
        '503': { $ref: '#/components/responses/OpenAIUnavailable' }

  # ---------- Files ----------

  /v1/files:
    post:
      tags: [OpenAICompat]
      operationId: openaiCreateFile
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Upload a file (multipart, pass-through)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/OpenAIBadRequest' }
