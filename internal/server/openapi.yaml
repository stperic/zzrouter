                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NodeParameters' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No provider by that name.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      tags: [Providers]
      operationId: updateProviderNodesParameters
      summary: "Retired: Replace per-node parameter overrides"
      description: |
        Retired. The route is still mounted and answers `410 Gone` with a
        pointer to its replacement: parameters are written with
        `PATCH /zzrouter/v1/providers/{name}/parameters` using RFC 7396
        merge-patch, which reaches every tier in one request.
      deprecated: true
      responses:
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '410':
          description: Gone , write parameters with the merge-patch route
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/{name}/nodes/parameters/{key}:
    parameters:
      - { in: path, name: name, required: true, schema: { type: string } }
      - { in: path, name: key,  required: true, schema: { type: string } }
    delete:
      tags: [Providers]
      operationId: deleteProviderNodesParameter
      summary: "Retired: Delete a per-node parameter override"
      description: |
        Retired. The route is still mounted and answers `410 Gone` with a
        pointer to its replacement: parameters are written with
        `PATCH /zzrouter/v1/providers/{name}/parameters` using RFC 7396
        merge-patch, which reaches every tier in one request.
      deprecated: true
      responses:
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '410':
          description: Gone , write parameters with the merge-patch route
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/{name}/nodes/parameters/{key}/ignore:
    parameters:
      - { in: path, name: name, required: true, schema: { type: string } }
      - { in: path, name: key,  required: true, schema: { type: string } }
    patch:
      tags: [Providers]
      operationId: updateProviderNodesParameterIgnore
      summary: "Retired: Mark a per-node parameter override ignored (soft-delete)"
      description: |
        Retired. The route is still mounted and answers `410 Gone` with a
        pointer to its replacement: parameters are written with
        `PATCH /zzrouter/v1/providers/{name}/parameters` using RFC 7396
        merge-patch, which reaches every tier in one request.
      deprecated: true
      responses:
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '410':
          description: Gone , write parameters with the merge-patch route
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # --------------------------------------------------------------------------
  # Models , card + per-instance detail endpoints.
  # --------------------------------------------------------------------------

  /zzrouter/v1/models/card/{provider}/{id}:
    parameters:
      - { in: path, name: provider, required: true, schema: { type: string } }
      - { in: path, name: id,       required: true, schema: { type: string } }
    get:
      tags: [Models]
      operationId: getModelsCard
      summary: Fetch a model card (registry metadata, description, license)
      description: |
        The upstream registry's card for a model: description, licence,
        files, and for cloud providers the native catalog fields enriched
        with pricing metadata where the upstream is missing some.

        This reads the registry, not this cluster, so a model that is not
        installed still has a card. `provider` is a search provider
        (`huggingface`, `ollama`, a cloud catalog), and the rest of the path
        is the model id, slashes and all.
      responses:
        '200': { description: OK }
        '400':
          description: Unknown search provider, or an unparseable model id.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: The registry has no such model.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: The registry could not be reached or returned something unusable.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/models/instance/{model}:
    parameters: [{ in: path, name: model, required: true, schema: { type: string } }]
    get:
      tags: [Models]
      operationId: getModelsInstance
      summary: Show a model as served by a specific running instance
      description: |
        The running instance serving a model, if any: instance id, port,
        status and provider. A model that is on disk but not loaded is a 404,
        so this doubles as "is it hot right now".

        The path takes the rest of the URL as the model name, so
        `mlx-community/SmolLM-135M-Instruct-4bit` needs no escaping.
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No instance is serving that model.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # --------------------------------------------------------------------------
  # Discovery , granular sub-endpoints beyond /discover.
  # --------------------------------------------------------------------------

  /zzrouter/v1/discover/hardware:
    get:
      tags: [Discovery]
      operationId: getDiscoverHardware
      summary: Discover hardware across the cluster (CPU, RAM, storage, GPU summary)
      description: |
        Full hardware scan of the target node: CPU, memory, disk and GPUs.
        `node` selects which node scans, `*` asks all of them. This probes
        the machine rather than reading a cache, so it is slower than the
        rest of the API.
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: The scan failed on the target node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/discover/network/hosts:
    get:
      tags: [Discovery]
      operationId: listDiscoverNetworkHosts
      summary: Discover reachable hosts on local networks
      description: |
        mDNS scan for other zzRouter nodes on the local network, used by
        pairing to find a coordinator without being told its address.

        It reports what is advertising itself, which is not the same as what
        this node is paired with: `GET /zzrouter/v1/nodes` is the cluster.
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: The scan failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # --------------------------------------------------------------------------
  # Registries , provider-specific registry queries.
  # --------------------------------------------------------------------------

  /zzrouter/v1/registries/huggingface/variants:
    get:
      tags: [Registries]
      operationId: listRegistriesHuggingfaceVariants
      summary: List available Hugging Face model variants for a repo
      description: |
        Quantisation variants available for a HuggingFace repo, so a caller
        can pick a file size before downloading.

        The repo id goes in the `id` query parameter rather than the path,
        because HuggingFace ids contain a slash and path-escaping
        round-trips badly through some proxies and SDKs.
      responses:
        '200': { description: OK }
        '400':
          description: Missing or malformed `id`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '502':
          description: HuggingFace could not be reached or returned something unusable.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/model-groups:
    get:
      tags: [ModelGroups]
      operationId: listModelGroups
      summary: List model groups
      description: |
        Every model group with its replicas, plus the route prefix under
        which they answer. A group is the name a client asks for; the
        replicas are what actually serves it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ModelGroup' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/model-groups/{name}:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    get:
      tags: [ModelGroups]
      operationId: getModelGroup
      summary: Get a model group
      description: |
        One group's configuration, with live cooldown state merged into each
        replica. The `ETag` covers the configuration only, so it stays stable
        while cooldowns change: poll `GET .../state` for the moving parts.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelGroup' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      tags: [ModelGroups]
      operationId: updateModelGroup
      summary: Create or update a model group
      description: |
        Creates a group or replaces one wholesale. An omitted optional field
        is cleared rather than kept, which is what separates this from
        `PATCH`.

        A name that collides with a route literal under `/model-groups` is
        refused at creation, because such a group would be created and then
        permanently shadowed by the route. Groups that already exist keep
        working, so a later route addition cannot strand one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelGroup' }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelGroup' }
        '400':
          description: Reserved name, or a body that fails validation.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '422':
          description: >
            The Idempotency-Key on this request was recorded against a different body. Change the key or send the original body; `code` is `idempotency_key_conflict`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: >
            A duplicate of a request that is still in flight waited out its bound for the original to answer. Retry shortly; `code` is `idempotency_wait_timeout`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

    patch:
      tags: [ModelGroups]
      operationId: patchModelGroup
      summary: Change fields of a model group
      description: |
        RFC 7396 merge-patch over the group's configuration: a key
        absent leaves the value alone, `null` clears it, and `""` sets
        an empty string. `PUT` replaces the whole group, so an omitted
        optional field there is cleared; this route is how a caller
        changes one setting without restating the replica list.

        Patching a group the autoroute generator created claims it: the
        caller's principal is stamped into `auto_owner` and
        `auto_managed` flips to false, so the generator stops
        reconciling it. `DELETE .../owner` reverses that.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              description: Subset of `ModelGroup`; `null` clears a key.
              additionalProperties: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelGroup' }
        '400':
          description: |
            A per-key validation failure carries one `errors` entry per
            offending key, because one patch can fail on several keys at
            once. A body that is not valid JSON, or a `Content-Type` that
            is neither `application/merge-patch+json` nor
            `application/json`, fails before any key is read and carries
            no `errors` array - the top-level `code` is the whole story.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: "Model group not found (`code: route_unknown`)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >
            The Idempotency-Key on this request was recorded against a different body. Change the key or send the original body; `code` is `idempotency_key_conflict`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: >
            A duplicate of a request that is still in flight waited out its bound for the original to answer. Retry shortly; `code` is `idempotency_wait_timeout`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

    delete:
      tags: [ModelGroups]
      operationId: deleteModelGroup
      summary: Delete a model group
      description: |
        Deletes a group. An auto-generated route cannot be deleted this way:
        the generator would recreate it. Release it first with
        `DELETE /zzrouter/v1/model-groups/{name}/owner`, or remove the
        underlying model.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: OK }
        '204': { description: No content }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >
            The Idempotency-Key on this request was recorded against a different body. Change the key or send the original body; `code` is `idempotency_key_conflict`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: >
            A duplicate of a request that is still in flight waited out its bound for the original to answer. Retry shortly; `code` is `idempotency_wait_timeout`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/model-groups/reload:
    post:
      tags: [ModelGroups]
      operationId: reloadModelGroups
      summary: Reload model groups from disk
      description: Re-reads `model_groups.yaml` and applies any external edits.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: The file could not be re-read; the in-memory groups are unchanged.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/model-groups/schema:
    get:
      tags: [ModelGroups]
      operationId: getModelGroupsSchema
      summary: Describe the model-group vocabulary
      description: |
        Every field a model group or replica accepts, and every closed
        enum the routing surface emits (cooldown reasons, attempt skip
        reasons, breaker and health states, event types, error codes).
        An agent reads this once instead of guessing at valid values.

        The body is a configuration projection, so the `ETag` is stable
        across polls: send `If-None-Match` and expect `304`.
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Content hash; changes only when the vocabulary does.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelGroupsSchema' }
        '304':
          description: Not modified. `If-None-Match` matched the current ETag.
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/model-groups/events:
    get:
      tags: [ModelGroups]
      operationId: streamModelGroupEvents
      summary: SSE stream of model-group lifecycle events
      description: |
        Server-Sent Events. The `event:` line carries the event type
        (`route_created`, `breaker_opened`, ...), so a consumer can
        dispatch on it without parsing the body; the `data:` line is a
        JSON-encoded `RouteEvent`.

        Framing matches `GET /zzrouter/v1/spend/events`: a periodic
        `: ping` comment keeps the connection alive, an `events_dropped`
        event reports how many events a slow subscriber missed, and
        `stream_closed` is sent when the server ends the stream.

        Scope is this coordinator's bus. Breaker and cooldown
        transitions on a worker serving direct traffic do not appear
        here.
      parameters:
        - in: query
          name: event_type
          description: |
            Glob over the event type, `path.Match` syntax: `breaker_*`,
            `cooldown_*`, or an exact name like `route_created`. An
            invalid pattern is rejected rather than silently matching
            nothing.
          schema: { type: string }
        - in: query
          name: route
          description: Exact model-group name. Other routes are filtered server-side.
          schema: { type: string }
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema: { type: string }
        '400':
          description: Malformed `event_type` glob.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: This node has no route-event bus configured.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/model-groups/preview:
    post:
      tags: [ModelGroups]
      operationId: previewModelGroups
      summary: Dry-run replica selection across routes
      description: |
        Answers "which replica would serve this, and what would it
        cost" without dispatching. Walks the route table alphabetically
        and applies the same filters and strategy a live request would,
        returning one assignment per route.

        Deterministic by construction: no cooldown or breaker mutation,
        no latency observation, no audit entry. Two identical requests
        against identical state return identical bodies.

        The sweep is capped, and a capped response says so. Narrow it
        with `route`, or use `POST /zzrouter/v1/model-groups/{name}/preview`.
        Steering headers are deliberately not read here: preview takes
        its input from the body only.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutePreviewRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RoutePreviewResponse' }
        '400':
          description: Malformed body or unknown field.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/model-groups/{name}/preview:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    post:
      tags: [ModelGroups]
      operationId: previewModelGroup
      summary: Dry-run replica selection for one route
      description: |
        Same contract as `POST /zzrouter/v1/model-groups/preview` with
        `route` bound from the URL. `assignments` holds one entry, or
        none if the route does not exist.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutePreviewRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RoutePreviewResponse' }
        '400':
          description: Malformed body or unknown field.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/model-groups/{name}/state:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    get:
      tags: [ModelGroups]
      operationId: getModelGroupState
      summary: Live replica state for a model group
      description: |
        Derived state only: cooldown, health, in-flight count and
        observed latency per replica, snapshotted at request time. The
        configuration lives at `GET /zzrouter/v1/model-groups/{name}`.

        No ETag, because the body legitimately changes on every poll.
        `Cache-Control: no-store` is set for the same reason. Fields
        whose tracker is not wired on this node are omitted rather than
        reported as zero.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelGroupState' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Model group not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/model-groups/{name}/history:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    get:
      tags: [ModelGroups]
      operationId: getModelGroupHistory
      summary: Recent dispatches through a model group
      description: |
        A projection of the inference log filtered to this group. Every
        dispatch is included, not just the ones that fell back: a
        single-attempt success carries `fallback_count: 0`, and that is
        still route history. Request bodies and message contents are
        deliberately not projected.
      parameters:
        - in: query
          name: since
          description: RFC3339 timestamp; only entries newer than this are returned.
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          description: Page size. Defaults to 50; the log store enforces its own upper bound.
          schema: { type: integer, minimum: 1, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelGroupHistory' }
        '400':
          description: Malformed `since` or `limit`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Model group not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: This node has no inference log store configured.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/model-groups/{name}/owner:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    delete:
      tags: [ModelGroups]
      operationId: releaseModelGroupOwner
      summary: Return a claimed auto-route to the generator
      description: |
        Clears `auto_owner` and sets `auto_managed` back to true, so the
        autoroute manager reconciles this group again on its next cache
        refresh. This is the only path back from a claim.

        Only a claimed auto-route can be released. A hand-authored group
        has no owner to release, and handing the generator a name it
        never created would let it reap the group as "model gone", so
        that case is a `409` rather than a silent trap.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelGroup' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: "Model group not found (`code: route_unknown`)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: "Not a claimed auto-route (`code: route_not_claimed`)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >
            The Idempotency-Key on this request was recorded against a different body. Change the key or send the original body; `code` is `idempotency_key_conflict`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: >
            A duplicate of a request that is still in flight waited out its bound for the original to answer. Retry shortly; `code` is `idempotency_wait_timeout`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/model-groups/{name}/replicas/{replica}:
    parameters:
      - { in: path, name: name, required: true, schema: { type: string } }
      - in: path
        name: replica
        required: true
        description: Replica name. The URL is the identity, so no body carries one.
        schema: { type: string }
    put:
      tags: [ModelGroups]
      operationId: putModelGroupReplica
      summary: Add or replace one replica
      description: |
        Upsert. The body is the complete replica, so an omitted optional
        field is cleared rather than kept. Use `PATCH` to change one
        field and leave the rest alone.

        Editing a group the autoroute generator created claims it: the
        caller's principal is stamped into `auto_owner` and
        `auto_managed` flips to false, so the generator stops
        reconciling it. `DELETE .../owner` reverses that.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelGroupReplicaUpsert' }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK. Returns the whole group, not just the replica.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelGroup' }
        '400':
          description: Missing required field, unknown field, or unparseable timeout.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: "Model group not found (`code: route_unknown`)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >
            The Idempotency-Key on this request was recorded against a different body. Change the key or send the original body; `code` is `idempotency_key_conflict`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: >
            A duplicate of a request that is still in flight waited out its bound for the original to answer. Retry shortly; `code` is `idempotency_wait_timeout`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

    patch:
      tags: [ModelGroups]
      operationId: patchModelGroupReplica
      summary: Change fields of one replica
      description: |
        RFC 7396 merge-patch over a single replica, same three-meaning
        rule as the provider parameter route: a key absent leaves the
        value alone, `null` clears it, and `""` sets an empty string.
        `name` is owned by the URL and cannot be patched.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              description: Subset of `ModelGroupReplicaUpsert`; `null` clears a key.
              additionalProperties: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK. Returns the whole group.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelGroup' }
        '400':
          description: |
            A per-key validation failure carries one `errors` entry per
            offending key, because one patch can fail on several keys at
            once. A body that is not valid JSON, or a `Content-Type` that
            is neither `application/merge-patch+json` nor
            `application/json`, fails before any key is read and carries
            no `errors` array - the top-level `code` is the whole story.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: "Group or replica not found (`code: route_unknown` or `replica_unknown`)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >
            The Idempotency-Key on this request was recorded against a different body. Change the key or send the original body; `code` is `idempotency_key_conflict`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: >
            A duplicate of a request that is still in flight waited out its bound for the original to answer. Retry shortly; `code` is `idempotency_wait_timeout`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

    delete:
      tags: [ModelGroups]
      operationId: deleteModelGroupReplica
      summary: Remove one replica
      description: |
        Refuses to remove the last replica in a group: an empty group
        would answer every request for its model with a routing failure,
        so deleting the group is the honest operation. Delete the group
        itself with `DELETE /zzrouter/v1/model-groups/{name}`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: "Group or replica not found (`code: route_unknown` or `replica_unknown`)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: "Last replica in the group (`code: replica_last_in_group`)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >
            The Idempotency-Key on this request was recorded against a different body. Change the key or send the original body; `code` is `idempotency_key_conflict`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: >
            A duplicate of a request that is still in flight waited out its bound for the original to answer. Retry shortly; `code` is `idempotency_wait_timeout`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/inference-logs/stream:
    get:
      tags: [InferenceLogs]
      operationId: getInferenceLogsStream
      summary: SSE stream of new inference log entries
      description: |
        Server-Sent Events. Each event `data:` line is a JSON-encoded
        `InferenceLogEntry`. Clients should disable response buffering.
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: Inference logging is not enabled on this node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/inference-logs/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [InferenceLogs]
      operationId: getInferenceLog
      summary: Get a single inference log entry
      description: |
        One inference record by id, with the routing decision and the
        fallbacks it went through.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InferenceLogEntry' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/pricing:
    get:
      tags: [Pricing]
      operationId: listPricing
      summary: Search or list pricing data
      description: |
        Without query params, returns a small summary with the total
        model count. Pass `q` and/or `provider` to filter , the
        response switches to a list envelope carrying up to 50
        `PricingListItem` rows.
      parameters:
        - in: query
          name: q
          description: Substring match against the model id.
          schema: { type: string }
        - in: query
          name: provider
          description: LiteLLM provider key filter.
          schema: { type: string }
      responses:
        '200':
          description: Summary (no filters) or filtered list.
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/ListEnvelope'
                      - type: object
                        properties:
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/PricingListItem' }
                  - allOf:
                      - $ref: '#/components/schemas/SuccessEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [model_count]
                            properties:
                              model_count: { type: integer, minimum: 0 }
                              hint:        { type: string }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: Pricing feature disabled (see `models.pricing.enabled` in node.yaml).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/pricing/status:
    get:
      tags: [Pricing]
      operationId: getPricingStatus
      summary: Pricing cache metadata
      description: |
        Metadata about the pricing cache: when it was last fetched, how many
        models it covers, and where it came from. Read it when a cost looks
        wrong, before concluding a model is unpriced.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PricingStatus' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: Pricing feature disabled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/pricing/overrides:
    get:
      tags: [Pricing]
      operationId: listPricingOverrides
      summary: List operator price overrides
      description: |
        Every operator-set price override. Overrides win over the fetched
        catalog, which is how a negotiated rate or a self-hosted cost gets
        into spend accounting.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count: { type: integer, minimum: 0 }
                          overrides:
                            type: array
                            items: { $ref: '#/components/schemas/PricingOverride' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: Pricing feature disabled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [Pricing]
      operationId: createPricingOverride
      summary: Add or replace a price override
      description: |
        Upsert keyed on (`provider`, `model`) , a second POST for the same
        pair is a correction, not a conflict. Rates are dollars per
        million tokens.

        An all-zero override is legal and load-bearing: it declares a
        provider that does not bill per token (a subscription plan, or
        local hardware), which stops its traffic being reported as
        un-priced on `/pricing/status`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricingOverride' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PricingOverride' }
        '400':
          description: Missing model, negative rate, or a wildcard with no provider.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: Pricing feature disabled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Pricing]
      operationId: deletePricingOverrides
      summary: Remove a price override
      description: Restores upstream pricing for the model.
      parameters:
        - in: query
          name: model
          required: true
          schema: { type: string }
        - in: query
          name: provider
          description: Must match the scope the override was created with.
          schema: { type: string }
      responses:
        '200': { description: Deleted. }
        '400':
          description: Missing model parameter.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No override for that model.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Pricing feature disabled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/pricing/{model}:
    parameters: [{ in: path, name: model, required: true, schema: { type: string } }]
    get:
      tags: [Pricing]
      operationId: getModelPricing
      summary: Lookup pricing for a model
      description: |
        Price for one model. This path form works for names without slashes;
        for a namespaced name like `openai/gpt-4o`, use
        `GET /zzrouter/v1/pricing?model=<exact>` instead. `provider`
        disambiguates a model sold by more than one.
      parameters:
        - in: query
          name: provider
          description: Disambiguates when multiple providers publish the same model id.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PricingEntry' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No pricing data for the requested model.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Pricing feature disabled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/update/status:
    get:
      tags: [Update]
      operationId: getUpdateStatus
      summary: Local or selected-node update status
      description: |
        Where this node's self-update stands: current version, whether a
        release is pending, and the progress of an apply that is running.
        Poll it after `POST /update/apply`, which is also what a node that
        delegates to a privileged updater tells you to do.
      parameters:
        - in: query
          name: nodes
          description: Comma-separated node names, or all. Omit for the legacy local response.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/UpdateStatus'
                          - $ref: '#/components/schemas/NodeUpdateCollection'
        '400':
          description: Invalid node selector or strict request body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: Update subsystem not initialized. Scheduled updates may be disabled without disabling this route.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/update/check:
    post:
      tags: [Update]
      operationId: createUpdateCheck
      summary: Trigger an update check
      description: |
        Asks the release source now instead of waiting for the scheduled
        check. The answer says whether an update is available, what this node
        is running, and if it declined to offer one, why.

        Body-less apply uses this pending result. Exact-version apply resolves its own tag.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateCheckResult' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: Update check failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Update subsystem not initialized.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/update/apply:
    post:
      tags: [Update]
      operationId: createUpdateApply
      summary: Apply an exact release to selected nodes, or the local pending release
      description: |
        With a body, queues one durable job for the exact GitHub release version.
        Nodes defaults to this coordinator; ["all"] snapshots known cluster membership.
        Workers update serially before the coordinator. First failure skips remaining
        targets. A sleeping node stays pending until reconnect. Cancel through
        DELETE /jobs/{id}; already accepted node work may finish. Each node downloads
        and verifies the signed release itself, then confirms health or rolls back.
        Only versions and node names are accepted, never binaries or URLs.
        Breaking protocol changes require operator coordination and rollback of every
        node if any fails. This route does not orchestrate protocol cutover.

        Without a body, applies the local pending update. Two shapes, depending on how this node
        installs:

        - It installs its own updates: `202` with a `job_id`, and progress on
          `GET /zzrouter/v1/jobs/{id}/stream`. The apply survives the client
          disconnecting.
        - It delegates to a privileged updater (a root-owned install
          directory): `202` naming where the request went, with no job id,
          because the work runs in a process this one does not own. Poll
          `GET /zzrouter/v1/update/status`.

        A `409` means no update is pending; run the check first.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: string, maxLength: 128, example: '0.1.2-lab.1', description: Canonical SemVer without the v prefix. }
                nodes:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items: { type: string }
                  example: [all]
      responses:
        '202':
          description: |
            Queued exact-version rollout includes job_id, version, state and per-node nodes.
            For body-less apply, `data.job_id` is present when this node applies
            the update itself; `data.delegated_to` is present instead
            when a privileged updater took the request.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          job_id:
                            type: string
                            description: Subscribe on the job stream for progress.
                          delegated_to:
                            type: string
                            description: Where the privileged updater received the request.
                          action:
                            type: string
                          version: { type: string }
                          state: { type: string }
                          nodes:
                            type: array
                            items: { $ref: '#/components/schemas/NodeUpdate' }
        '400':
          description: Invalid node selector or strict request body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '409':
          description: Another rollout is active, or no local update is pending for body-less apply.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Apply failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Update control not initialized. Explicit updates work with enabled=false.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/update/settings:
    parameters:
      - in: query
        name: node
        description: One known node name. Defaults to the coordinator.
        schema: { type: string }
    get:
      tags: [Update]
      operationId: getUpdateSettings
      summary: Read whether scheduled updates are enabled on one node
      description: Admin-only. Select one known node or omit node for the coordinator. Reports persisted scheduled updating; explicit API updates remain available when enabled is false.
      responses:
        '200':
          description: Current persisted setting in data.node and data.enabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateSettingsEnvelope' }
        '400':
          description: Invalid node or strict request body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: Node unavailable, unsupported, or updater not initialized.
    patch:
      tags: [Update]
      operationId: patchUpdateSettings
      summary: Persist update.enabled on one node
      description: Admin-only. Controls scheduled checks and installs, not explicit API updates. No other configuration fields may be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Setting persisted and active in the scheduler.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateSettingsEnvelope' }
        '400':
          description: Invalid node or strict request body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: Persistence failed; the setting remains unchanged.
        '503':
          description: Node unavailable, unsupported, or updater not initialized.

  /zzrouter/v1/update/rollback:
    post:
      tags: [Update]
      operationId: createUpdateRollback
      summary: Roll back to the previous version (manual restart required)
      description: |
        Restores the previous binary from backup. Answers `200` once the
        files are back, or `202` when the node delegates to a privileged
        updater.

        The new binary is on disk either way; the running process is still
        the old one until it restarts, which is manual.
      responses:
        '200':
          description: Rollback successful. The process still runs the old binary until it restarts.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:     { type: string }
                  backup_path: { type: string }
        '202':
          description: |
            Handed to the privileged updater, which owns the install
            directory. No job id: the work runs in another process.
            Poll `GET /zzrouter/v1/update/status`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No backup to roll back to.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Rollback failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Update subsystem not initialized.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/update/history:
    get:
      tags: [Update]
      operationId: getUpdateHistory
      summary: Past update events (most recent first)
      description: |
        Past update attempts on this node, applied and failed, with versions
        and timestamps. The record that says whether a version was ever
        actually installed here.
      parameters:
        - in: query
          name: nodes
          description: Comma-separated node names, or all. Omit for the legacy local history.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UpdateHistory'
                  - allOf:
                      - $ref: '#/components/schemas/SuccessEnvelope'
                      - type: object
                        properties:
                          data: { $ref: '#/components/schemas/NodeUpdateCollection' }
        '400':
          description: Invalid node selector or strict request body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: Failed to read update history.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Update subsystem not initialized.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/search:
    get:
      tags: [Search]
      operationId: getSearch
      summary: Search models across the cluster
      description: |
        Searches the configured upstream registries for models, not this
        cluster's inventory. Use it to find something to download;
        `GET /zzrouter/v1/models` is what is already here.

        Narrow with `registry` when a query is slow: each registry is a
        network call, and one slow upstream holds the whole answer.
      responses:
        '200': { description: OK }
        '400':
          description: Malformed query or an unknown registry.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '502':
          description: A registry could not be reached.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/cache/stats:
    get:
      tags: [Cache]
      operationId: listCacheStats
      summary: Cache statistics
      description: |
        Model-cache statistics for the node: entries, size and hit rates.
        The cache is what makes a model list cheap, so a low hit rate here
        explains a slow `GET /zzrouter/v1/models`.
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/spend/events:
    get:
      tags: [Spend]
      operationId: streamSpendEvents
      summary: SSE stream of budget threshold and breach events
      description: |
        Server-Sent Events, one per quota event, on the `breach` event
        name with a JSON `SpendBreachEvent` body. Threshold crossings
        arrive on the same stream and are told apart by `reason` and
        `threshold_percent`, so an agent can warn before it is cut off
        rather than discovering the limit by being refused.

        Framing matches `GET /zzrouter/v1/jobs/{id}/stream`: a periodic
        `: ping` comment, an `events_dropped` event carrying
        `{since, current}` when a slow subscriber missed events, and
        `stream_closed` when the server ends the stream.
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: Spend events are disabled on this node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/config/reload:
    post:
      tags: [Config]
      operationId: reloadConfig
      summary: Re-read the providers directory from disk
      description: |
        Re-reads `providers/` and offers the change to every registered
        listener, returning what each one did with it. Edits made on
        disk take effect here without a restart.

        The status code carries the worst disposition, so a caller can
        branch without walking the entries:

        | Status | Meaning |
        |---|---|
        | `200` | Applied, or ignored by every listener. Nothing further to do |
        | `409` | Some listener needs a process restart for its part to take effect |
        | `422` | Some listener rejected the change; it is not in effect |

        A `200` where every entry says `ignored` is a real outcome, not
        an error: nothing the listeners care about changed.
      responses:
        '200':
          description: Reload complete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReloadReport' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '409':
          description: Applied in part; at least one listener requires a restart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReloadReport' }
        '422':
          description: Rejected by at least one listener; the change is not in effect.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReloadReport' }
        '500':
          description: The disk read failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: This node has no provider config loaded.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/state/snapshot:
    post:
      tags: [State]
      operationId: createStateSnapshot
      summary: Download this node's persistent state as a tar.gz
      description: |
        Flushes the key, team and model-group stores, then streams a
        gzipped tar of `keys.yaml`, `teams.yaml`, `model_groups.yaml`
        and `spend.json`. A file that does not exist is skipped rather
        than archived empty.

        Two things to know before using it as a backup:

        - The archive is the raw on-disk files, including the Argon2id
          hashes that `GET /zzrouter/v1/keys` redacts. An admin key
          gets material the key listing deliberately withholds; treat
          the download accordingly.
        - Reads are not fenced against concurrent admin writes, and
          `spend.json` reflects the spend tracker's last flush rather
          than the instant of the request. Quiesce the node if you need
          a coherent point-in-time image.
      responses:
        '200':
          description: Gzipped tar, sent as an attachment.
          content:
            application/gzip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: A store failed to flush, or a file could not be read or archived.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: This node has no config directory configured.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/state/restore:
    post:
      tags: [State]
      operationId: restoreState
      summary: Restore persistent state from a snapshot archive
      description: |
        Accepts an archive produced by
        `POST /zzrouter/v1/state/snapshot`, writes the files it carries
        into the config directory, and reloads the matching in-memory
        stores so the running node sees the restored state without a
        restart.

        Only the four snapshot filenames are accepted, and only as bare
        names: an entry with a path in it is rejected rather than
        written. Each entry is size-capped, so an admin-key holder
        cannot post a decompression bomb.

        Every entry is decoded and validated before anything is
        written, then files are staged as siblings and renamed in a
        fixed order. A crash mid-restore therefore leaves a
        deterministic prefix applied, and re-posting the same archive
        is the recovery.

        Restoring a `keys.yaml` replaces the key set wholesale, which is
        the one path that bypasses reserved-name validation. That is
        deliberate: a round-trip has to reproduce what it captured.
      requestBody:
        required: true
        content:
          application/gzip:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: |
            Restored. `restored` names the files the archive actually
            carried; a file absent from the archive is left untouched
            rather than cleared.
          content:
            application/json:
              schema:
                type: object
                required: [restored]
                properties:
                  restored:
                    type: array
                    items: { type: string }
                    example: [keys.yaml, teams.yaml]
        '400':
          description: Not a valid gzip or tar, or it carries an entry outside the accepted set.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '413':
          description: An entry exceeds the per-entry size cap.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: |
            Staging, renaming or reloading failed. Disk is consistent,
            but in-memory state may be partially new: restart the node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: This node has no config directory configured.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/spend/report:
    get:
      tags: [Spend]
      operationId: getSpendReport
      summary: Spend report aggregated by key
      description: |
        Spend grouped by key or team over a window, from settled inference
        records. This is the accounting view; the per-key counter that
        enforcement reads is `GET /zzrouter/v1/keys/{id}/usage`, and the two
        can disagree while requests are in flight.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SpendReport' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  # ==========================================================================
  # OpenAI-compatible /v1/* routes , error responses are declared uniformly
  # via $ref to keep the spec compact and drift-free. Request/response body
  # schemas for the core inference endpoints are typed as generic objects
  # because zzRouter forwards the full OpenAI request shape verbatim; the
  # authoritative schema lives at https://github.com/openai/openai-openapi
  # (MIT). The 58 stateful pass-through routes (/v1/files, /v1/batches,
  # /v1/assistants, /v1/threads, /v1/vector_stores, /v1/fine_tuning,
  # /v1/uploads, /v1/responses/{id}) are NOT enumerated here , they are
  # pure reverse proxies to openai_compat.default_backend whose schemas
  # match the OpenAI upstream exactly. A follow-up session will vendor
  # the upstream spec and splice those paths in. See
  # docs/plan_openai_compat_compliance.md Phase B4.
  # ==========================================================================

  /v1/chat/completions:
    post:
      tags: [OpenAICompat]
      operationId: openaiCreateChatCompletion
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: OpenAI-compatible chat completion
      description: |
        Terminates at zzRouter's routing layer. Selects a backend
        (vLLM / llama.cpp / MLX / cloud) from the `model` field and
        forwards the request. Supports streaming via `stream: true`.

        Image-bearing input is admitted before endpoint selection and replica
        fallback. Present vision replicas are preferred; when none is present,
        unknown replicas remain usable. If every target is known ineligible,
        the request returns 400 in this surface's error envelope with a fix.
        An explicit unsupported-image backend 500 is classified as invalid
        input, without retry or deployment/provider cooldown. Genuine server
        failures keep their status. Errors before stream opening remain HTTP
        errors; after committed cold-progress headers they travel in-band.
        Image input is recognized in message content `image_url` blocks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model:       { type: string }
                messages:    { type: array, items: { type: object } }
                stream:      { type: boolean, default: false }
                temperature: { type: number }
                max_tokens:  { type: integer }
                tools:       { type: array, items: { type: object } }
                tool_choice:
                  oneOf:
                    - { type: string }
                    - { type: object }
                response_format: { type: object }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK , JSON body or Server-Sent Events stream.
          content:
            application/json:
              schema: { type: object }
            text/event-stream:
              schema:
                type: string
                description: "OpenAI stream chunks terminated by `data: [DONE]`."
        '400': { $ref: '#/components/responses/OpenAIBadRequest' }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '403': { $ref: '#/components/responses/OpenAIForbidden' }
        '404': { $ref: '#/components/responses/OpenAINotFound' }
        '409': { $ref: '#/components/responses/OpenAIModelNameConflict' }
        '413': { $ref: '#/components/responses/OpenAIRequestTooLarge' }
        '422':
          description: >
            The Idempotency-Key on this request was recorded against a different body. Change the key or send the original body; `code` is `idempotency_key_conflict`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }
        '429': { $ref: '#/components/responses/OpenAIRateLimit' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }
        '502': { $ref: '#/components/responses/OpenAIBadGateway' }
        '503': { $ref: '#/components/responses/OpenAIUnavailable' }
        '504': { $ref: '#/components/responses/OpenAIGatewayTimeout' }
    get:
      tags: [OpenAICompat]
      operationId: openaiListChatCompletions
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Endpoint connectivity probe
      description: Many clients GET this path before POSTing; zzRouter returns a JSON info object with HTTP 200.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }

  /v1/chat/completions/{completion_id}:
    parameters:
      - in: path
        name: completion_id
        required: true
        schema: { type: string }
    get:
      tags: [OpenAICompat]
      operationId: openaiGetChatCompletion
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Retrieve a stored chat completion (pass-through)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '404': { $ref: '#/components/responses/OpenAINotFound' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }
        '502': { $ref: '#/components/responses/OpenAIBadGateway' }
        '503': { $ref: '#/components/responses/OpenAIUnavailable' }
    post:
      tags: [OpenAICompat]
      operationId: openaiModifyChatCompletion
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Update metadata on a stored chat completion (pass-through)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/OpenAIBadRequest' }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '404': { $ref: '#/components/responses/OpenAINotFound' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }
        '502': { $ref: '#/components/responses/OpenAIBadGateway' }
        '503': { $ref: '#/components/responses/OpenAIUnavailable' }
    delete:
      tags: [OpenAICompat]
      operationId: openaiDeleteChatCompletion
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Delete a stored chat completion (pass-through)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '404': { $ref: '#/components/responses/OpenAINotFound' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }
        '502': { $ref: '#/components/responses/OpenAIBadGateway' }
        '503': { $ref: '#/components/responses/OpenAIUnavailable' }

  /v1/chat/completions/{completion_id}/messages:
    parameters:
      - in: path
        name: completion_id
        required: true
        schema: { type: string }
    get:
      tags: [OpenAICompat]
      operationId: openaiListChatCompletionMessages
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: List messages of a stored chat completion (pass-through)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '404': { $ref: '#/components/responses/OpenAINotFound' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }
        '502': { $ref: '#/components/responses/OpenAIBadGateway' }
        '503': { $ref: '#/components/responses/OpenAIUnavailable' }

  /v1/completions:
    post:
      tags: [OpenAICompat]
      operationId: openaiCreateCompletion
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: OpenAI-compatible legacy text completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model:      { type: string }
                prompt:     { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
                stream:     { type: boolean, default: false }
                max_tokens: { type: integer }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK , JSON body or Server-Sent Events stream.
          content:
            application/json:
              schema: { type: object }
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/OpenAIBadRequest' }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '404': { $ref: '#/components/responses/OpenAINotFound' }
        '409': { $ref: '#/components/responses/OpenAIModelNameConflict' }
        '413': { $ref: '#/components/responses/OpenAIRequestTooLarge' }
        '422':
          description: >
            The Idempotency-Key on this request was recorded against a different body. Change the key or send the original body; `code` is `idempotency_key_conflict`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }
        '429': { $ref: '#/components/responses/OpenAIRateLimit' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }
        '502': { $ref: '#/components/responses/OpenAIBadGateway' }
        '503': { $ref: '#/components/responses/OpenAIUnavailable' }
        '504': { $ref: '#/components/responses/OpenAIGatewayTimeout' }
    get:
      tags: [OpenAICompat]
      operationId: openaiListCompletions
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Endpoint connectivity probe
      responses:
        '200': { description: OK }

  /v1/rerank:
    post:
      tags: [OpenAICompat]
      operationId: openaiCreateRerank
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Rerank candidate passages against a query
      description: |
        Routes a rerank request to a rerank-capable backend selected by
        the `model` field. The request body matches the widely-adopted
        Cohere-style shape (query + documents + optional top_n), and
        the response is forwarded verbatim from the backend. Used by
        retrieval-augmented generation pipelines to sort candidate
        passages by relevance before passing them to a chat model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, query, documents]
              properties:
                model: { type: string }
                query: { type: string }
                documents:
                  type: array
                  items:
                    oneOf:
                      - { type: string }
                      - { type: object }
                top_n: { type: integer, minimum: 1 }
                return_documents: { type: boolean }
                max_chunks_per_doc: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/OpenAIBadRequest' }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '409': { $ref: '#/components/responses/OpenAIModelNameConflict' }
        '404': { $ref: '#/components/responses/OpenAINotFound' }
        '429': { $ref: '#/components/responses/OpenAIRateLimit' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }
        '502': { $ref: '#/components/responses/OpenAIBadGateway' }
        '503': { $ref: '#/components/responses/OpenAIUnavailable' }

  /v1/embeddings:
    post:
      tags: [OpenAICompat]
      operationId: openaiCreateEmbedding
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: OpenAI-compatible embeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model: { type: string }
                input:
                  oneOf:
                    - { type: string }
                    - { type: array, items: { type: string } }
                encoding_format: { type: string, enum: [float, base64] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/OpenAIBadRequest' }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '404': { $ref: '#/components/responses/OpenAINotFound' }
        '409': { $ref: '#/components/responses/OpenAIModelNameConflict' }
        '429': { $ref: '#/components/responses/OpenAIRateLimit' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }
        '502': { $ref: '#/components/responses/OpenAIBadGateway' }
        '503': { $ref: '#/components/responses/OpenAIUnavailable' }
    get:
      tags: [OpenAICompat]
      operationId: openaiListEmbeddings
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Endpoint connectivity probe
      responses:
        '200': { description: OK }

  /v1/models:
    get:
      tags: [OpenAICompat]
      operationId: openaiListModels
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: OpenAI-compatible list models
      description: |
        Returns every model currently routable through this coordinator,
        with capabilities (chat / completions / embeddings / tools /
        vision / stream / json_mode) derived from the provider
        registration. Agents can use `capabilities` to pick a model
        without hard-coding per-model flags.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { type: string, enum: [list] }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OpenAIModel' }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }

  /v1/model/info:
    get:
      tags: [OpenAICompat]
      operationId: openaiGetModelInfo
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Model inventory with routing metadata
      description: |
        Returns the same underlying model set as `/v1/models`, reshaped
        into an envelope that exposes per-model routing metadata. Each
        entry carries the public `model_name`, zzrouter routing metadata
        (node / provider / protocol), and the full capabilities dict.
        Intended for admin and introspection tooling that needs to see
        how each public model name is wired to a backend.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [model_name, routing, model_info]
                      properties:
                        model_name: { type: string }
                        routing:
                          type: object
                          properties:
                            node: { type: string }
                            provider: { type: string }
                            protocol: { type: string }
                        model_info:
                          type: object
                          required: [id, capabilities, created]
                          properties:
                            id: { type: string }
                            capabilities: { $ref: '#/components/schemas/OpenAIModelCapabilities' }
                            created: { type: integer }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }

  /v1/models/{model}:
    parameters:
      - in: path
        name: model
        required: true
        schema: { type: string }
        description: Canonical model name. May contain forward slashes.
    get:
      tags: [OpenAICompat]
      operationId: openaiGetModel
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: OpenAI-compatible model details
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIModel' }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '404': { $ref: '#/components/responses/OpenAINotFound' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }
    delete:
      tags: [OpenAICompat]
      operationId: openaiDeleteModel
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: OpenAI-compatible delete model
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '404': { $ref: '#/components/responses/OpenAINotFound' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }

  /v1:
    get:
      tags: [OpenAICompat]
      operationId: openaiGetApiRoot
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Root endpoint probe
      responses:
        '200': { description: OK }
    post:
      tags: [OpenAICompat]
      operationId: openaiPostApiRoot
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Root endpoint probe
      responses:
        '200': { description: OK }

  /v1/responses:
    post:
      tags: [OpenAICompat]
      operationId: openaiCreateResponse
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: OpenAI Responses API (unified)
      description: |
        The model resolves to native `responses` or translated `responses_compat`
        using per-model runtime endpoints before static provider capabilities.
        Translation dispatches Chat Completions and returns Responses JSON or
        SSE. A previous_response_id with stored affinity keeps its provider;
        image admission checks that pinned target without redirecting state.
        Provider-only affinity with ambiguous matching models remains unknown.

        Image-bearing input is admitted before endpoint selection and replica
        fallback. Present vision replicas are preferred; when none is present,
        unknown replicas remain usable. If every target is known ineligible,
        the request returns 400 in this surface's error envelope with a fix.
        An explicit unsupported-image backend 500 is classified as invalid
        input, without retry or deployment/provider cooldown. Genuine server
        failures keep their status. Errors before stream opening remain HTTP
        errors; after committed cold-progress headers they travel in-band.
        Images are recognized as `input_image` in message input content.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK , JSON body or Server-Sent Events stream.
          content:
            application/json:
              schema: { type: object }
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/OpenAIBadRequest' }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '404': { $ref: '#/components/responses/OpenAINotFound' }
        '409': { $ref: '#/components/responses/OpenAIModelNameConflict' }
        '422':
          description: >
            The Idempotency-Key on this request was recorded against a different body. Change the key or send the original body; `code` is `idempotency_key_conflict`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }
        '429': { $ref: '#/components/responses/OpenAIRateLimit' }
        '500': { $ref: '#/components/responses/OpenAIInternal' }
        '502': { $ref: '#/components/responses/OpenAIBadGateway' }
        '503': { $ref: '#/components/responses/OpenAIUnavailable' }
        '504': { $ref: '#/components/responses/OpenAIGatewayTimeout' }

  /v1/messages:
    post:
      tags: [AnthropicCompat]
      operationId: anthropicCreateMessage
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Anthropic Messages API
      description: |
        The `model` field selects the backend, and its provider's
        `capabilities.wire_endpoints` decides how the request is served:
        `messages` (an engine that speaks the API, such as llama-server)
        passes the body and the reply, streamed or not, through verbatim;
        `messages_compat` (an engine that speaks only Chat Completions,
        such as mlx_lm.server or vLLM) translates the request to Chat
        Completions and the reply, streamed or not, back to Messages.
        Server tools and `document` blocks have no Chat Completions form:
        the former are left out, the latter refused. Tokens, including
        cache reads, are metered and settled against the caller's key like
        a chat completion. Every error, zzRouter's or the engine's, uses
        the Anthropic envelope.

        Models that accept this route list `messages` in their
        `/v1/models` `endpoints`; any other model answers 400. A variant's
        `request` defaults (`GET /zzrouter/v1/providers/{name}/resolved`)
        fill fields the client did not send. Query parameters such as
        Claude Code's `?beta=true` and the `anthropic-version` and
        `anthropic-beta` headers are accepted. Auth follows the rest of
        `/v1`: a key, sent as `x-api-key` or `Authorization: Bearer`,
        unless the node is set to answer without one. Setup for Claude Code:
        docs/agent_quickstart.md.

        Image-bearing input is admitted before endpoint selection and replica
        fallback. Present vision replicas are preferred; when none is present,
        unknown replicas remain usable. If every target is known ineligible,
        the request returns 400 in this surface's error envelope with a fix.
        An explicit unsupported-image backend 500 is classified as invalid
        input, without retry or deployment/provider cooldown. Genuine server
        failures keep their status. Errors before stream opening remain HTTP
        errors; after committed cold-progress headers they travel in-band.
        `image` blocks include images nested in `tool_result.content`. On a
        translated engine, tool text and call IDs stay in tool replies and URL
        or base64 images are lifted into the following user turn. Native bodies
        remain unchanged. Effective model runtime endpoints, including running
        snapshots, override static provider wire endpoints.
      externalDocs:
        description: Anthropic Messages API, the canonical request and response schema
        url: https://docs.anthropic.com/en/api/messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              description: |
                The Anthropic Messages request. Only `model` is checked
                here; the rest is the engine's to validate, or the
                translation's (see the operation description).
              properties:
                model:          { type: string, description: 'A model id from /v1/models whose `endpoints` include `messages`, with or without its `@node` suffix.' }
                max_tokens:     { type: integer }
                messages:       { type: array, items: { type: object } }
                system:
                  oneOf:
                    - { type: string }
                    - { type: array, items: { type: object } }
                stream:         { type: boolean, default: false }
                tools:          { type: array, items: { type: object } }
                tool_choice:    { type: object }
                temperature:    { type: number }
                top_p:          { type: number }
                top_k:          { type: integer }
                stop_sequences: { type: array, items: { type: string } }
                metadata:       { type: object }
      responses:
        '200':
          description: OK , a Message, or its Server-Sent Events stream.
          content:
            application/json:
              schema: { type: object }
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/AnthropicError' }
        '401': { $ref: '#/components/responses/AnthropicError' }
        '402': { $ref: '#/components/responses/AnthropicError' }
        '403': { $ref: '#/components/responses/AnthropicError' }
        '404': { $ref: '#/components/responses/AnthropicError' }
        '409': { $ref: '#/components/responses/AnthropicError' }
        '429': { $ref: '#/components/responses/AnthropicError' }
        '500': { $ref: '#/components/responses/AnthropicError' }
        '502': { $ref: '#/components/responses/AnthropicError' }
        '503': { $ref: '#/components/responses/AnthropicError' }
        '504': { $ref: '#/components/responses/AnthropicError' }

  /v1/messages/count_tokens:
    post:
      tags: [AnthropicCompat]
      operationId: anthropicCountTokens
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Count the input tokens of a Messages request
      description: |
        Routed like /v1/messages. A `messages` provider counts; on a
        `messages_compat` provider the count is the prompt usage of a
        one-token completion, exact on every engine at the cost of one
        prefill. Either way the caller is authorized but not metered: no
        RPM tick and no budget hold.

        The same image admission and translated tool-result image preservation
        as /v1/messages applies. Refusals use the Anthropic 400 envelope; counting
        remains authorized without inference metering.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [model] }
      responses:
        '200':
          description: 'OK , `{"input_tokens": N}` from the provider.'
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/AnthropicError' }
        '401': { $ref: '#/components/responses/AnthropicError' }
        '403': { $ref: '#/components/responses/AnthropicError' }
        '404': { $ref: '#/components/responses/AnthropicError' }
        '409': { $ref: '#/components/responses/AnthropicError' }
        '500': { $ref: '#/components/responses/AnthropicError' }
        '502': { $ref: '#/components/responses/AnthropicError' }
        '503': { $ref: '#/components/responses/AnthropicError' }

