components:
  securitySchemes:
    AdminKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Admin API key for `/zzrouter/v1/*`.
    InferenceBearer:
      type: http
      scheme: bearer
      description: |
        A key for the inference routes (/v1/*, /api/*): a virtual key from
        POST /zzrouter/v1/keys, or a static key. The `{}` alternative on
        these operations means a node may be configured to answer without
        one (auth.require_compat_auth: false, loopback nodes only by
        default); GET /zzrouter/v1 reports which in
        data.authentication.compatible_apis.
    InferenceKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: The same key as InferenceBearer, in the X-API-Key header.

  headers:
    XRequestID:
      description: |
        Per-request correlation ID. Echoed on every /zzrouter/v1/* response
        (success and failure). Clients may pass an inbound `X-Request-ID`
        header to join a trace, or let the server mint one.
      schema: { type: string }
    XAPIVersion:
      description: |
        Management-API revision string. Bumped on breaking changes to the
        /zzrouter/v1/* surface. Clients can pin to a version to fail-fast
        on upgrade.
      schema: { type: string, example: v1 }
    RetryAfter:
      description: Suggested delay in delta-seconds before retrying.
      schema: { type: integer, minimum: 0 }
    XRateLimitLimitRequests:
      description: Per-minute request budget for the calling key (RPM).
      schema: { type: integer, minimum: 0 }
    XRateLimitRemainingRequests:
      description: Requests remaining in the current RPM window.
      schema: { type: integer, minimum: 0 }
    XRateLimitResetRequests:
      description: Duration until the RPM window resets (e.g. `250ms`, `12s`).
      schema: { type: string }
    XRateLimitLimitTokens:
      description: Per-minute token budget for the calling key (TPM).
      schema: { type: integer, minimum: 0 }
    XRateLimitRemainingTokens:
      description: Tokens remaining in the current TPM window.
      schema: { type: integer, minimum: 0 }
    XRateLimitResetTokens:
      description: Duration until the TPM window resets.
      schema: { type: string }

  parameters:
    RestartParam:
      in: query
      name: restart
      description: |
        `affected` restarts, in a background job, every run the write left
        stale (`runs.stale` in the response). A restart stops the run and
        relaunches it on the same node, so its in-flight requests are cut
        and it serves nothing until the model has loaded again. Without it,
        the response only reports the runs; nothing restarts.
      schema: { type: string, enum: [affected] }
    NodeParam:
      in: query
      name: node
      description: |
        Target a specific cluster node. Accepts the local node name, a
        cluster endpoint `"host:port"`, or just the hostname portion of one.
        Empty or `*` means all nodes.
      schema: { type: string }
    ModelParam:
      in: query
      name: model
      description: Canonical or provider-qualified model identifier.
      schema: { type: string }
    ProviderParam:
      in: query
      name: provider
      description: Provider key (e.g. `vllm`, `ollama`, `mlx`).
      schema: { type: string }
    RegistryParam:
      in: query
      name: registry
      description: Registry/repository filter.
      schema: { type: string }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string }
      description: >
        Makes a retry safe. The first request under a given key is
        executed and its response recorded; a retry carrying the same key
        and the same body gets that recorded response back instead of a
        second execution, for 24 hours. Retrying a launch after an HTTP
        timeout is the case it exists for - without a key the first
        launch may well have started.


        What is recorded is whatever the first attempt answered,
        including a failure. A request that got a 502 from an upstream
        replays that 502 for 24 hours under the same key, so a retry
        meant to ride out a transient fault has to carry a new key.
        Reuse a key to make a retry idempotent, not to make it hopeful.


        The key is scoped to the caller, the resolved path and the key
        value, so two keys can share a string and a key recorded against
        one model group does not replay for another. Same key with a
        different body is a 422, never a silent replay of the wrong
        answer. A retry that arrives while the original is still running
        waits for it and replays its result.


        Streaming requests on the compatibility surface bypass the
        mechanism: replaying a buffered stream instantly is not the same
        response.

    LimitParam:
      in: query
      name: limit
      description: Max items per page (default 100, max 1000).
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    OffsetParam:
      in: query
      name: offset
      description: Items to skip.
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    # Reusable response blocks for the /zzrouter/v1/* (management) dialect.
    # These use RFC 9457 Problem Details. See components.schemas.Problem.
    # Note: quota enforcement runs only on /v1/* and /api/* (see
    # internal/server/model_dispatch.go , the only callers of
    # AccessControl.Enforce). /zzrouter/v1/* is admin-key only with no
    # quota pipeline today, which is why there is no MgmtThrottled
    # (429) block here. Add one alongside the first quota hook on
    # management routes.
    MgmtUnauthorized:
      description: Missing or invalid API key.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MgmtForbidden:
      description: Authenticated but insufficient permissions (e.g. non-owner PATCH on a shared team).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    # Reusable error response blocks for the /v1/* (OpenAI) dialect.
    # Every /v1/* operation references these so the spec has a single
    # place to update the envelope shape when OpenAI publishes a new
    # revision. See pkg/openaicompat/version.go for the upgrade protocol.
    AnthropicError:
      description: An error in the Anthropic envelope; `error.type` follows the status.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AnthropicError' }
    OpenAIBadRequest:
      description: Malformed or rejected request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OpenAIError' }
    OpenAIUnauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OpenAIError' }
    OpenAIForbidden:
      description: Authenticated but insufficient permissions.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OpenAIError' }
    OpenAIModelNameConflict:
      description: >
        A configured variant name also identifies real weights. Rename the
        variant or remove its from definition. Code is model_name_conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OpenAIError' }
    OpenAINotFound:
      description: Unknown endpoint or missing model.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OpenAIError' }
    OpenAIRequestTooLarge:
      description: Request body exceeds the configured limit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OpenAIError' }
    OpenAIRateLimit:
      description: Per-key or global rate limit exceeded.
      headers:
        Retry-After:
          description: Suggested delay in delta-seconds before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OpenAIError' }
    OpenAIInternal:
      description: zzRouter-internal failure. The response body NEVER echoes the underlying cause.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OpenAIError' }
    OpenAIBadGateway:
      description: Upstream backend failed or returned an unparseable response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OpenAIError' }
    OpenAIUnavailable:
      description: Service unavailable , feature disabled, draining, or no default backend configured.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OpenAIError' }
    OpenAIGatewayTimeout:
      description: >
        Upstream backend did not respond within the configured deadline.
        Also emitted when a duplicate of an in-flight idempotent request
        waits out its bound for the original to answer, which carries
        `code: idempotency_wait_timeout`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OpenAIError' }
    OpenAINotImplemented:
      description: Endpoint is recognized but not implemented in this build.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OpenAIError' }

    # Reusable error response blocks for the /api/* (Ollama) dialect.
    # Ollama's native error envelope is the flat shape
    # {"error": "<message>"} , see components.schemas.OllamaError and
    # internal/server/responder_ollama.go.
    OllamaBadRequest:
      description: Malformed or rejected request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OllamaError' }
    OllamaUnauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OllamaError' }
    OllamaModelNameConflict:
      description: A configured variant name also identifies real weights; disambiguate the name.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OllamaError' }
    OllamaNotFound:
      description: Unknown endpoint or missing model.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OllamaError' }
    OllamaRequestTooLarge:
      description: Request body exceeds the configured limit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OllamaError' }
    OllamaInternal:
      description: zzRouter-internal failure. Body NEVER echoes the underlying cause.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OllamaError' }
    OllamaBadGateway:
      description: Upstream backend failed or returned an unparseable response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OllamaError' }
    OllamaUnavailable:
      description: Service unavailable , feature disabled, draining, or no default backend configured.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OllamaError' }

  schemas:
    ProviderServiceStatus:
      type: object
      required: [provider, node, supervisor, managed, enabled, desired_running, running, healthy, manager]
      properties:
        provider: { type: string }
        node: { type: string }
        mode: { type: string }
        supervisor: { type: string, enum: [zzRouter, systemd, launchd, nssm, external] }
        manager: { type: [string, 'null'], description: Null for external ownership. }
        managed: { type: boolean }
        enabled: { type: boolean }
        desired_running: { type: boolean }
        running: { type: boolean }
        healthy: { type: boolean }
        pid: { type: integer }
        backoff: { type: string }
        env_state: { type: string }
        last_exit:
          type: object
          properties:
            at: { type: string, format: date-time }
            reason: { type: string, description: Bounded and redacted exit reason. }
            detail:
              type: object
              properties:
                exit_code: { type: [integer, 'null'] }
                signal: { type: string }
                error_tail: { type: array, items: { type: string }, description: At most 32 redacted lines and 8 KiB. }
                truncated: { type: boolean }

    InstallStep:
      type: object
      description: |
        One step of an install plan. Guided clients use the install execute-step
        route. A service_action delegates to the managed lifecycle owner and
        has no shell command. Automated installation executes the same steps.
      required: [step, description, command]
      properties:
        step:        { type: integer }
        description: { type: string }
        command:     { type: string }
        service_action: { type: string, enum: [start, stop, restart], description: Fixed managed lifecycle action executed on the target node. }
        notes:       { type: string }
        working_dir: { type: string }
        run_as:      { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        timeout:
          type: string
          description: |
            How long the step may run, as a Go duration string ("30s",
            "30m0s"). Absent means "no per-step limit , use the request
            deadline".
          example: "30m0s"
        optional:
          type: boolean
          description: Failure is logged but does not abort the install.
        verify: { $ref: '#/components/schemas/StepVerify' }

    StepVerify:
      type: object
      description: How to check that a step did what it claims.
      required: [type]
      properties:
        type:
          type: string
          enum: [file_exists, file_equals, dir_exists, command_output, runtime_checks]
        python: { type: string, description: Managed interpreter for a fixed runtime probe. }
        runtime_checks: { $ref: '#/components/schemas/ProviderRuntimeChecks' }
        path:     { type: string }
        command:  { type: string }
        expected:
          type: string
          description: Substring the command output must contain.
        transient:
          type: boolean
          description: |
            The subject is consumed by the install (a downloaded archive
            that extraction unpacks). Meaningful while the step runs and
            meaningless afterwards, so `POST /install/verify` does not
            treat its absence as damage.

    InstallRequest:
      type: object
      properties:
        version: { type: string }
        runtime: { type: string, description: Declared runtime ID; no recipe or command is accepted in this body. }
        action: { type: string, enum: [install, upgrade], description: Preview and guided action; install/upgrade routes select their own action. }
        force: { type: boolean }
        expected_plan_id: { type: string, pattern: '^[a-f0-9]{64}$', description: Required for guided Python execution; a mismatch returns 409. }
        disposable: { type: boolean, description: Automatic install into a plan-owned managed destination without replacing the active runtime. }
        smoke:
          type: object
          required: [model]
          description: Optional automatic typed-recipe smoke after verify. Launches the registry model, chats once and stops it; failure uses install rollback. Guided and disposable installs reject smoke.
          properties:
            model: { type: string, description: Existing registry model name, never a path or URL. }

    InstallRecipe:
      type: object
      additionalProperties: false
      description: Typed merge-patch leaves; null deletes an override. Mandatory effective fields and serving checks cannot be removed.
      properties:
        package: { type: string, maxLength: 128 }
        version_constraint: { type: string, maxLength: 256 }
        startup_import: { type: string, maxLength: 128 }
        only_binary: { type: boolean }
        timeout: { type: string, description: Duration from 1m to 2h. }
        toolkit: { type: string, enum: ['', cuda13] }
        indexes:
          type: object
          additionalProperties: false
          properties:
            primary: { type: string, format: uri }
            extra: { type: array, maxItems: 4, items: { type: string, format: uri } }
        companions:
          type: object
          maxProperties: 24
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              constraint: { type: string, maxLength: 256 }
              build: { type: string, enum: [cuda, metal, none] }
        verify:
          type: object
          additionalProperties: false
          properties:
            imports: { type: array, maxItems: 32, items: { type: string } }
            checks: { type: array, maxItems: 8, items: { type: string, enum: [pip_check, imports, cuda_companions, cuda_available, metal_available, managed_toolkit] } }

    InstallOverrides:
      type: object
      additionalProperties: false
      nullable: true
      properties:
        runtimes:
          type: object
          additionalProperties: { $ref: '#/components/schemas/InstallRecipe' }

    ResolvedInstall:
      type: object
      properties:
        recipe: { $ref: '#/components/schemas/InstallRecipe' }
        provenance: { type: object, additionalProperties: { type: string } }
        overridden: { type: boolean }

    InstallPlan:
      type: object
      required: [provider, steps]
      properties:
        plan_id: { type: string }
        disposable: { type: boolean }
        supply_chain_notice: { type: string }
        resolved_install:
          allOf:
            - $ref: '#/components/schemas/ResolvedInstall'
            - type: object
              properties:
                fingerprint: { type: string }
                policy_fingerprint: { type: string }
                authority: { type: string, enum: [release, operator] }
                node: { type: string }
        dependency_inventory:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              version: { type: string }
              requested: { type: boolean }
              artifact_url: { type: string }
              sha256: { type: string }
        provider: { type: string }
        version:  { type: string }
        action:
          type: string
          enum: [install, upgrade, uninstall]
        install_dir: { type: string }
        platform:
          type: object
          properties:
            os:   { type: string }
            arch: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/InstallStep' }
        current_state:
          type: array
          description: |
            Per-step probe of what is already on disk. `installed: false`
            on a fresh machine is the expected state, not a failure.
          items:
            type: object
            properties:
              step:      { type: integer }
              installed: { type: boolean }
              detail:    { type: string }

    AcceptedJob:
      type: object
      description: |
        The 202 body every asynchronous provider-lifecycle endpoint returns.

        `job_url` and `stream_url` are absolute paths on this host, spelled
        out rather than left as a template to assemble: a client has only
        this body in front of it. Poll `job_url` or subscribe to
        `stream_url`; the job is finished when `phase` reaches `done` or
        `failed`, and no other phase is terminal. Cancel with
        `DELETE /zzrouter/v1/jobs/{job_id}`.

        202 means the work was accepted, never that it succeeded.

        The job's terminal phase is the authoritative outcome. Reads of
        the cluster view (`/providers`, `/providers/{name}/versions`) are
        current immediately for work on the coordinator, and within one
        health interval (30s) for work on a remote node.
      required: [accepted, job_id, provider, node, job_url, stream_url]
      properties:
        accepted:   { type: boolean, example: true }
        job_id:     { type: string, example: "inst_a1b2c3d4e5f6" }
        provider:   { type: string, example: "vllm" }
        node:       { type: string, example: "worker1" }
        job_url:    { type: string, example: "/zzrouter/v1/jobs/inst_a1b2c3d4e5f6" }
        stream_url: { type: string, example: "/zzrouter/v1/jobs/inst_a1b2c3d4e5f6/stream" }
        step:
          type: integer
          description: Present only on the step-machine execute-step response.

    JobPhase:
      type: string
      description: |
        Lifecycle phase of a job. `done` and `failed` are the only terminal
        values; a client should keep watching through `pending` and
        `running`.
      enum: [pending, running, done, failed]

    JobEvent:
      type: object
      description: |
        One frame of a job's progress. The same shape is returned by
        `GET /jobs/{id}` and emitted on `GET /jobs/{id}/stream`.
      required: [job_id, node, kind, phase]
      properties:
        job_id:  { type: string }
        node:    { type: string }
        kind:
          type: string
          description: What produced the job (install, upgrade, download, run, inference_log, ...).
        phase:   { $ref: '#/components/schemas/JobPhase' }
        percent:
          type: integer
          description: 0-100 when the producer knows a ratio; absent or 0 when it does not.
        step:
          type: string
          description: Human-readable description of the current step.
        error:
          type: string
          description: Present only when phase is `failed`.
        warning:
          type: string
          description: Non-fatal warning; a successful job may carry this field.
        epoch:   { type: string }
        seq:     { type: integer }
        at:      { type: string, format: date-time }
        bytes:
          type: object
          description: Byte counters for download-shaped work.
          properties:
            done:  { type: integer, format: int64 }
            total: { type: integer, format: int64 }
        meta:
          type: object
          additionalProperties: true

    ProviderVersionsReport:
      type: object
      description: |
        What upstream publishes for a provider, and how each node compares.

        Either `latest` or `latest_tag` may be passed back as the `version`
        of an install or upgrade: each installer coerces the value to the
        shape its own download URLs need.

        A status is never optimistically `same`: a failed or absent check
        reports `unknown` and says why in `reason`.
      required: [provider, pinned_status, nodes, update_available]
      properties:
        provider: { type: string }
        latest:
          type: string
          description: Newest published version, normalized (e.g. `10502`).
          example: "10502"
        latest_tag:
          type: string
          description: The same release as upstream tags it (e.g. `b10502`).
          example: "b10502"
        release_url: { type: string }
        checked_at:  { type: string, format: date-time }
        source:
          type: object
          description: The feed the answer came from.
          properties:
            type:    { type: string, enum: [github_release, pypi] }
            repo:    { type: string }
            package: { type: string }
        pinned:
          type: string
          description: |
            The install-time seed for NEW installs. It is not a ceiling and
            not what upgrade targets.
        pinned_status: { $ref: '#/components/schemas/VersionStatus' }
        update_available:
          type: boolean
          description: True when any node is behind upstream. Never true when the answer is unknown.
        upgrade_url:
          type: string
          description: Endpoint to act on `update_available`. Present only when there is something to upgrade.
          example: "/zzrouter/v1/providers/llamacpp/upgrade"
        reason:
          type: string
          description: |
            Why `latest` is empty: not tracked, checks disabled, or the
            lookup error. Absent when the check succeeded.
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeVersionInfo' }

    VersionStatus:
      type: string
      description: |
        Orders an installed (or pinned) version against the newest upstream
        release. `newer` means UPSTREAM is ahead, `older` means the local
        side is ahead, `same` means they match, `unknown` means no ordering
        was established.
      enum: [newer, same, older, unknown]

    NodeVersionInfo:
      type: object
      required: [node, status, update_available]
      properties:
        node:      { type: string }
        installed: { type: string }
        status:    { $ref: '#/components/schemas/VersionStatus' }
        update_available:
          type: boolean
          description: Restates `status == "newer"` without requiring the reader to know which operand the comparison names.
        reason:
          type: string
          description: Why the status is `unknown`. Absent otherwise.

    ModelUsage:
      type: object
      description: |
        Running totals for one model since the node started. Derived from
        the request record itself, so it needs no virtual key and no team ,
        which is what makes it meaningful for a locally deployed model
        nobody authenticates against.

        These are NOT a sum over `/inference-logs`: that ring evicts, so
        summing it would silently under-report once it wraps.
      required: [model, requests, tokens_in, tokens_out, priced]
      properties:
        model:    { type: string }
        provider: { type: string }
        nodes:
          type: array
          items: { type: string }
        requests:   { type: integer, format: int64 }
        errors:     { type: integer, format: int64 }
        tokens_in:  { type: integer, format: int64 }
        tokens_out: { type: integer, format: int64 }
        priced:
          type: boolean
          description: |
            Whether any request carried an authoritative price. A
            self-hosted model has none, and rendering that as $0.00 would
            read as broken rather than as free , so `cost_usd` is omitted
            entirely and this says why.
        cost_usd:
          type: number
          description: Accumulated cost. Present only when `priced` is true.
        avg_tokens_per_sec:  { type: number }
        peak_tokens_per_sec: { type: number }
        avg_latency_ms:      { type: number }
        first_seen: { type: string, format: date-time }
        last_seen:  { type: string, format: date-time }

    ModelUsageReport:
      type: object
      description: |
        `models` is present when listing; `model` is present when asking
        about one. Both are absent when nothing has been served yet, which
        is a valid answer rather than an error.
      required: [since, uptime_seconds]
      properties:
        since:
          type: string
          format: date-time
          description: When the window opened, which is node start.
        uptime_seconds: { type: number }
        models:
          type: array
          items: { $ref: '#/components/schemas/ModelUsage' }
        model: { $ref: '#/components/schemas/ModelUsage' }

    SuccessEnvelope:
      type: object
      description: |
        Management-API success envelope. Operations that return a typed
        resource compose this with `allOf` so `data` carries the typed
        payload (see e.g. the `GET /zzrouter/v1/runs/{id}` response).
        The `success` field is redundant with the HTTP status code and
        is retained only for backwards compatibility with existing CLI
        and TUI clients , new consumers should branch on status, not
        on this flag.
      required: [success, message]
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          description: Endpoint-specific payload. Typed by each operation via `allOf`.
          nullable: true

    ListEnvelope:
      type: object
      description: |
        Paginated collection envelope. Callers compose this with `allOf`
        to strengthen `data.items` with the concrete element type , see
        `/zzrouter/v1/runs` and `/zzrouter/v1/providers` for examples.
        `total` is the total matching count; `has_more` hints whether
        another page exists beyond (offset + len(data)).
      required: [data, total, has_more]
      properties:
        data:
          type: array
          items:
            type: object
            description: Opaque object at the base level; narrowed per-operation via allOf.
        total:    { type: integer, minimum: 0 }
        has_more:
          type: boolean
          description: |
            Always present, never omitted, so a caller does not have to
            tell absent from false when deciding whether to page.
        metadata:
          type: object
          additionalProperties: true

    Problem:
      type: object
      description: |
        RFC 9457 Problem Details. Every /zzrouter/v1/* failure path emits
        this envelope with `Content-Type: application/problem+json`.
        `type`, `title`, and `status` are required per §3.1; `detail`,
        `instance`, and `request_id` are optional context fields.

        `code` is an RFC 9457 extension and is ALWAYS present: branch on
        it rather than parsing `detail`. It defaults to a snake_case slug
        of `title` (`not_found`, `conflict`, `bad_request`, ...) and is
        replaced by a more specific closed-enum value where one applies.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: |
            A URI reference that identifies the problem type. `about:blank`
            is emitted when no dedicated type URI has been minted.
          example: 'about:blank'
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          example: 'Bad Request'
        status:
          type: integer
          description: HTTP status code, repeated in the body for clients that only see the envelope.
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference identifying the specific occurrence.
        request_id:
          type: string
          description: Correlates with the `X-Request-ID` response header.
        code:
          type: string
          description: |
            Machine-readable discriminator. Always present. A snake_case
            slug of `title` by default; a closed-enum value
            (httperr.RouteErrorCode, httperr.ParamErrorCode) when the
            failure has a more specific vocabulary.
          example: 'not_found'
        node:
          type: string
          description: The cluster node a routed request targeted, when applicable.
        errors:
          type: array
          description: |
            Per-key detail: one entry per input that failed, so a caller
            fixing three fields learns about all three from one response.
            Present on any failure that can attribute itself to specific
            inputs; absent otherwise, in which case the top-level `code`
            is the whole machine-readable story.

            When every entry carries the same `code`, the top-level
            `code` repeats it, so a client reading only the top level
            still branches correctly on the common case. When they
            differ it stays the generic slug for the status: no single
            code is true, and the array is the answer.
          items: { $ref: '#/components/schemas/ParamError' }

    AnthropicError:
      type: object
      description: |
        Anthropic error envelope, emitted on every failure path of
        /v1/messages. The type is derived from the HTTP status, as the
        Anthropic API's own is; the SDKs retry on the status.
      required: [type, error]
      properties:
        type:
          type: string
          enum: [error]
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
              enum: [invalid_request_error, authentication_error, billing_error, permission_error,
                not_found_error, request_too_large, rate_limit_error, api_error, timeout_error,
                overloaded_error]
            message:
              type: string
        request_id:
          type: string
    OpenAIError:
      type: object
      description: |
        OpenAI-compatible error envelope. Emitted on every failure path of
        every /v1/* route except /v1/messages, which speaks
        AnthropicError. The `type` and `code` fields are closed
        vocabularies defined by OpenAIErrorType and OpenAIErrorCode , see
        pkg/openaicompat/vocab.go for the Go source of truth (both files
        are kept in sync by scripts/check_openai_spec_drift.sh).
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message:
              type: string
              description: Human-readable, sanitized description of the failure.
            type:
              $ref: '#/components/schemas/OpenAIErrorType'
            code:
              $ref: '#/components/schemas/OpenAIErrorCode'
            param:
              type: string
              nullable: true
              description: Offending request parameter, when applicable.

    OpenAIErrorType:
      type: string
      description: |
        Closed vocabulary for the OpenAI error envelope's `type` field.
        SDK clients (openai-python, openai-node) switch on this string to
        construct typed exception classes; emitting a value outside this
        set silently falls through to a generic APIError and breaks
        retry classifiers. Must stay in sync with pkg/protocol/openai/vocab.go.
      enum:
        - invalid_request_error
        - authentication_error
        - permission_error
        - not_found_error
        - rate_limit_error
        - server_error
        - api_error
        - insufficient_quota
        - overloaded_error

    OllamaError:
      type: object
      description: |
        Ollama-compatible error envelope. The wire format is
        deliberately minimal , the Ollama CLI and Open WebUI parse
        only the top-level `error` string and ignore everything else.
        zzRouter emits this shape on every failure path of every
        /api/* route via internal/server/responder_ollama.go.
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable, sanitized description of the failure.

    OpenAIErrorCode:
      type: string
      description: |
        Closed vocabulary for the OpenAI error envelope's `code` field.
        Must stay in sync with pkg/protocol/openai/vocab.go, which a
        drift test enforces in both directions.

        Some values are zzRouter's own , `draining`, `backend_unavailable`
        and the idempotency pair describe failures OpenAI has no code for.
        The envelope is theirs; these failure modes are ours. Adding a
        code OpenAI publishes also bumps SpecVersion in
        pkg/protocol/openai/version.go, which tracks their reference
        revision; adding one of ours does not.
      enum:
        - invalid_api_key
        - insufficient_permissions
        - invalid_request_error
        - unknown_url
        - method_not_allowed
        - request_too_large
        - model_not_found
        - model_name_conflict
        - endpoint_not_supported
        - rate_limit_exceeded
        - insufficient_quota
        - context_length_exceeded
        - content_filter
        - internal_error
        - upstream_error
        - upstream_timeout
        - feature_disabled
        - draining
        - no_default_backend_configured
        - backend_unavailable
        - provider_not_running
        - model_inventory_unavailable
        - idempotency_key_conflict
        - idempotency_wait_timeout

    HealthResponse:
      type: object
      description: >
        The payload every health route shares except the liveness probe.
        The route decides `status` and the HTTP code; the fields do not
        vary, so peer discovery reading /health sees the same protocol
        window as a kubelet reading /health/ready.
      required:
        [status, version, api_version, service_type, uptime, capabilities,
         cluster_protocol, min_cluster_protocol, cluster_compatible,
         client_compatible, timestamp]
      properties:
        status:
          type: string
          enum: [healthy, ready, draining]
          description: >
            `healthy` from /health, `ready` from the readiness probe, and
            `draining` from it during graceful shutdown, which answers 503.
        version: { type: string, description: Node version. }
        api_version: { type: string, example: v1 }
        service_type: { type: string, example: zzrouter-host }
        uptime:
          type: string
          example: 26.99275ms
          description: Go duration string, not a number of seconds.
        capabilities:
          type: array
          items: { type: string }
          description: What this node advertised at startup, e.g. `cluster`, `providers`.
        cluster_protocol:
          type: integer
          description: >
            Protocol this node speaks. A coordinator accepts a peer whose
            value falls in [min_cluster_protocol, cluster_protocol] and
            rejects it with 400 otherwise; marketing semver has no say.
        min_cluster_protocol:
          type: integer
          description: Oldest protocol this node still accepts from a peer.
        cluster_compatible:
          type: string
          description: Oldest peer version this node pairs with.
        client_compatible:
          type: string
          description: Oldest client version this node serves.
        timestamp: { type: string, format: date-time }
        details:
          type: object
          additionalProperties: true
          description: Present only with `?detailed=true`; build info and node identity.

    RunHealth:
      type: object
      description: >
        Health of one provider instance, reported by the node running it.
        Unrelated to the node health schema of the same name-adjacent
        routes: this describes a process, not the node.
      required: [instance_id, status, health_url, uptime]
      properties:
        instance_id: { type: string }
        status:
          type: string
          enum: [healthy, starting, unhealthy, stopped, unknown]
          description: >
            Derived from the instance state. `unknown` means the instance
            exists but its state is not one of the four the node tracks.
        health_url:
          type: string
          description: Where the node probes the instance. Empty when the provider exposes none.
        uptime:
          type: string
          example: 34.05ms
          description: Go duration string since the instance started.
        last_check:
          type: string
          format: date-time
          description: Omitted until the first probe has run.

    HealthLiveResponse:
      type: object
      required: [status, version]
      properties:
        status:  { type: string, enum: [alive] }
        version: { type: string }

    HealthServices:
      type: object
      required: [status, services, timestamp]
      properties:
        status: { type: string, enum: [ok] }
        services:
          type: object
          description: Keyed by capability name.
          additionalProperties:
            type: object
            required: [status]
            properties:
              status: { type: string, example: registered }
              detail: { type: string }
        timestamp: { type: string, format: date-time }

    HealthSharedStatus:
      type: object
      required: [status, node, version, peers, timestamp]
      properties:
        status:  { type: string, enum: [standalone] }
        node:    { type: string }
        version: { type: string }
        peers:
          type: array
          items: { type: object, additionalProperties: true }
          description: Always empty today; see the route description.
        timestamp: { type: string, format: date-time }

    APIDiscovery:
      type: object
      properties:
        api_version: { type: string, example: v1 }
        authentication:
          type: object
          properties:
            schemes:
              type: array
              items: { type: string }
              description: Headers a key is accepted in.
            management_api:
              type: string
              description: What /zzrouter/v1/* requires.
            compatible_apis:
              type: string
              description: |
                Whether /v1/* and /api/* need a key on this node, starting
                with `optional:` or `required:` and saying why. Read it
                before sending an anonymous inference request.
        inference:
          type: object
          description: Where the inference surface is, as reachable from the port this document came from.
          properties:
            served_on_this_port: { type: boolean, description: False on a worker, whose compat surface is on the cluster mTLS port. }
            catalog: { type: string, example: GET /v1/models }
            endpoints:
              type: object
              description: |
                Keyed by the `endpoints` vocabulary of /v1/models: an entry
                listing `messages` is served at `endpoints.messages`.
              additionalProperties: { type: string }
              example: { chat: POST /v1/chat/completions, messages: POST /v1/messages }
            ollama_compatible_base_path: { type: string }
            note: { type: string }
        streaming_gets:
          type: array
          items: { type: string }
          description: GET routes that answer text/event-stream and hold the connection open.
        endpoint_groups:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        enabled_features:
          type: array
          items: { type: string }
        docs:
          type: object
          additionalProperties: { type: string }

    CatalogModel:
      type: object
      description: Node-owned catalog entry; coordinator aggregation preserves the reporting node's evidence.
      required: [name, model, node, assigned_app, format, size, modified_at]
      properties:
        name: { type: string }
        model: { type: string, description: Duplicate of name for Ollama compatibility. }
        source_id: { type: string, description: Supported source alias when reported. }
        source_repo: { type: string }
        node: { type: string }
        assigned_app: { type: string, description: Inference provider key. }
        is_cloud: { type: boolean }
        format: { type: string }
        size: { type: integer, format: int64 }
        modified_at: { type: string, format: date-time }
        digest: { type: string }
        variant_of: { type: string, description: Base weights of a named variant. }
        details:
          type: object
          additionalProperties: true
          properties:
            features:
              type: object
              properties:
                vision:
                  type: string
                  enum: [present, available, unsupported, unknown]
                  description: |
                    present means usable on this node; available means eligible but
                    files/runtime or an enabled fresh launch are still needed;
                    unsupported is known ineligible; unknown means insufficient evidence.
                    Installed resources can remain available when tiers opt out or
                    the current process still runs its older text-only snapshot.
            wire_endpoints:
              type: array
              items: { type: string }
              description: Effective runtime or running-process endpoints. An explicit empty array declares none; absence falls back to provider capabilities.

    Model:
      type: object
      properties:
        name:     { type: string }
        node:     { type: string }
        provider: { type: string }
        registry: { type: string }
        format:   { type: string }
        size:     { type: integer, format: int64 }
        metadata:
          type: object
          additionalProperties: true

    OpenAIModel:
      type: object
      description: |
        OpenAI-compatible model object returned by /v1/models. Extends
        OpenAI's base shape with two fields agents need for capability
        routing:

          - `capabilities` , closed-vocab booleans + max_context_tokens.
            Derived from provider config and node-owned model evidence at list time.
          - `zzrouter`      , vendor extension identifying the serving
            node and provider. Unknown keys are ignored by OpenAI SDKs.

        The base fields (id, object, created, owned_by) match
        https://platform.openai.com/docs/api-reference/models/object
        byte-for-byte so strict client validators accept the response.

        Inference responses echo the `model` you sent, not the id the
        engine answers with: a request naming a model group comes back
        named after the group, and one carrying an `@node` suffix comes
        back carrying it. Which replica actually served is reported by
        the `zzrouter` block (`deployment`, `node`, `provider`), so a
        cloud replica's upstream snapshot id is visible there rather than
        in `model`.
      required: [id, object, created, owned_by]
      properties:
        id:       { type: string }
        object:   { type: string, enum: [model] }
        created:  { type: integer, format: int64 }
        owned_by: { type: string }
        capabilities:
          $ref: '#/components/schemas/OpenAIModelCapabilities'
        endpoints:
          type: array
          description: |
            /v1/* endpoints this model serves, so agents can branch on
            membership without reading every capability bool. `chat`,
            `completions`, `embeddings` and `rerank` follow `capabilities`;
            `responses` (/v1/responses) and `messages` (/v1/messages, the
            Anthropic Messages API) are listed when the model's provider
            serves them natively or through zzRouter's translation to Chat
            Completions. Model runtime endpoints take precedence over static
            provider endpoints, including snapshots of running processes. Pick a model for an Anthropic client such as
            Claude Code by `messages`.
          items: { type: string, enum: [chat, completions, embeddings, rerank, responses, messages] }
        served_by:
          type: string
          enum: [cloud, local]
          description: >
            Whether a request for this entry is dispatched to a cloud
            provider (and may bill upstream) or to a local instance. For
            a model group it reports `cloud` as soon as one replica is
            cloud-backed: a caller asking whether a call can bill needs
            the pessimistic answer. Omitted for an entry with no
            inference endpoints.
        runtime:
          type: object
          description: |
            Local-node hot-state. `status` is one of cold | loading |
            running. Cloud-backed models always report running.
            A model running on a worker the queried node doesn't own
            still reports cold here (cluster rollup is a future arc).
          required: [status]
          properties:
            status: { type: string, enum: [cold, loading, running] }
            node:   { type: string }
            port:   { type: integer }
        alias_of:
          type: string
          description: |
            Set on alias entries pointing back to the canonical model id.
            When `m.SourceID != m.Name` (e.g. HF repo path vs file stem),
            both are emitted as separate entries; the alias carries
            `alias_of` so clients dedupe via `alias_of || id`.
        variant_of:
          type: string
          description: |
            Set on a variant: a model of its own over the weights of the
            model this names, with its own launch settings or request
            defaults. Unlike an alias it is not the same model, so do not
            dedupe on it. What it changes is at
            `GET /zzrouter/v1/providers/{zzrouter.provider}/resolved?model={id}`.
        zzrouter:
          type: object
          description: zzRouter vendor extension. Consumers may ignore.
          properties:
            node:     { type: string }
            provider: { type: string }
            protocol: { type: string, enum: [openai, ollama] }

    OpenAIModelCapabilities:
      type: object
      description: |
        Per-model feature flags. Every known capability is listed
        explicitly with `false` as the default so clients can branch on
        membership without null-checking. `max_context_tokens` is the
        only scalar , zero means unknown.
      required:
        - chat
        - completions
        - embeddings
        - rerank
        - tools
        - vision
        - stream
        - json_mode
      properties:
        chat:               { type: boolean }
        completions:        { type: boolean }
        embeddings:         { type: boolean }
        rerank:             { type: boolean }
        tools:              { type: boolean }
        vision:             { type: boolean, description: "On a provider that declares features, true only when the node reports vision present. On one that declares none, guessed from the model name." }
        stream:             { type: boolean }
        json_mode:          { type: boolean }
        max_context_tokens: { type: integer, minimum: 0, default: 0 }

    Run:
      type: object
      properties:
        id:       { type: string }
        node:     { type: string }
        provider: { type: string }
        runtime: { type: string, description: Runtime selected by the actual prepared launch, including an automatically selected feature. }
        disposable_plan_id: { type: string, pattern: '^[a-f0-9]{64}$', description: Present only for a verified disposable runtime. }
        model:
          type: string
          description: |
            The name this node knows the model by , what a launch
            resolves the caller's name to. A run started under an alias
            is listed under this name and not the one it was requested
            with, so match rows on it rather than on what you sent.
        status:   { type: string }
        port:     { type: integer }
        started:  { type: string, format: date-time }
        endpoint: { type: string }
        parameters:
          type: object
          additionalProperties: { type: string }
          description: |
            Only what the caller passed on the launch request. This is
            the tier a restart replays, which is why it is kept separate
            from the resolved set.
        resolved_parameters:
          type: object
          additionalProperties: { type: string }
          description: |
            What the process was actually launched with, after the full
            walk: defaults -> model -> node -> node x model -> endpoint
            overlay -> request, with `auto` values dropped.

            Compare against `GET /providers/{name}/resolved` to tell a
            config read apart from a launch fact: when they disagree,
            the running process is the one telling the truth and the
            instance needs a relaunch to pick the change up.
            `parameters_status` makes that comparison for you.
        parameters_status:
          $ref: '#/components/schemas/ParametersStatus'
        error_message:
          type: string
          description: Bounded redacted failure summary, preserving the first specific cause.
        failure:
          type: object
          description: Optional diagnostic snapshot captured by the failed run lifecycle; does not require a logs request.
          properties:
            exit_code:
              type: integer
              nullable: true
              description: Actual native process exit code, including zero; null if unknown or terminated by signal.
            signal: { type: string }
            error_tail:
              type: array
              maxItems: 32
              description: Last diagnostic error lines, at most 8 KiB in total, redacted before retention; request payload and environment dump lines are excluded.
              items: { type: string }
            truncated: { type: boolean }

    Provider:
      type: object
      properties:
        name:      { type: string }
        key:       { type: string }
        mode:      { type: string }
        protocol:  { type: string }
        is_cloud:  { type: boolean }
        installed: { type: boolean }
        enabled:   { type: boolean }

    ProviderStatus:
      type: object
      description: |
        Runtime status for a provider as served by `ProvidersService.
        GetProviderStatus`. Mirrors `pkg/prov_apps/types.go:ProviderStatus`.
      required: [name, installed, managed, mode, enabled]
      properties:
        name:      { type: string }
        installed: { type: boolean }
        managed:
          type: boolean
          description: True when zzRouter owns the process lifecycle (service or on-demand).
        version: { type: string }
        mode:
          type: string
          enum: [on-demand, service, external, cloud, registry]
        enabled: { type: boolean }
        instances:
          type: array
          description: Currently-running instances for managed providers.
          items:
            type: object
            additionalProperties: true

    ProviderCatalogEntry:
      type: object
      description: |
        One row in the provider catalog (installed or available).
        Matches the inline `catalogEntry` struct in
        `internal/server/providers_controller.go:ListProviderCatalog`.
        `mode` and `kind` carry the same discriminator , `kind` is the
        canonical name, `mode` is retained for older clients during
        the split arc.
      required: [key, name, mode, kind, protocol, is_cloud, installed, enabled, available]
      properties:
        key:         { type: string }
        name:        { type: string }
        description: { type: string }
        mode:
          type: string
          enum: [on-demand, service, external, cloud, registry]
        kind:
          type: string
          enum: [on-demand, service, external, cloud, registry]
        protocol:   { type: string, example: openai }
        is_cloud:   { type: boolean }
        installed:  { type: boolean }
        enabled:    { type: boolean }
        available:
          type: boolean
          description: Cloud providers are available once credentials are set; local providers once enabled.
        required_env_vars:
          type: array
          items: { type: string }

    VerifyResult:
      type: object
      description: |
        Shape returned by `POST /providers/{name}/verify`. The handler
        wraps a connectivity probe against the provider's configured
        health endpoint and reports a coarse ok/failed state plus a
        human-readable hint.
      required: [provider, status, message]
      properties:
        provider: { type: string }
        status:
          type: string
          enum: [ok, failed]
        message: { type: string, description: Human-readable outcome or remediation hint. }

    Node:
      type: object
      description: |
        Cluster node descriptor. The shape mirrors the map produced by
        `internal/server/hosts.go:endpointToNodeInfo`; new metadata fields
        land in `metadata` (open map) before being promoted here.
      required: [name, cluster_role, health_status]
      properties:
        name:          { type: string, description: Canonical node name. }
        ip_address:    { type: string, description: Resolved IP of the node's bind address. }
        port:          { type: integer, minimum: 0 }
        address:
          type: string
          description: Convenience `ip:port` pair derived from ip_address and port.
        cluster_role:
          type: string
          enum: [standalone, coordinator, worker]
        health_status:
          type: string
          enum: [unknown, healthy, degraded, down]
        os:            { type: string }
        version:       { type: string }
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
        memory:
          type: object
          description: RAM summary populated when the worker reported resources on last probe.
          properties:
            total_gb:     { type: number }
            available_gb: { type: number }
            used_percent: { type: number }
        metadata:
          type: object
          additionalProperties: true
          description: Open map for fields not yet promoted into the typed shape.

    Deployment:
      type: object
      description: |
        Multi-node model placement job tracked by
        `internal/server/deployment_tracker.go:Deployment`. `POST
        /zzrouter/v1/deployments` returns 202 with this body; clients
        poll `GET /zzrouter/v1/deployments/{id}` until `status` reaches
        a terminal state (`completed`, `failed`, `cancelled`).
      required: [id, model, status, created_at, updated_at, nodes]
      properties:
        restart_job_id:
          type: string
          description: Job that waits for deployment and restarts affected stale runs to readiness.
        id:        { type: string }
        model:     { type: string }
        format:    { type: string }
        registry:  { type: string }
        file:      { type: string, description: Specific file for GGUF models. }
        status:
          type: string
          enum: [pending, downloading, completed, failed, cancelled]
        message:    { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/DeploymentNode' }
        nodes_total:       { type: integer, minimum: 0 }
        nodes_complete:    { type: integer, minimum: 0 }
        nodes_failed:      { type: integer, minimum: 0 }
        nodes_skipped:     { type: integer, minimum: 0 }
        nodes_pending:     { type: integer, minimum: 0 }
        nodes_in_progress: { type: integer, minimum: 0 }

    DeploymentNode:
      type: object
      description: Per-node slice of a Deployment.
      required: [node, status, source]
      properties:
        node:   { type: string }
        status:
          type: string
          enum: [pending, downloading, completed, failed, skipped]
        source:
          type: string
          description: '"internet" or the name of the source node when copying between workers.'
        download_id:     { type: string }
        bytes_downloaded: { type: integer, format: int64, minimum: 0 }
        bytes_total:      { type: integer, format: int64, minimum: 0 }
        progress:         { type: number, description: '0-100 percent complete.' }
        speed:            { type: integer, format: int64, description: Bytes per second. }
        error:            { type: string }
        started_at:       { type: string, format: date-time }
        completed_at:     { type: string, format: date-time }

    InstallProgress:
      type: object
      description: |
        Progress for a provider install/upgrade/uninstall, mirroring
        `pkg/prov_apps/install/progress.go:InstallProgress`. Returned by
        `GET /zzrouter/v1/providers/{name}/install/status` while a
        long-running install is in flight; the install POST itself is
        currently synchronous (blocks until the operation completes).
      required: [provider, action, status]
      properties:
        provider:        { type: string }
        action:
          type: string
          enum: [install, upgrade, uninstall]
        status:
          type: string
          enum: [running, completed, failed]
        step:             { type: integer, minimum: 0 }
        total_steps:      { type: integer, minimum: 0 }
        step_description: { type: string }
        bytes_total:      { type: integer, format: int64, minimum: 0 }
        bytes_done:       { type: integer, format: int64, minimum: 0 }
        percent:          { type: integer, minimum: 0, maximum: 100 }
        error:            { type: string }
        started_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }

    DeleteModelsRequest:
      type: object
      properties:
        pattern: { type: string }
        models:
          type: array
          items: { type: string }

    EnsureRunRequest:
      type: object
      required: [model]
      description: |
        Body for POST /zzrouter/v1/runs/ensure. The agent supplies the
        model name (and optionally the endpoint); zzRouter resolves the
        provider + node from the catalog.
      properties:
        model:    { type: string }
        endpoint: { type: string, enum: [chat, embeddings, reranking], default: chat }

    EnsureRunResponse:
      type: object
      required: [status, model]
      description: |
        Unified ensure outcome. `status="running"` is paired with HTTP
        200 and carries port + node + run_id. Any other status is
        paired with HTTP 202 and carries job_id (and deploy_job_id
        when a download was chained).
      properties:
        status:
          type: string
          enum: [running, loading, launching, waiting_for_deploy]
        model:    { type: string }
        provider: { type: string }
        endpoint: { type: string }
        node:     { type: string }
        port:     { type: integer }
        run_id:   { type: string }
        job_id:   { type: string }
        deploy_job_id: { type: string }
        message:  { type: string }

    LaunchRunRequest:
      type: object
      required: [provider, launch_mode]
      description: |
        Either `model` or `model_name` must be set. `model_name` wins
        when both are present; `model` is preferred for parity with
        `/v1/*`.
      properties:
        runtime: { type: string, description: Declared runtime for disposable launch; must match this model's applicable runtime. }
        disposable_plan_id: { type: string, pattern: '^[a-f0-9]{64}$', description: Verified disposable install plan. A normal running instance is never returned as its proof. }
        provider:    { type: string }
        launch_mode: { type: string, enum: [native] }
        model:       { type: string, description: "Preferred , alias of model_name" }
        model_name:  { type: string, description: "Legacy field; still accepted" }
        node:        { type: string }
        endpoint:
          type: string
          enum: [chat, embeddings, reranking]
          description: |
            Per-endpoint instance keying. Defaults to chat. Endpoint-aware
            providers (config declares `endpoints` overlay) launch
            separate processes per endpoint.
        auto_deploy:
          type: boolean
          description: |
            When true and the model isn't in the local cache, synthesizes
            a download via the provider's configured registry, then
            chains the launch. Returns 202 with both `deploy_job_id`
            (download progress) and `job_id` (launch readiness).
            Refused for cloud providers.
        parameters:
          type: object
          additionalProperties: { type: string }

    PreviewRunRequest:
      type: object
      properties:
        provider: { type: string }
        model:    { type: string }
        node:     { type: string }
        parameters:
          type: object
          additionalProperties: { type: string }

    LoadModelRequest:
      type: object
      required: [model_name]
      description: |
        `model_name` is resolved to the name this node knows the model
        by before the request is keyed on it, so the canonical name and
        any SourceID alias the catalog carries for it (a HuggingFace
        repo id, say) reach the same run.
      properties:
        model_name: { type: string }
        provider:   { type: string }
        node:       { type: string }
        endpoint:
          type: string
          enum: [chat, embeddings, reranking]
          description: |
            Which wire endpoint the instance serves. Empty means
            `chat`; anything outside the enum is a 400. Providers whose
            config declares no `endpoints` overlay run one instance per
            (provider, model) whatever is passed.
        force:
          type: boolean
          description: |
            Stop the run already serving this model and launch a
            replacement. Without it, a model that is already running or
            starting answers 409 instead.
        parameters:
          type: object
          additionalProperties: { type: string }
        environment:
          type: object
          additionalProperties: { type: string }
          description: |
            Environment variables for the launched process. Same
            precedence as `parameters`: request-scoped, above every
            tier configured on the provider.

    Key:
      type: object
      description: |
        Safe representation of a virtual API key. Mirrors
        `internal/server/keys_service.go:KeyResponse` , no secret
        material. Quota fields (`rpm_limit`, `tpm_limit`,
        `spend_limit`, `reset_period`, `max_parallel_requests`) are
        omitted when unset; `spend_limit: 0` means unenforced, not
        "$0 hard cap" (see `pkg/quota/enforcer.go`). Team binding
        (`team_id` + `team_role`) is immutable after creation.
      required: [id, name, role, team_id, team_role, suspended, is_expired]
      properties:
        id:         { type: string }
        uuid:       { type: string, format: uuid }
        name:       { type: string }
        role:
          type: string
          description: Coarse-grained role within the auth model.
          example: user
        team_id:    { type: string }
        team_role:
          type: string
          enum: [owner, member]
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_by: { type: string }
        suspended:    { type: boolean }
        suspended_at: { type: string, format: date-time, nullable: true }
        suspended_by: { type: string }
        max_parallel_requests: { type: integer, minimum: 0 }
        rpm_limit:    { type: integer, minimum: 0 }
        tpm_limit:    { type: integer, minimum: 0 }
        spend_limit:
          type: number
          minimum: 0
          description: USD budget per `reset_period`. `0` means unenforced.
        reset_period:
          type: string
          description: Rolling window duration for RPM/TPM/spend (e.g. `1m`, `1h`, `30d`).
        metadata:
          type: object
          additionalProperties: { type: string }
        is_expired: { type: boolean }

    CreateKeyRequest:
      type: object
      required: [id, name]
      description: |
        Omit `team_id` to auto-create a personal team the new key will
        own. Pass an existing shared team id to join it as `team_role`
        (defaults to `member`); personal teams can never accept a
        second key. The same fields, with descriptions, are served by
        `GET /zzrouter/v1/keys/schema`.
      properties:
        id:          { type: string, description: Unique key ID you choose; immutable after creation. }
        name:        { type: string }
        description: { type: string }
        role:       { type: string, default: user }
        team_id:    { type: string }
        team_role:
          type: string
          enum: [owner, member]
          default: member
        expires_at: { type: string, format: date-time, nullable: true }
        max_parallel_requests: { type: integer, minimum: 0 }
        rpm_limit:    { type: integer, minimum: 0 }
        tpm_limit:    { type: integer, minimum: 0 }
        spend_limit:  { type: number, minimum: 0 }
        reset_period: { type: string }
        default_max_tokens:
          type: integer
          minimum: 0
          description: Tokens reserved against spend_limit per request before its real cost is known.
        metadata:
          type: object
          additionalProperties: { type: string }

    CreateKeyResponse:
      type: object
      description: |
        Returned exactly once on POST /keys. The `key` field is the raw
        secret , it is never stored server-side and cannot be retrieved
        later. Clients MUST persist it on first response or rotate.
      required: [id, name, role, team_id, team_role, key]
      properties:
        id:       { type: string }
        name:     { type: string }
        role:     { type: string }
        team_id:  { type: string }
        team_role:
          type: string
          enum: [owner, member]
        key:
          type: string
          description: Raw key material, shown once. Never logged, never retrievable.

    UpdateKeyRequest:
      type: object
      description: |
        PATCH semantics: nil fields are left untouched. `team_id` and
        `team_role` are intentionally absent , team binding is immutable
        after creation.
      properties:
        name:       { type: string }
        description: { type: string }
        role:       { type: string }
        suspended:  { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        max_parallel_requests: { type: integer, minimum: 0 }
        rpm_limit:    { type: integer, minimum: 0 }
        tpm_limit:    { type: integer, minimum: 0 }
        spend_limit:  { type: number, minimum: 0 }
        reset_period: { type: string }
        default_max_tokens: { type: integer, minimum: 0 }
        metadata:
          type: object
          additionalProperties: { type: string }

    KeyUsage:
      type: object
      description: |
        Rolling-window usage for a virtual key. Mirrors
        `internal/server/keys_service.go:KeyUsageResponse`. `reserved_usd`
        reflects in-flight budget reservations that have not yet been
        settled by the inference log bridge.
      required: [key_id, spend_usd, tokens_in, tokens_out, request_count]
      properties:
        key_id:       { type: string }
        spend_usd:    { type: number, minimum: 0 }
        reserved_usd: { type: number, minimum: 0 }
        tokens_in:    { type: integer, format: int64, minimum: 0 }
        tokens_out:   { type: integer, format: int64, minimum: 0 }
        request_count: { type: integer, format: int64, minimum: 0 }
        period_start: { type: string, format: date-time }
        period:
          type: string
          description: Window duration string (e.g. 1h, 30d).
        spend_limit:  { type: number, minimum: 0 }
        rpm_limit:    { type: integer, minimum: 0 }
        tpm_limit:    { type: integer, minimum: 0 }

    SpendReport:
      type: object
      required: [keys, total_spend_usd]
      properties:
        keys:
          type: array
          items: { $ref: '#/components/schemas/KeyUsage' }
        total_spend_usd: { type: number, minimum: 0 }

    Team:
      type: object
      description: |
        Safe representation of a team. Mirrors
        `internal/server/teams_service.go:TeamResponse`. Members are
        not embedded , clients fetch `GET /teams/{id}/keys` for the
        member list. `kind` distinguishes the two flavors: `personal`
        teams are auto-created per key and can only have one owner;
        `shared` teams are admin-created and support multiple members.
      required: [id, uuid, name, kind, suspended]
      properties:
        id:   { type: string }
        uuid: { type: string, format: uuid }
        name: { type: string }
        kind:
          type: string
          enum: [personal, shared]
        allowed_models:
          type: array
          items: { type: string }
          description: Whitelist intersected with per-key access. Empty means no model access gate.
        suspended:    { type: boolean }
        suspended_at: { type: string, format: date-time, nullable: true }
        suspended_by: { type: string }
        max_parallel_requests: { type: integer, minimum: 0 }
        rpm_limit:    { type: integer, minimum: 0 }
        tpm_limit:    { type: integer, minimum: 0 }
        spend_limit:  { type: number, minimum: 0 }
        reset_period: { type: string }
        default_max_tokens: { type: integer, minimum: 0 }
        metadata:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_by: { type: string }

    CreateTeamRequest:
      type: object
      required: [id, name]
      properties:
        id:   { type: string, description: Stable identifier. Must not begin with the personal-team prefix. }
        name: { type: string }
        allowed_models:
          type: array
          items: { type: string }
        max_parallel_requests: { type: integer, minimum: 0 }
        rpm_limit:    { type: integer, minimum: 0 }
        tpm_limit:    { type: integer, minimum: 0 }
        spend_limit:  { type: number, minimum: 0 }
        reset_period: { type: string }
        default_max_tokens: { type: integer, minimum: 0 }
        metadata:
          type: object
          additionalProperties: { type: string }

    UpdateTeamRequest:
      type: object
      description: |
        PATCH semantics: nil fields are left untouched. `kind` is
        immutable. Member mutations use the separate merge-patch
        syntax documented on PATCH /teams/{id}.
      properties:
        name: { type: string }
        allowed_models:
          type: array
          items: { type: string }
        suspended: { type: boolean }
        max_parallel_requests: { type: integer, minimum: 0 }
        rpm_limit:    { type: integer, minimum: 0 }
        tpm_limit:    { type: integer, minimum: 0 }
        spend_limit:  { type: number, minimum: 0 }
        reset_period: { type: string }
        default_max_tokens: { type: integer, minimum: 0 }
        metadata:
          type: object
          additionalProperties: { type: string }

    TeamKeys:
      type: object
      required: [team_id, keys]
      properties:
        team_id: { type: string }
        keys:
          type: array
          items: { $ref: '#/components/schemas/TeamKeyItem' }

    TeamKeyItem:
      type: object
      required: [key_id, role]
      properties:
        key_id: { type: string }
        name:   { type: string }
        role:
          type: string
          enum: [owner, member]

    TeamUsage:
      type: object
      description: |
        Rolling-window usage aggregated across every key in a team.
        Mirrors `internal/server/teams_service.go:TeamUsageResponse`.
      required: [team_id, spend_usd, tokens_in, tokens_out, request_count]
      properties:
        team_id:       { type: string }
        spend_usd:     { type: number, minimum: 0 }
        reserved_usd:  { type: number, minimum: 0 }
        tokens_in:     { type: integer, format: int64, minimum: 0 }
        tokens_out:    { type: integer, format: int64, minimum: 0 }
        request_count: { type: integer, format: int64, minimum: 0 }
        period_start:  { type: string, format: date-time }
        period:        { type: string }
        spend_limit:   { type: number, minimum: 0 }
        rpm_limit:     { type: integer, minimum: 0 }
        tpm_limit:     { type: integer, minimum: 0 }

    ModelGroup:
      type: object
      description: |
        Logical model name mapping to one or more replicas. Mirrors
        `pkg/modelgroup/types.go:ModelGroup`. The group name (map key
        in the on-disk store) is carried in `name` when served via
        the API.
      required: [name, replicas]
      properties:
        name:        { type: string, description: Group identifier (URL path param). }
        description: { type: string }
        strategy:
          type: string
          enum: [priority, least-load, fastest]
          description: Replica selection strategy. Defaults to `priority`.
        health_check:
          $ref: '#/components/schemas/ModelGroupHealthCheck'
        replicas:
          type: array
          items: { $ref: '#/components/schemas/ModelGroupReplica' }
        params:
          type: object
          additionalProperties: true
        owner:
          type: string
          maxLength: 128
          description: |
            Free-text audit tag echoed back on read. Informational: it
            grants and restricts nothing.
        ttl_seconds:
          type: integer
          writeOnly: true
          description: |
            Creates an ephemeral group expiring `ttl_seconds` from now,
            in `[60, 86400]`; `0` means perpetual. The reaper deletes
            the group shortly after expiry, at one-minute granularity.
            Read the resulting instant from `expires_at`.
        expires_at:
          type: string
          format: date-time
          readOnly: true
          description: Set only for an ephemeral group. Also sent as the `X-Expires-At` header.
        auto_managed:
          type: boolean
          readOnly: true
          description: |
            True while the autoroute generator owns this group and will
            keep reconciling it. Any mutation by a caller flips it to
            false and stamps `auto_owner`.
        auto_owner:
          type: string
          readOnly: true
          description: |
            Principal that claimed a generated group. Present only on a
            claimed auto-route, which is exactly what
            `DELETE /zzrouter/v1/model-groups/{name}/owner` releases.

    ModelGroupHealthCheck:
      type: object
      properties:
        path:     { type: string, default: /health }
        interval: { type: string, description: Duration string (e.g. `30s`). }
        timeout:  { type: string, description: Duration string (e.g. `5s`). }

    ModelGroupReplica:
      type: object
      description: One backend that can serve a model within a group.
      required: [name, model, provider]
      properties:
        name:
          type: string
          description: Human-readable label for this replica.
        model:    { type: string, description: Model id as known to the provider. }
        provider: { type: string, description: Provider key from provider config. }
        node:     { type: string, description: Empty for local, hostname for remote. }
        priority:
          type: integer
          minimum: 0
          description: Selection order , lower = tried first.
        timeout:  { type: string, description: Per-replica request timeout (duration string). }
        on_demand:
          type: boolean
          description: Whether to start the local model if not already running.
        gpu_memory_required: { type: string }
        max_retries: { type: integer, minimum: 0 }
        tags:
          type: array
          items: { type: string }
        params:
          type: object
          additionalProperties: true
        cooldown_seconds:
          type: number
          readOnly: true
          description: |
            Seconds left before this replica is eligible again. Present
            only while a cooldown is active; `GET .../state` is the
            endpoint meant for polling it.
        cooldown_reason:
          type: string
          readOnly: true
          description: Why the replica is cooling down. See `cooldown_reason` in the schema endpoint.

    ModelGroupsSchema:
      type: object
      description: |
        Self-describing vocabulary for the model-group surface, served
        by `GET /zzrouter/v1/model-groups/schema`. Read it instead of
        hard-coding enum values: the endpoint is generated from the same
        constants the server validates against.
      required: [fields, enums]
      properties:
        fields:
          type: object
          description: |
            Field path (`description`, `health_check.interval`,
            `replicas[].priority`, ...) to its description and
            constraints.
          additionalProperties:
            type: object
            required: [type]
            properties:
              type:        { type: string }
              required:    { type: boolean }
              min:         { description: Lower bound, when the field has one. }
              max:         { description: Upper bound, when the field has one. }
              description: { type: string }
              enum:
                type: array
                items: { type: string }
        enums:
          type: object
          description: |
            Closed-enum name to its complete value list, covering
            cooldown reasons, attempt skip reasons and outcomes, breaker
            and health states, event types, error codes, steering
            headers and projected-cost sources. An empty list means the
            vocabulary is declared but not yet populated.
          additionalProperties:
            type: array
            items: { type: string }

    RouteEvent:
      type: object
      description: |
        One model-group lifecycle event, carried as the `data:` line of
        `GET /zzrouter/v1/model-groups/events`. The SSE `event:` line
        repeats `type`.
      required: [type, timestamp]
      properties:
        type:
          type: string
          enum:
            - route_created
            - route_updated
            - route_deleted
            - route_expired
            - replica_added
            - replica_removed
            - breaker_opened
            - breaker_closed
            - cooldown_started
            - cooldown_ended
            - health_changed
            - auto_route_generated
            - auto_route_revoked
        route:     { type: string, description: Model-group name. Absent on events with no route. }
        replica:   { type: string, description: Replica name, on replica-scoped events. }
        timestamp: { type: string, format: date-time }
        detail:
          type: object
          additionalProperties: { type: string }
          description: Event-specific context, string-valued.

    ModelGroupState:
      type: object
      description: |
        Live per-replica state, snapshotted at request time. Every field
        below `name` is omitted when the tracker behind it is not wired
        on this node, so absence means "not measured here", not zero.
      required: [name, replicas]
      properties:
        name: { type: string }
        replicas:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              cooldown_remaining_seconds: { type: number }
              cooldown_reason:            { type: string }
              health_state:               { type: string }
              in_flight:
                type: integer
                description: Requests currently in flight on this replica.
              latency_avg_ms:  { type: integer }
              latency_samples: { type: integer }

    ModelGroupHistory:
      type: object
      description: |
        Recent dispatches through one group, projected from the
        inference log. Prompts, request bodies and internal ids are
        deliberately not included.
      required: [name, entries, count]
      properties:
        name:  { type: string }
        count: { type: integer, description: Number of entries in this page. }
        entries:
          type: array
          items:
            type: object
            required: [id, timestamp, model, status, fallback_count]
            properties:
              id:        { type: string }
              timestamp: { type: string, format: date-time }
              model:     { type: string, description: Model the caller asked for. }
              response_model:
                type: string
                description: Model that actually answered, when it differs.
              status:
                type: string
                enum: [success, error]
              replica: { type: string, description: Replica that served the request. }
              fallback_count:
                type: integer
                description: |
                  Attempts before the one that answered. `0` on a
                  first-try success, which is still route history.
              fallback_from: { type: string, description: Replica the request fell back from. }
              latency_ms:    { type: number }
              tokens_in:     { type: integer }
              tokens_out:    { type: integer }
              cost_usd:      { type: number }
              error_type:    { type: string }

    RoutePreviewRequest:
      type: object
      description: |
        Filters for a dry-run selection. Every field is optional; an
        empty body sweeps the route table. Input is body-only by
        design: `X-Route-*` steering headers belong to live dispatch.
      properties:
        route:
          type: string
          description: |
            Narrow the sweep to one group. The per-route endpoint fills
            this from the URL.
        require_tags:
          type: array
          items: { type: string }
          description: Hard filter. A replica survives only if it carries every tag listed.
        exclude_replicas:
          type: array
          items: { type: string }
          description: |
            Replica names to filter out regardless of state. This is the
            retry primitive: exclude what just failed and preview again.
        latency_budget_ms:
          type: integer
          description: Drop replicas whose observed latency exceeds this. `0` disables the filter.
        input_tokens:
          type: integer
          format: int64
          description: Prompt size used for the cost projection.
        output_tokens:
          type: integer
          format: int64
          description: Completion size used for the cost projection.

    RoutePreviewResponse:
      type: object
      description: |
        One assignment per previewed route, in route order.
      required: [assignments]
      properties:
        assignments:
          type: array
          items: { $ref: '#/components/schemas/RoutePreviewAssignment' }
        total_projected_cost_micro:
          type: integer
          format: int64
          description: |
            Sum across assignments, present only when every assignment
            has a priced source. Summing a partially-priced set would
            read as authoritative while being short.
        capped:
          type: boolean
          description: |
            True when the sweep stopped at the response cap, so the
            assignment list is a prefix of the route table rather than
            all of it. Narrow with `route`.

    RoutePreviewAssignment:
      type: object
      description: One route and the replica that would serve it.
      required: [route, projected_cost_micro, projected_cost_source, strategy]
      properties:
        route: { type: string }
        replica:
          type: string
          description: Chosen replica. Absent when every candidate was filtered out.
        projected_cost_micro:
          type: integer
          format: int64
          description: Projected cost in millionths of a USD, `0` when unpriced.
        projected_cost_source:
          type: string
          description: |
            Where the price came from. Empty means no authoritative
            price was available and the projection should be treated as
            unknown rather than free. See the `projected_cost_source`
            enum in the schema endpoint.
        strategy:
          type: string
          description: Selection strategy applied, from the group's configuration.
        skipped:
          type: array
          description: |
            Every candidate that was filtered out, with the reason. This
            is what makes a preview actionable: an agent sees what it
            lost, not just what it got.
          items:
            type: object
            required: [replica, reason]
            properties:
              replica: { type: string }
              reason:
                type: string
                description: Closed enum; see `attempt_skip_reason` in the schema endpoint.
        no_survivors:
          type: boolean
          description: |
            True when the filters removed every replica. `replica` is
            then absent and `skipped` explains why.

    ModelGroupReplicaUpsert:
      type: object
      description: |
        Body of `PUT /zzrouter/v1/model-groups/{name}/replicas/{replica}`.
        Identical to `ModelGroupReplica` minus `name`, which the URL
        owns, and minus the read-only cooldown fields.
      required: [model, provider]
      properties:
        model:    { type: string, description: Model id as known to the provider. }
        provider: { type: string, description: Provider key from provider config. }
        node:     { type: string, description: Empty for local, hostname for remote. }
        priority:
          type: integer
          minimum: 0
          description: Selection order, lower is tried first.
        timeout:  { type: string, description: Per-replica request timeout (duration string). }
        on_demand:
          type: boolean
          description: Whether to start the local model if it is not already running.
        gpu_memory_required: { type: string }
        max_retries: { type: integer, minimum: 0 }
        tags:
          type: array
          items: { type: string }
        params:
          type: object
          additionalProperties: true

    InferenceLogEntry:
      type: object
      description: |
        One request/response pair captured by the inference log ring
        buffer. Mirrors `pkg/inferencelog/types.go:LogEntry`.
      required: [id, timestamp, model, provider, request_type, node, status]
      properties:
        id:        { type: string }
        timestamp: { type: string, format: date-time }
        model:     { type: string }
        provider:  { type: string }
        request_type:
          type: string
          description: OpenAI/Ollama action (e.g. `chat`, `completion`, `embeddings`).
        stream:          { type: boolean }
        routing_decision: { type: string }
        node:      { type: string }
        status:
          type: string
          enum: [success, error]
        system_prompt: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/InferenceLogMessage' }
        temperature: { type: number, nullable: true }
        max_tokens:  { type: integer, minimum: 0, nullable: true }
        top_p:       { type: number, nullable: true }
        tokens_in:       { type: integer, format: int64, minimum: 0 }
        tokens_out:      { type: integer, format: int64, minimum: 0 }
        tokens_cached:   { type: integer, format: int64, minimum: 0 }
        tokens_reasoning: { type: integer, format: int64, minimum: 0 }
        tokens_per_sec:  { type: number, minimum: 0 }
        ttft_ms:         { type: number, minimum: 0 }
        latency_ms:      { type: number, minimum: 0 }
        cost:
          type: number
          description: USD cost for cloud providers.
          minimum: 0
        group_name:       { type: string, description: Model group alias used. }
        deployment_name:  { type: string }
        fallback_count:   { type: integer, minimum: 0 }
        fallback_from:    { type: string }
        key_id:           { type: string }
        team_id:          { type: string }
        error_type:       { type: string }
        error_message:    { type: string }

    InferenceLogMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content: { type: string }

    ProviderCapabilities:
      type: object
      description: |
        Detailed capability descriptor for a provider type. Mirrors
        the map returned by `runs_utility_service.go:GetAppCapabilities`
        (type, mode, enabled, protocol, endpoint, default_command,
        default_args). Fields beyond the required core flow through
        as open map entries so new runtime keys do not require a spec
        bump to reach clients.
      required: [type, mode, enabled, protocol]
      properties:
        type:     { type: string, description: Provider key from provider config. }
        mode:
          type: string
          enum: [on-demand, service, external, cloud, registry]
        enabled:  { type: boolean }
        protocol: { type: string, example: openai }
        endpoint: { type: string }
        default_command: { type: string }
        default_args:
          type: array
          items: { type: string }
      additionalProperties: true

    ParameterEntry:
      type: object
      description: |
        Single parameter or environment-variable row. Mirrors
        `internal/server/params_types.go:ParameterEntry`. The `source`
        field reflects the highest-priority layer that provided the
        value , a layer above `provider` means the entry is an
        override (`is_override: true`). `ignored: true` means the
        parameter will not be passed at launch.
      required: [key, value, ignored]
      properties:
        key:     { type: string }
        value:   { type: string }
        source:
          type: string
          enum: [provider, node, model, custom]
        auto_resolved_hint:
          type: string
          description: When value is `auto`, shows what it resolves to at launch time.
        ignored:     { type: boolean }
        is_override: { type: boolean }
        warnings:
          type: array
          items: { type: string }

    ProviderParametersPatch:
      type: object
      description: |
        RFC 7396 merge-patch document over a provider's parameter tree.
        Install overrides belong only to defaults.install and nodes.<node>.install.
        Their effective changes need acknowledged protected worker authority before saving.
        The release base install block is read-only; model, endpoint and request tiers
        cannot select a shared venv. Install PATCH never executes or restarts, and
        restart=affected combined with an install change is refused.
        Every level is optional; only what you send is touched. A leaf set
        to `null` deletes the key at that tier.
      properties:
        defaults:
          allOf:
            - $ref: '#/components/schemas/ParameterTierPatch'
            - type: object
              properties:
                install: { $ref: '#/components/schemas/InstallOverrides' }
        models:
          type: object
          description: Keyed by model id, a glob, or a variant's name.
          additionalProperties:
            $ref: '#/components/schemas/ModelCellPatch'
        nodes:
          type: object
          description: Keyed by node name. May nest a `models` map for the node x model cell.
          additionalProperties:
            allOf:
              - $ref: '#/components/schemas/ParameterTierPatch'
              - type: object
                properties:
                  install: { $ref: '#/components/schemas/InstallOverrides' }
                  models:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/ParameterTierPatch'
      example:
        defaults:
          parameters:
            num-ctx: 4096
        nodes:
          worker-1:
            parameters:
              num-gpu: null

    ModelCellPatch:
      description: |
        A `models.<model>` cell: the tier's launch blocks, plus what only a
        model cell holds.

        A cell with `from` is a **variant**: a model name of its own over
        another model's weights (Ollama's FROM, a LiteLLM alias with
        params). Its launch walks its base's cells, then its own; its
        model defaults come from its base's family. On the node that
        serves it, a variant that resolves to the same launch as its base
        is served by its base's process; one that changes the launch
        (a template, `ctx-size`) gets a process of its own. The catalog
        lists a variant wherever its base's weights are (`variant_of` in
        `/v1/models`). See docs/plan_model_templates_and_variants.md.
      allOf:
        - $ref: '#/components/schemas/ParameterTierPatch'
        - type: object
          properties:
            from:
              type: string
              nullable: true
              description: |
                The model whose weights this variant runs, named as
                `/v1/models` lists it (without `@node`), not by an alias;
                `null` makes the cell a plain model entry again. The cell's
                key must then be a literal name of letters, digits and
                `. _ + -` (by convention `<base>+<variant>`) that no
                model's weights already carry; the base must be weights,
                not another variant; and no other provider may define a
                variant of that name. Refusals are `invalid_value` or
                `wrong_type` on `models.<model>.from`.
            request:
              type: object
              nullable: true
              additionalProperties: true
              description: |
                Request-time defaults: top-level request-body fields set on
                each text-generation request (chat, messages, responses,
                completions) for this model when the client did not send
                them, such as `temperature`, `top_p`, `top_k`,
                `max_tokens` or `chat_template_kwargs`. Not translated
                between dialects. Merged per RFC 7396, so `null` deletes a
                field, nested objects included. `input`, `messages`,
                `model`, `prompt`, `stream`, `system` and `tools` are
                refused (`invalid_value`): they carry the conversation or
                the routing.
      example:
        from: Qwen3.8-27B-Q8_0
        parameters:
          ctx-size: 131072
        request:
          chat_template_kwargs:
            enable_thinking: false

    ParameterTierPatch:
      type: object
      description: One tier of the resolution tree.
      properties:
        parameters:
          type: object
          description: Launch flags. Values are scalars, or null to delete.
          additionalProperties: true
        environment:
          type: object
          description: Environment variables. `""` means "set to empty", null deletes.
          additionalProperties: true

    ResolvedParameters:
      type: object
      description: |
        The effective value of every key after walking the tier chain, with
        the tier each value came from. Served by
        `GET /providers/{name}/resolved` and returned by the merge-patch
        route so a writer sees the result without a follow-up read.
      required: [parameters, environment]
      properties:
        install: { type: object, additionalProperties: { $ref: '#/components/schemas/ResolvedInstall' } }
        parameters:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ResolvedValue'
        environment:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ResolvedValue'
        request:
          type: object
          description: |
            Request-body defaults each request for the model gets, from
            the model-default and model tiers (a variant's base first,
            then the variant). A field the client sends wins. Values keep
            their JSON type here. Absent when there are none.
          additionalProperties:
            $ref: '#/components/schemas/ResolvedValue'
        from:
          type: string
          description: The base whose weights the model runs, when it is a variant.

    ResolvedValue:
      type: object
      required: [value, tier]
      properties:
        value:
          description: |
            The winning value. Under `parameters` and `environment` it is
            always a string: the tier maps that feed the resolver are
            string-keyed, so `num-ctx` comes back as `"2048"` even though
            its schema types it `int`, and `""` is a real value, distinct
            from an absent key. The accepted type of each key is in
            `GET /providers/{name}/schema`. Under `request` it keeps its
            JSON type, as it will be sent in the request body.
        tier:
          type: string
          description: |
            Which tier supplied this value, lowest first. `model-default`
            is the release's per-family value; every later tier is the
            operator's.
          enum: [default, model-default, model, node, node-model, request, "feature:vision"]
        node:  { type: string, description: Set when tier is node or node-model. }
        model: { type: string, description: Set when tier is model-default, model or node-model. }
        pattern:
          type: string
          description: |
            The model key that supplied the value when it is not the
            model's own name: a glob such as `qwen*`, or the family
            pattern of a model default such as `qwen3.8-*`.
        sha256:
          type: string
          description: |
            For an injected model feature or a key whose schema type is `asset`: the content digest of
            the file the value names, so a caller sees which bytes a launch
            gets. Absent for other keys, missing assets, and legacy feature files without a manifest digest.

    AssetInfo:
      type: object
      required: [name, size, sha256, shipped, referenced_by]
      properties:
        name: { type: string, description: The asset's name, which an asset-typed parameter takes as its value. }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        shipped:
          type: boolean
          description: Ships with zzRouter; restored on every start and cannot be replaced or deleted.
        referenced_by:
          type: array
          items: { type: string }
          description: Merge-patch paths of the parameters naming this asset, e.g. `models.qwen.parameters.chat-template-file`.

    AssetWrite:
      allOf:
        - $ref: '#/components/schemas/AssetInfo'
        - type: object
          properties:
            runs: { $ref: '#/components/schemas/RunsReport' }

    RunsReport:
      type: object
      required: [stale]
      description: |
        What a provider write means for the models already running. Each
        node judges its own runs against the config it holds, so a run on
        a node the write has not reached is reported unknown rather than
        current.
      properties:
        stale:
          type: array
          items: { $ref: '#/components/schemas/RunRef' }
          description: Runs a restart would give what the write changed.
        overridden:
          type: array
          items: { $ref: '#/components/schemas/RunRef' }
          description: |
            Current runs that hold their own value for a key whose config
            value differs. A restart replays the run's own value, so a
            write to those keys does not reach them.
        unknown:
          type: array
          items: { $ref: '#/components/schemas/RunRef' }
          description: Runs whose node cannot say; `reason` tells why. Never restarted.
        restart_job_id:
          type: string
          description: |
            With `restart=affected`, the job restarting the stale runs; follow
            it on `/zzrouter/v1/jobs/{id}`. It fails, naming each run, if any
            run did not relaunch.
        error:
          type: string
          description: Why the runs could not be listed. The write stands.

    RunRef:
      type: object
      required: [id, node, model]
      properties:
        id: { type: string }
        node: { type: string }
        model: { type: string }
        changed:
          type: array
          items: { type: string }
        overridden:
          type: array
          items: { type: string }
        reason: { type: string }

    ParametersStatus:
      type: object
      required: [state]
      description: |
        Whether a run still has what its config resolves to: the launch a
        restart would make now, compared with the one it was made with.
        Keys are `parameters.<key>` and `environment.<KEY>`; a parameter
        naming an asset also changes when the asset's content does.
      properties:
        state:
          type: string
          enum: [current, stale, unknown]
          description: |
            `stale` means a restart is owed. `unknown` means the config as
            it stands would not relaunch the run, so restarting it would
            leave the model down; `error` says why.
        changed:
          type: array
          items: { type: string }
          description: What a restart would launch differently.
        overridden:
          type: array
          items: { type: string }
          description: |
            Keys the run was launched with explicitly whose config value
            differs. A restart replays the run's own value for these.
        error: { type: string }

    AssetList:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          items: { $ref: '#/components/schemas/AssetInfo' }

    ParamError:
      type: object
      description: |
        One per-key failure, and the only such shape on this API: a body
        field that failed validation, a provider parameter that failed
        its schema, and a failed install preflight check all arrive
        looking like this, inside `Problem.errors`.

        There used to be a second envelope for the parameter routes, on
        the grounds that one patch can fail on several keys at once.
        `Problem` already carried several, so what the split really cost
        was a body no client could read.

        Mirrors `pkg/utils.ParamError`; `code` is drawn from
        `pkg/httperr.ParamErrorCode`.
      required: [code, message]
      properties:
        key:
          type: string
          description: |
            What failed: a JSON field name, a dotted parameter path, or
            the name of a check. Absent when the failure belongs to the
            request as a whole rather than to one input.
        code:
          type: string
          # Full pkg/httperr.AllParamErrorCodes() enum; pinned by
          # TestOpenAPIParamErrorEnum_MatchesDeclaredCodes.
          enum: [unknown_flag, unknown_field, wrong_type, out_of_range, unknown_node, unknown_model, coercion_failed, retired, route_unknown, replica_unknown, replica_last_in_group, route_not_claimed, reserved_name, required, invalid_value, preflight_failed, unknown_asset, asset_in_use]
        got:
          description: |
            The value that was rejected. Omitted where echoing it would
            be unsafe: body validation never sets it, because the value
            that failed `required` or an email check may be a credential.
        want:    { type: string, description: The expected type or set of values. }
        min:     { description: Lower bound when code is out_of_range. }
        max:     { description: Upper bound when code is out_of_range. }
        message: { type: string }
        hint:
          type: string
          description: >
            What to do about it, when the failure has a known remedy.
            `message` says what is wrong; this says how to fix it.

    AppParameters:
      type: object
      description: |
        Response shape for `GET /providers/{name}/parameters`. Mirrors
        `internal/server/params_types.go:AppParametersResponse`.
      required: [provider, parameters, environment]
      properties:
        provider: { type: string }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/ParameterEntry' }
        environment:
          type: array
          items: { $ref: '#/components/schemas/ParameterEntry' }

    NodeParameters:
      type: object
      description: |
        Per-node overrides layered on top of AppParameters. Mirrors
        `params_types.go:NodeParametersResponse`.
      required: [provider, node, parameters, environment]
      properties:
        provider: { type: string }
        node:     { type: string }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/ParameterEntry' }
        environment:
          type: array
          items: { $ref: '#/components/schemas/ParameterEntry' }

    ModelParameters:
      type: object
      description: Per-model overrides layered on top of AppParameters.
      required: [provider, model, parameters, environment]
      properties:
        provider: { type: string }
        model:    { type: string }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/ParameterEntry' }
        environment:
          type: array
          items: { $ref: '#/components/schemas/ParameterEntry' }

    UpdateParametersRequest:
      type: object
      description: |
        Replace the parameter/env values for a provider (optionally
        scoped per-node or per-model). Keys not listed are left
        untouched. Mirrors `params_types.go:UpdateParametersRequest`.
      properties:
        parameters:
          type: object
          additionalProperties: { type: string }
        environment:
          type: object
          additionalProperties: { type: string }

    UpdateParametersResponse:
      type: object
      required: [provider, parameters, environment, saved]
      properties:
        provider: { type: string }
        node:     { type: string }
        model:    { type: string }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/ParameterEntry' }
        environment:
          type: array
          items: { $ref: '#/components/schemas/ParameterEntry' }
        saved:
          type: boolean
          description: False when `dry_run=true` was set in the request.

    IgnoreParameterResponse:
      type: object
      required: [key, ignored]
      properties:
        key:     { type: string }
        ignored: { type: boolean }

    ConnectToClusterNodeRequest:
      type: object
      required: [host_url]
      properties:
        host_url: { type: string, description: Full URL of the candidate cluster node. }
        timeout:
          type: integer
          minimum: 1
          description: Override the default connect timeout, in seconds.

    ClusterConnection:
      type: object
      description: |
        Result of probing a single cluster endpoint. Emitted by
        `POST /cluster/connect` and composed inside the
        validation report.
      required: [status, node_url, version, is_healthy]
      properties:
        status:
          type: string
          enum: [connected, unhealthy]
        node_url:     { type: string }
        version:      { type: string }
        is_healthy:   { type: boolean }
        connected_at: { type: string, format: date-time }
        last_checked: { type: string, format: date-time }
        message:      { type: string }
        error:        { type: string }

    ClusterValidationReport:
      type: object
      description: |
        Aggregate health report produced by `POST /cluster/validate`.
        When any endpoint is unhealthy the response also carries an
        `X-Status-Code: 206` header as a soft-error hint for clients
        that want to surface a warning without failing the whole call.
      required: [total_hosts, healthy_hosts, unhealthy_hosts, validation_time]
      properties:
        total_hosts:     { type: integer, minimum: 0 }
        healthy_hosts:   { type: integer, minimum: 0 }
        unhealthy_hosts: { type: integer, minimum: 0 }
        validation_time: { type: string, format: date-time }
        healthy:
          type: array
          items: { $ref: '#/components/schemas/ClusterConnection' }
        unhealthy:
          type: array
          items: { $ref: '#/components/schemas/ClusterConnection' }

    ClusterPairRequest:
      type: object
      description: |
        Selects which part of the pairing-window lifecycle to drive.
        `regenerate` and `cancel` are mutually exclusive; with neither
        set, the call opens a window or reuses the active one.
      properties:
        coordinator_url:
          type: string
          description: |
            Coordinator to pair with, e.g. `https://192.0.2.6:9091`.
            Required on the call that opens a window, ignored on the
            others. Supplied per request, never persisted.
          example: https://192.0.2.6:9091
        coordinator_ca_fingerprint:
          type: string
          description: |
            SHA-256 of the coordinator CA, as `sha256:<hex>` or bare
            hex. This is what makes the first connection trustworthy,
            so it is read out of band and not discovered over the wire.
        regenerate:
          type: boolean
          description: Replace the active code with a fresh one.
        cancel:
          type: boolean
          description: Close the active window.

    ClusterPairResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, existing, cancelled, no_active_window]
          description: |
            `new` opened a window, `existing` reused one, `cancelled`
            closed one, `no_active_window` means there was none to
            report. Read `mode` alongside it to tell a completed pair
            from an expired window.
        code:
          type: string
          description: Pairing code to carry to the coordinator. Absent once the window closes.
        deadline:
          type: string
          format: date-time
          description: When the window expires.
        mode:
          type: string
          enum: [unclaimed, worker, coordinator, disabled]
          description: |
            The node's current cluster mode. `worker` after a poll that
            found no window is the success signal: the coordinator
            consumed the code.
        error:
          type: string
          description: |
            Last terminal failure from the background pairing loop,
            delivered exactly once and then cleared. This is where a
            coordinator-side refusal surfaces, rather than as a generic
            "no active window".

    PendingPairing:
      type: object
      description: One pairing request awaiting acceptance. The code is not included.
      required: [node_name, fingerprint, age_seconds]
      properties:
        node_name:   { type: string }
        fingerprint: { type: string, description: SPKI fingerprint of the requesting node. }
        age_seconds: { type: number, description: How long the request has been queued. }

    PairingAcceptance:
      type: object
      description: |
        Confirmation that a pairing was accepted. Carries identity, not
        credentials: the signed certificate goes to the worker over its
        own long-poll.
      required: [node_name, fingerprint, short_form]
      properties:
        node_name:   { type: string }
        fingerprint: { type: string }
        short_form:  { type: string, description: Abbreviated fingerprint for display and for reading aloud. }

    DecommissionWorkerRequest:
      type: object
      required: [worker_addr]
      properties:
        worker_addr:
          type: string
          description: The worker's cluster-port address, `host:port`.
          example: "192.0.2.10:9091"
        public_url:
          type: string
          description: |
            The worker's public API URL as this coordinator's registry
            knows it. When omitted the handler assumes the
            cluster-port-minus-one convention, which is right for a
            homogeneous fleet and wrong for a node on custom ports:
            pass it explicitly there, or the registry row survives the
            decommission.
          example: http://192.0.2.10:9090
        reason:
          type: string
          description: Recorded in the audit log only.

    RevokeWorkerRequest:
      type: object
      required: [fingerprint]
      properties:
        fingerprint:
          type: string
          description: |
            SPKI SHA-256, as `sha256:<hex>` or bare hex. Read it from
            the pending-pairing listing or from local records.
        serial:
          type: string
          description: |
            Certificate serial, forensic metadata only. Serials roll on
            renewal, so they are not the match key.
        reason:
          type: string

    ClusterGPUInventory:
      type: object
      description: Flat per-GPU rows across the cluster, plus per-host failures.
      required: [gpus, errors, summary]
      properties:
        gpus:
          type: array
          items: { $ref: '#/components/schemas/ClusterGPURow' }
        errors:
          type: array
          description: One entry per host that failed to answer. Present and empty when all answered.
          items:
            type: object
            required: [node, error]
            properties:
              node:  { type: string }
              error: { type: string }
        summary:
          type: object
          required: [total_hosts, successful_hosts, failed_hosts, total_gpus]
          properties:
            total_hosts:      { type: integer, minimum: 0 }
            successful_hosts: { type: integer, minimum: 0 }
            failed_hosts:     { type: integer, minimum: 0 }
            total_gpus:       { type: integer, minimum: 0 }

    ClusterGPURow:
      type: object
      description: |
        One GPU and the node it belongs to. Mirrors
        `pkg/discovery/hardware.GPUInfo` with the node name added.
      required: [node, name, memory_gb]
      properties:
        node: { type: string, description: Node the card is installed in. }
        name: { type: string, example: NVIDIA RTX PRO 6000 Blackwell }
        pci_address:
          type: string
          description: |
            Canonical `0000:01:00.0` form. Present when the scan could
            join the vendor tool's rows to the PCI listing, which is
            what keeps multi-GPU hosts from mismatching cards.
        memory_gb:          { type: number }
        driver_version:     { type: string }
        cuda_version:       { type: string }
        compute_capability: { type: string, example: "90" }

    ProviderParameterSchema:
      type: object
      description: |
        What a provider accepts, as the union of the Go spine and the
        provider's `schema.yaml`. This is the set parameter writes are
        validated against.
      required: [parameters, environment]
      properties:
        diagnostics:
          $ref: '#/components/schemas/ProviderDiagnostics'
        parameters:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ParameterShape' }
        environment:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ParameterShape' }
        endpoints:
          type: object
          description: |
            Per-endpoint parameter sets, for providers whose accepted
            parameters differ by endpoint. Absent when they do not.
          additionalProperties:
            type: object
            required: [parameters]
            properties:
              parameters:
                type: object
                additionalProperties: { $ref: '#/components/schemas/ParameterShape' }

    ProviderDiagnostics:
      type: object
      description: Release-managed fixed probe declarations. Read-only; absent on legacy nodes. This metadata does not authorize installing packages.
      required: [runtime, runtimes]
      properties:
        runtime: { type: string }
        runtimes:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ProviderRuntimeChecks' }
        memory:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [fraction_total, layers, unified, external] }
            parameter: { type: string }
            device_count_parameter: { type: string }
            auto_safety_margin_mib:
              type: integer
              format: int64
              minimum: 0
              description: Positive per-GPU reserve in MiB; zero or omitted uses max(2048 MiB, ceil(5% of total GPU memory)). Shipped diagnostic schemas are release-owned.

    ProviderRuntimeChecks:
      type: object
      required: [kernels]
      properties:
        imports: { type: array, maxItems: 32, items: { type: string } }
        packages: { type: array, maxItems: 32, items: { type: string } }
        checks:
          type: array
          items: { type: string, enum: [pip_check, imports, cuda_companions, cuda_available, metal_available, managed_toolkit] }
        kernels: { type: string, enum: [prebuilt, jit, prebuilt_or_jit, external, unknown] }
        toolkit_minimum: { type: object, additionalProperties: { type: string } }
        workaround: { type: object, additionalProperties: { type: string, enum: ['0', '1'] } }
    RuntimeCheck:
      type: object
      required: [name, passed, actual, reason]
      properties:
        name: { type: string }
        passed: { type: boolean }
        actual: { type: string }
        reason: { type: string }

    ProviderEnvironment:
      type: object
      required: [contract, provider, runtime, node, installed, drivers, kernels, findings, api_workarounds]
      properties:
        desired_install: { $ref: '#/components/schemas/ResolvedInstall' }
        installed_manifest: { type: object, description: Actual installed recipe, dependency hashes and interpreter metadata. }
        recipe_drift: { type: boolean }
        install_authority: { type: object, description: Non-secret release capability, protected policy grant and fingerprint or refusal reason. }
        contract: { type: string, const: runtime_environment_v1 }
        provider: { type: string }
        runtime: { type: string }
        node: { type: string }
        installed: { type: boolean }
        drivers:
          type: array
          items:
            type: object
            properties:
              vendor: { type: string }
              name: { type: string }
              driver_version: { type: string }
              cuda_version: { type: string, description: Maximum CUDA version supported by driver }
              compute_capability: { type: string }
              uuid: { type: string }
              pci_address: { type: string }
              memory_mib: { type: integer }
              driver_index: { type: integer }
        driver_evidence: { type: string }
        kernels: { type: string, enum: [prebuilt, jit, prebuilt_or_jit, external, unknown] }
        kernel_evidence: { type: string }
        environment:
          type: object
          properties:
            packages:
              type: object
              additionalProperties:
                type: object
                required: [installed, version, reason]
                properties:
                  installed: { type: boolean }
                  version: { type: string }
                  reason: { type: string }
            cuda_runtime:
              type: object
              properties:
                build_version: { type: string }
                loaded_version: { type: string }
                library_path: { type: string }
                reason: { type: string }
            toolkit:
              type: object
              properties:
                path: { type: string }
                version: { type: string }
                source: { type: string }
                reason: { type: string }
            devices:
              type: array
              items:
                type: object
                properties:
                  index: { type: integer }
                  name: { type: string }
                  capability: { type: string }
            metal_available: { type: boolean, nullable: true }
            metal_reason: { type: string }
        findings:
          type: array
          items:
            type: object
            required: [name, detected, required, impact, human_remediation, api_workarounds]
            properties:
              name: { type: string }
              detected: { type: string }
              required: { type: string }
              impact: { type: string }
              human_remediation: { type: array, items: { type: string } }
              api_workarounds: { type: object, additionalProperties: { type: string } }
        api_workarounds:
          type: array
          items:
            type: object
            properties:
              variable: { type: string }
              value: { type: string }
              active: { type: boolean }
              method: { type: string, const: PATCH }
              path: { type: string }
              body: { type: object, description: Merge-patch for this node's environment workaround }

    InstallVerifyResult:
      type: object
      required: [provider, all_ok, steps]
      properties:
        provider: { type: string }
        all_ok: { type: boolean }
        check_contract: { type: string, description: Supported contracts are install_steps_v1 and runtime_checks_v1. Absent or unknown contracts cannot attest current checks. }
        checks:
          type: array
          items: { $ref: '#/components/schemas/RuntimeCheck' }
        steps:
          type: array
          items:
            type: object
            required: [step, passed, message]
            properties:
              step: { type: integer }
              passed: { type: boolean }
              actual: { type: string }
              message: { type: string }
              unverifiable: { type: boolean }
              checks:
                type: array
                items: { $ref: '#/components/schemas/RuntimeCheck' }

    ParameterShape:
      type: object
      required: [type]
      properties:
        type:        { type: string, description: Declared kind; defaults to `string` when the schema omits it. }
        min:         { type: number }
        max:         { type: number }
        description: { type: string }
        enum:
          type: array
          items: { type: string }
        pass:
          type: string
          enum: [path, content]
          description: |
            For `type: asset` only: how the asset reaches the engine.
            `path` (also when absent) passes the file's absolute path on
            the launching node; `content` passes the file's text as the
            flag's value, for engines such as mlx_lm whose
            `--chat-template` takes the template itself.

    RouteSpec:
      type: object
      description: One mounted route, as the running engine reports it.
      required: [method, path, surface, auth]
      properties:
        method: { type: string, example: GET }
        path:
          type: string
          description: gin template, so `:name` binds one segment and `*id` binds the rest.
          example: /zzrouter/v1/runs/:id
        surface:
          type: string
          enum: [health, infra, openai, ollama, admin, internal, nativewire, mcp, other]
          description: Which API group the route belongs to.
        auth:
          type: string
          enum: [none, optional, admin, cluster]
          description: Credential tier the route expects.
        streaming:
          type: string
          enum: [sse, chunked]
          description: |
            Present when the response is a stream. Reading such a route
            to completion with an ordinary client blocks until that
            client's own timeout.
        async:
          type: boolean
          description: Present when the route answers `202` with a job id rather than a result.
        retired:
          type: boolean
          description: |
            Present when the route is mounted but only answers
            `410 Gone`. Derived from the mounted handler, so it tracks
            the routing table exactly.

    AccessFieldSchema:
      type: object
      description: |
        Accepted fields for a virtual key or a team, split by
        operation because they differ: immutable fields appear under
        `create` only.
      required: [create, update]
      properties:
        create:
          type: object
          additionalProperties: { $ref: '#/components/schemas/AccessField' }
        update:
          type: object
          additionalProperties: { $ref: '#/components/schemas/AccessField' }

    AccessField:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: "`string`, `int`, `float`, or a composite such as `object<string,string>`."
        required:    { type: boolean }
        min:
          description: |
            Lower bound. On quota fields it is `0`, and it is emitted
            rather than omitted precisely to say that `0` means
            unenforced.
        max:         {}
        description: { type: string }
        enum:
          type: array
          items: { type: string }

    SpendBreachEvent:
      type: object
      description: |
        One quota event: a threshold crossing or a refusal. Carried as
        the `data:` line of the `breach` event on
        `GET /zzrouter/v1/spend/events`.
      required: [time, scope, scope_id, reason]
      properties:
        time: { type: string, format: date-time }
        scope:
          type: string
          enum: [key, team]
          description: Whether the budget belongs to a key or to a team.
        scope_id: { type: string, description: The key id or team id. }
        reason:
          type: string
          description: |
            What happened. Threshold crossings and hard breaches share
            this stream and are told apart here, with
            `threshold_percent` set on the former.
        spend_limit_micro:
          type: integer
          format: int64
          description: Configured limit in millionths of a USD.
        spend_used_micro:
          type: integer
          format: int64
          description: Settled spend in the current period.
        spend_held_micro:
          type: integer
          format: int64
          description: |
            Reserved by requests still in flight. Held amounts settle
            or release when those requests finish, so used plus held is
            what the limit is actually checked against.
        budget_period:  { type: string, enum: [daily, weekly, monthly] }
        threshold_percent:
          type: integer
          description: Set on threshold events, e.g. `80` for the 80% crossing.

    ConfigReloadReport:
      type: object
      description: |
        What each registered listener did with a reload. The HTTP
        status carries the worst disposition, so the entries are for
        diagnosis rather than for branching.
      required: [entries, needs_restart, has_rejection]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [listener, disposition]
            properties:
              listener:    { type: string, description: Which subsystem answered. }
              disposition:
                type: string
                enum: [applied, ignored, requires_restart, rejected]
                description: |
                  `ignored` means the listener had no interest in what
                  changed, which is a normal outcome, not a failure.
              message:     { type: string }
        needs_restart: { type: boolean }
        has_rejection: { type: boolean }

    SystemInfo:
      type: object
      description: |
        Node identity, runtime metrics, and hardware info. Produced by
        `internal/server/system.go:getLocalSystemInfo` and merged with
        the host's hardware report. The spec names the stable keys the
        handler always emits; additional hardware fields (memory, disk,
        cpu, gpu) flow through as open map entries.
      required: [hostname, role, os, arch, go_version, num_cpu, num_goroutine, cluster_mode]
      properties:
        hostname: { type: string }
        role:
          type: string
          enum: [standalone, coordinator, worker]
        cluster_mode:
          type: string
          enum: [master, worker]
        os:            { type: string }
        arch:          { type: string }
        go_version:    { type: string }
        num_cpu:       { type: integer, minimum: 0 }
        num_goroutine: { type: integer, minimum: 0 }
        apps_total:    { type: integer, minimum: 0 }
        apps_enabled:  { type: integer, minimum: 0 }
        instances_running: { type: integer, minimum: 0 }
        models_total:  { type: integer, minimum: 0 }
        connection_pool:
          $ref: '#/components/schemas/ConnectionPoolStats'
      additionalProperties: true

    ConnectionPoolStats:
      type: object
      description: |
        HTTP + streaming connection pool metrics emitted alongside
        SystemInfo. Lets observability clients watch saturation without
        reaching into /metrics.
      properties:
        http_active_requests:     { type: integer, minimum: 0 }
        http_total_requests:      { type: integer, format: int64, minimum: 0 }
        http_max_idle_conns:      { type: integer, minimum: 0 }
        http_max_idle_per_host:   { type: integer, minimum: 0 }
        stream_active_requests:   { type: integer, minimum: 0 }
        stream_total_requests:    { type: integer, format: int64, minimum: 0 }
        stream_max_idle_conns:    { type: integer, minimum: 0 }
        stream_max_idle_per_host: { type: integer, minimum: 0 }

    SemanticVersion:
      type: object
      description: >
        A parsed version. The update subsystem carries versions as
        objects rather than strings so a comparison is a field
        comparison; `0.1.1+08252101` is the string form of the same
        thing and is what /health and the node list report.
      required: [major, minor, patch]
      properties:
        major:       { type: integer, minimum: 0 }
        minor:       { type: integer, minimum: 0 }
        patch:       { type: integer, minimum: 0 }
        pre_release: { type: string, description: 'alpha, beta, rc1 ... Absent on a final release.' }
        build_meta:  { type: string, description: Build stamp, e.g. a date or commit. }

    UpdateStatus:
      type: object
      description: |
        Auto-update state machine snapshot. Mirrors
        `pkg/update/types.go:UpdateStatus`. `state` moves through
        `checking → downloading → verifying → applying → restarting`
        and can parkat `waiting_for_window` or `failed`.
      required: [enabled, state, current_version, channel, update_available]
      properties:
        state:
          type: string
          enum: [idle, checking, downloading, verifying, waiting_for_window, applying, restarting, failed]
        enabled:               { type: boolean, description: Scheduled updating only. }
        confirmation_error:    { type: string }
        operation:             { $ref: '#/components/schemas/UpdateOperation' }
        pending_confirm:       { type: object }
        restart_required:      { type: boolean }
        restart_required_reason: { type: string }
        delegated_to:          { type: string }
        current_version:       { $ref: '#/components/schemas/SemanticVersion' }
        latest_version:        { $ref: '#/components/schemas/SemanticVersion' }
        pending_release:       { $ref: '#/components/schemas/UpdateReleaseInfo' }
        last_check_time:       { type: string, format: date-time }
        next_check_time:       { type: string, format: date-time }
        last_update_time:      { type: string, format: date-time }
        error:                 { type: string }
        download_progress:     { type: integer, minimum: 0, maximum: 100 }
        channel:               { type: string }
        update_available:      { type: boolean }
        maintenance_window_active: { type: boolean }

    UpdateSettingsEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [node, enabled]
              properties:
                node: { type: string }
                enabled: { type: boolean }

    UpdateOperation:
      type: object
      properties:
        job_id: { type: string, description: Local operation identity, including privileged handoff. }
        action: { type: string }
        state: { type: string }
        to_version: { type: string }
        from_version: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        success: { type: boolean }
        error: { type: string }

    NodeUpdate:
      type: object
      required: [node, state]
      properties:
        node: { type: string }
        state: { type: string, enum: [pending, applying, succeeded, failed, skipped] }
        from_version: { type: string }
        started_at: { type: string, format: date-time }
        operation_id: { type: string }
        previous_operation_id: { type: string }
        error: { type: string }

    UpdateRollout:
      type: object
      required: [job_id, version, state, nodes]
      properties:
        job_id: { type: string }
        version: { type: string }
        state: { type: string, enum: [running, succeeded, failed, cancelled] }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeUpdate' }

    NodeUpdateCollection:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [node]
            properties:
              node: { type: string }
              status: { $ref: '#/components/schemas/UpdateStatus' }
              history: { $ref: '#/components/schemas/UpdateHistory' }
              state: { type: string, enum: [pending, failed] }
              error: { type: string }
        rollouts:
          type: array
          items: { $ref: '#/components/schemas/UpdateRollout' }

    UpdateCheckResult:
      type: object
      description: Result of a manual or scheduled update check.
      required: [update_available, current_version]
      properties:
        update_available: { type: boolean }
        current_version:  { $ref: '#/components/schemas/SemanticVersion' }
        latest_release:   { $ref: '#/components/schemas/UpdateReleaseInfo' }
        skipped_reason:   { type: string }

    UpdateReleaseInfo:
      type: object
      description: |
        GitHub release descriptor. Mirrors
        `pkg/update/types.go:ReleaseInfo`. `version` and `tag_name`
        carry the parsed and raw tag respectively.
      properties:
        version:      { $ref: '#/components/schemas/SemanticVersion' }
        tag_name:     { type: string }
        name:         { type: string }
        body:         { type: string, description: Release notes (markdown). }
        published_at: { type: string, format: date-time }
        html_url:     { type: string, format: uri }
        assets:
          type: array
          items: { $ref: '#/components/schemas/UpdateReleaseAsset' }
        prerelease: { type: boolean }
        draft:      { type: boolean }

    UpdateReleaseAsset:
      type: object
      required: [name, size, browser_download_url]
      properties:
        name:                 { type: string }
        size:                 { type: integer, format: int64, minimum: 0 }
        browser_download_url: { type: string, format: uri }
        content_type:         { type: string }

    UpdateHistory:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/UpdateHistoryEntry' }
        last_updated: { type: string, format: date-time }

    UpdateHistoryEntry:
      type: object
      required: [id, timestamp, success, automatic]
      properties:
        id:           { type: string }
        timestamp:    { type: string, format: date-time }
        from_version: { $ref: '#/components/schemas/SemanticVersion' }
        to_version:   { $ref: '#/components/schemas/SemanticVersion' }
        success:      { type: boolean }
        error:        { type: string }
        duration:
          type: integer
          format: int64
          description: Wall-clock duration in nanoseconds.
        backup_path:  { type: string }
        automatic:    { type: boolean }

    PricingEntry:
      type: object
      description: |
        Lookup-shape pricing entry emitted by
        `internal/server/pricing_handlers.go:HandleLookup`. The handler
        re-projects `pkg/pricing/types.go:ModelPricing` into a flat
        envelope with both per-token and per-1M cost views so clients
        can pick the scale that fits the display.
      required: [model, provider, mode, input_cost_per_token, output_cost_per_token]
      properties:
        model:                 { type: string }
        provider:              { type: string, description: LiteLLM provider key. }
        mode:                  { type: string, example: chat }
        input_cost_per_token:  { type: number, minimum: 0 }
        output_cost_per_token: { type: number, minimum: 0 }
        input_cost_per_1m:     { type: number, minimum: 0 }
        output_cost_per_1m:    { type: number, minimum: 0 }
        max_input_tokens:      { type: integer, minimum: 0 }
        max_output_tokens:     { type: integer, minimum: 0 }
        supports_vision:            { type: boolean }
        supports_function_calling:  { type: boolean }

    PricingListItem:
      type: object
      description: |
        Compact pricing row used by `/pricing` search results. Same
        underlying source as PricingEntry but omits the per-token
        columns to keep large result sets compact.
      required: [model, provider, mode]
      properties:
        model:              { type: string }
        provider:           { type: string }
        mode:               { type: string }
        input_cost_per_1m:  { type: number, minimum: 0 }
        output_cost_per_1m: { type: number, minimum: 0 }
        max_input_tokens:   { type: integer, minimum: 0 }
        max_output_tokens:  { type: integer, minimum: 0 }

    PricingStatus:
      type: object
      required: [enabled, model_count]
      properties:
        enabled:      { type: boolean }
        model_count:  { type: integer, minimum: 0 }
        fetched_at:   { type: string, format: date-time }
        content_hash: { type: string, description: SHA hash of the cached pricing payload. }
        unpriced_count:
          type: integer
          minimum: 0
          description: |
            Distinct (provider, model) pairs that served traffic with no
            price. Each settled at $0 and drew down no budget, so a
            non-zero count is an action item, not a statistic.
        unpriced:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: Un-priced request counts keyed `provider/model`.

    PricingOverride:
      type: object
      required: [model, input_cost_per_1m, output_cost_per_1m]
      description: |
        An operator-supplied rate that outranks the upstream table
        everywhere, including on `/pricing/{model}`.
      properties:
        provider:              { type: string, description: Empty matches any provider. }
        model:                 { type: string, description: "Model id, or `*` for every model under `provider`." }
        input_cost_per_1m:     { type: number, minimum: 0 }
        output_cost_per_1m:    { type: number, minimum: 0 }
        cache_read_cost_per_1m: { type: number, minimum: 0 }
        input_cost_per_token:  { type: number, minimum: 0, readOnly: true }
        output_cost_per_token: { type: number, minimum: 0, readOnly: true }
        billed_per_token:
          type: boolean
          readOnly: true
          description: |
            False when every rate is zero , how an operator declares a
            provider that bills by subscription rather than per token.
        applies_to_all_models: { type: boolean, readOnly: true }
        note:                  { type: string }
        updated_at:            { type: string, format: date-time, readOnly: true }
        updated_by:            { type: string, readOnly: true }

    DeploymentRequest:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model: { type: string }
        provider:
          type: string
          description: Inference provider key. Omitted only when each target has one eligible provider.
        registry: { type: string }
        file: { type: string }
        format: { type: string }
        force:
          type: boolean
          description: Re-fetch the selected files from the registry, bypassing local presence and peer sync.
        features:
          type: array
          items: { type: string, enum: [vision] }
          description: Omitted selects provider defaults. An empty array selects none. Missing default files are skipped; explicitly requested missing files fail.
        restart:
          type: string
          enum: [affected]
          description: After successful deployment, restart only stale runs using these weights on successful targets. Follow restart_job_id for readiness.
        nodes:
          type: array
          items: { type: string }
          description: Target nodes for deployment.
