  /v1/realtime:
    get:
      tags: [OpenAICompat]
      operationId: openaiGetRealtime
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Realtime API WebSocket upgrade
      description: |
        Upgrades the client connection to a bidirectional WebSocket
        against the provider configured as
        `openai_compat.realtime_backend` in node.yaml. Frames flow in
        both directions until either side closes. Returns 503 when no
        backend is configured, 502 when the upstream dial fails, and
        the upstream status code when the backend rejects the upgrade
        (typically 401 or 403).
        Anonymous access to a cloud backend requires `allow_anonymous_cloud`.
        Virtual keys with model allow-lists, spend limits or token-rate limits
        receive 403 because socket frames are forwarded without model or cost
        inspection. Request-rate and concurrency limits are enforced before
        dialing; a socket holds its concurrency slot until it closes.
      responses:
        '101': { description: 'Switching Protocols: WebSocket handshake accepted' }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '403': { $ref: '#/components/responses/OpenAIForbidden' }
        '429': { $ref: '#/components/responses/OpenAIRateLimit' }
        '502': { $ref: '#/components/responses/OpenAIBadGateway' }
        '503': { $ref: '#/components/responses/OpenAIUnavailable' }
    post:
      tags: [OpenAICompat]
      operationId: openaiCreateRealtime
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Realtime API WebSocket upgrade (POST-style)
      description: |
        Some clients POST-upgrade the connection. Behaviour matches the
        GET path above.
      responses:
        '101': { description: Switching Protocols }
        '401': { $ref: '#/components/responses/OpenAIUnauthorized' }
        '403': { $ref: '#/components/responses/OpenAIForbidden' }
        '429': { $ref: '#/components/responses/OpenAIRateLimit' }
        '502': { $ref: '#/components/responses/OpenAIBadGateway' }
        '503': { $ref: '#/components/responses/OpenAIUnavailable' }

