openapi: 3.0.3
info:
  title: zzRouter API
  version: v1
  description: |
    zzRouter is a distributed LLM management platform. This spec describes the
    HTTP surface exposed by a coordinator node.

    ## API groups

    | Prefix              | Purpose                                 | Auth            |
    |---------------------|-----------------------------------------|-----------------|
    | `/health`           | Liveness/readiness probes               | None            |
    | `/openapi.{yaml,json}` | This schema                          | None            |
    | `/zzrouter/v1`      | Management API                          | `AdminKey`      |
    | `/zzrouter/v1/internal` | Cluster-internal API                | mTLS, undocumented |
    | `/v1`               | OpenAI-compatible inference             | `InferenceBearer` / `InferenceKey` |
    | `/v1/messages`      | Anthropic-compatible inference          | `InferenceBearer` / `InferenceKey` |
    | `/api`              | Ollama-compatible inference             | `InferenceBearer` / `InferenceKey` |

    ## Conventions

    - **Paths** use kebab-case for multi-word segments (e.g. `/model-groups`,
      `/inference-logs`).
    - **Query parameters** use snake_case (e.g. `max_matches`). Common
      parameters:
      - `node` , target a specific cluster node. Accepts the local node name,
        a cluster endpoint `"host:port"`, or just the hostname portion of one.
        Empty or `*` means "all nodes".
      - `model` , model identifier (canonical name or provider-qualified).
      - `provider` , provider key (e.g. `vllm`, `ollama`, `mlx`).
      - `registry` , registry/repository filter.
    - **Success envelope** (`SuccessEnvelope`): `{success, message, data}`.
    - **List envelope** (`ListEnvelope`): `{data, total, has_more, metadata?}`.
    - **Errors** use RFC 9457 Problem Details (`application/problem+json`) on
      `/zzrouter/v1/*`, and the OpenAI-shaped error envelope on `/v1/*`.

    ## Spec coverage

    This spec is hand-authored, and every route the coordinator serves on
    `/zzrouter/v1/*`, `/v1/*` and `/api/*` is described here. Drift tests in
    `internal/server` compare the spec against the live routing table in both
    directions, so an undocumented route and a documented route that does not
    exist are both build failures.

    Depth still varies. Most operations carry full request and response
    schemas; some carry a summary, their parameters and their error shapes,
    with the success body left open. `/zzrouter/v1/internal/*` is deliberately
    absent: it is cluster-to-cluster plumbing reached over mTLS, not a client
    contract.

servers:
  - url: /
    description: Current node (same origin)

security:
  - AdminKey: []

# Tag taxonomy: one tag per first path segment, so an agent can predict
# a route's group from its path. The C3 duplicate segments were resolved
# in arc 1.4: /show, /logs and /version/* moved under /server,
# /provider-status became /providers/status, and /system kept its own
# segment (cluster-capable, unlike the node-local /server family).
# Pinned to the live routing table by TestOpenAPITags in internal/server.
tags:
  - name: Spec
    description: The API describing itself. Start here.
  - name: System
    description: Cluster-capable system info.
  - name: Health
  - name: Discovery
    description: Local hardware and network detection.
  - name: Models
  - name: Search
    description: Finding models in upstream catalogs.
  - name: Cache
  - name: Runs
  - name: Providers
  - name: Nodes
  - name: Deployments
  - name: Jobs
  - name: Keys
  - name: Teams
  - name: Spend
  - name: Usage
  - name: Registries
  - name: Cluster
  - name: Config
    description: Reloading provider configuration from disk.
  - name: State
    description: Snapshot and restore of this node's persistent state.
  - name: Server
    description: Node introspection, version and system info.
  - name: InferenceLogs
  - name: ModelGroups
  - name: Pricing
  - name: Update
  - name: Metrics
    description: Prometheus scrape endpoint.
  - name: OpenAICompat
  - name: AnthropicCompat
  - name: OllamaCompat

paths:
  /openapi.yaml:
    get:
      tags: [Spec]
      operationId: getOpenapiYaml
      security: []
      summary: Fetch OpenAPI spec (YAML)
      responses:
        '200':
          description: OK
          content:
            application/yaml:
              schema: { type: string }

  /openapi.json:
    get:
      tags: [Spec]
      operationId: getOpenapiJson
      security: []
      summary: Fetch OpenAPI spec (JSON)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }

  /health:
    get:
      tags: [Health]
      operationId: getHealth
      security: []
      summary: Overall health of this node
      description: >
        Always 200 while the process is alive - it reports liveness plus
        the version and protocol window peers negotiate against, not a
        verdict on the cluster. The one route every node serves,
        coordinator or worker, which is why peer discovery reads it.
      parameters:
        - name: detailed
          in: query
          required: false
          schema: { type: string, enum: ['true'] }
          description: >
            `true` adds a `details` object carrying build info and the
            config this process loaded. Worth asking for when a node
            answers but behaves like it read a different file.
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: Draining or unhealthy
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /health/live:
    get:
      tags: [Health]
      operationId: getHealthLive
      security: []
      summary: Liveness probe
      description: >
        Deliberately the cheapest route on the node: status and version,
        nothing computed. Probe budgets are per-second, so anything that
        touches the cluster or the provider registry belongs on /health
        instead.
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthLiveResponse' }

  /health/liveliness:
    get:
      tags: [Health]
      operationId: getHealthLiveliness
      security: []
      summary: Liveness probe (long-form alias)
      description: >
        Same handler as `/health/live`. Both spellings exist because
        orchestrators disagree about the suffix, and a probe misspelling
        it would otherwise get a 404 that reads like a dead node.
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthLiveResponse' }

  /health/ready:
    get:
      tags: [Health]
      operationId: getHealthReady
      security: []
      summary: Readiness probe
      description: >
        Answers the full health payload with `status: ready`. During
        graceful shutdown it flips to `draining` and 503 so an
        orchestrator stops routing here while in-flight requests finish.
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: Draining
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /health/readiness:
    get:
      tags: [Health]
      operationId: getHealthReadiness
      security: []
      summary: Readiness probe (long-form alias)
      description: Same handler as `/health/ready`.
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: Draining
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /health/services:
    get:
      tags: [Health]
      operationId: getHealthServices
      security: []
      summary: State of this node's integrations
      description: >
        One entry per capability the node advertised at startup. The
        entries currently report `registered` rather than a probe
        result: the route exists so a multi-service probe gets a
        structured answer instead of a 404, and it will report live
        state as each subsystem gains one.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthServices' }

  /health/shared-status:
    get:
      tags: [Health]
      operationId: getHealthSharedStatus
      security: []
      summary: Multi-node coordination state
      description: >
        Reports `standalone` with no peers on a single node. Peer
        enumeration arrives when the cluster registry is wired to this
        route; until then treat an empty `peers` as "not reported here",
        not as "this node has no peers" - `GET /zzrouter/v1/nodes` is
        the authority on cluster membership.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthSharedStatus' }

  /metrics:
    get:
      tags: [Metrics]
      operationId: getMetrics
      security: []
      summary: Prometheus metrics
      description: >
        Prometheus text exposition for this node. On a coordinator,
        `?node=<name>` proxies the scrape to that worker over the
        cluster mTLS port, so one scrape target reaches the whole
        cluster without per-worker network access. The route is always
        mounted: when observability is off it answers 503 with the
        setting to change, rather than a 404 that reads as "wrong URL".
      parameters:
        - name: node
          in: query
          required: false
          schema: { type: string }
          description: Worker node name to proxy the scrape to. Coordinator only.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: { type: string }
        '503':
          description: >
            Metrics are disabled, or the named node is not in the
            cluster registry, or the proxy call failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1:
    get:
      tags: [Spec]
      operationId: getApiDiscovery
      summary: API discovery document
      description: |
        Returns the list of endpoint groups enabled on this node and the
        URLs of the OpenAPI spec. Useful for AI agents that want to bootstrap
        without hardcoding paths or feature flags.
      responses:
        '200':
          description: Discovery document
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/APIDiscovery'
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/health:
    get:
      tags: [Health]
      operationId: getApiHealth
      summary: Cluster-wide health aggregated across nodes
      description: |
        Health of this node behind the admin key, in the management
        envelope. `GET /health` is the unauthenticated probe a load balancer
        should use; this one is for a client that already holds a key and
        wants the same answer in the shape the rest of the API returns.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/server/version:
    get:
      tags: [Server]
      operationId: getServerVersion
      summary: Minimal local version for quick checks
      description: |
        The version this node is running, in the short form the CLI prints
        and the connect probe checks. `GET /zzrouter/v1/nodes` carries the
        same field for every node in the cluster.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          version:      { type: string }
                          api_version:  { type: string, example: v1 }
                          service:      { type: string }
                          healthy:      { type: boolean }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/server/version/compatibility:
    get:
      tags: [Server]
      operationId: getServerVersionCompatibility
      summary: Compatibility matrix for the current version
      description: |
        This node's cluster protocol window: the protocol it speaks and the
        oldest it accepts. Pairing compares these numbers, so a peer outside
        the window is refused with both sides' values named.

        Decoupled from the release version on purpose: two nodes on
        different builds interoperate as long as their protocol windows
        overlap.
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [cluster, client, admin]
            default: cluster
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/models:
    get:
      tags: [Models]
      operationId: listModels
      summary: List known models (optionally filtered)
      description: |
        Models present on the cluster, from each node's scan cache. Filter by
        `node`, `provider`, `registry` or `model`; `refresh=true` forces a
        re-scan instead of answering from cache.

        An unknown `node` is a 404 naming the nodes that exist, rather than an
        empty list: "wrong node" and "no models" are different answers and
        used to look identical.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
        - $ref: '#/components/parameters/ModelParam'
        - $ref: '#/components/parameters/ProviderParam'
        - $ref: '#/components/parameters/RegistryParam'
        - in: query
          name: refresh
          description: Force a cache invalidation before listing.
          schema: { type: boolean }
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CatalogModel' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Unknown `node`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Models]
      operationId: deleteModels
      summary: Delete models matching a pattern
      description: |
        Deletes model files from disk by `pattern`, by explicit `models`, or
        by `paths`. This removes the weights; it does not stop a run using
        them.

        A body with none of the three is a 400. It used to be a 200 whose
        failure hid in `data.errors`, which reads exactly like a successful
        no-op delete.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteModelsRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: "No deletion criteria given: supply `pattern`, `models`, or `paths`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: The delete could not be carried out.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/models/show:
    get:
      tags: [Models]
      operationId: showModels
      summary: Show details for one model
      description: |
        Detail for one model: where it lives, which provider serves it, its
        size and format. `model` is required. `verbose=true` adds the
        provider's own metadata.

        A name that matches several models is a 400 listing the matches, not
        an arbitrary pick. Qualify it with `provider` or `node`.
      parameters:
        - in: query
          name: model
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/NodeParam'
        - $ref: '#/components/parameters/ProviderParam'
        - in: query
          name: verbose
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            X-API-Version: { $ref: '#/components/headers/XAPIVersion' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Model' }
        '400':
          description: Missing `model`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Model not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/models/stats:
    get:
      tags: [Models]
      operationId: listModelsStats
      summary: Aggregate statistics about the model registry
      description: |
        Aggregate model-store statistics: how many models, how much disk, per
        node. Without `node` the coordinator broadcasts and passes the peer
        responses through as they came.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '502':
          description: A peer could not be reached during the broadcast.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/models/scan:
    post:
      tags: [Models]
      operationId: scanModels
      summary: Trigger a filesystem rescan of the model registry
      description: |
        Re-scans a node's model directories and refreshes its catalog entry.

        Needed when models appeared behind zzRouter's back: an Ollama daemon
        started after the node did, or someone ran `ollama pull` straight
        against it. Without a scan those models stay invisible until
        something else invalidates the cache.

        `node` targets one node and the response reports that node's count.
        Synchronous: the answer is the result, not a job id.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: The local scan failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: The target node could not be reached.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/models/defaults:
    post:
      tags: [Models]
      operationId: createModelsDefault
      summary: "Not implemented: save per-model parameter overrides"
      description: |
        Mounted but unimplemented: every call answers `501`. Documented
        so the spec and the route catalog agree about what the surface
        contains, not because there is anything to call. It answers in
        the Problem envelope rather than the silent `200` it used to
        return while storing nothing.

        Per-model parameters are written with
        `PATCH /zzrouter/v1/providers/{name}/parameters`, whose model
        tier is the same setting this route was meant to hold.
      responses:
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '501':
          description: Not implemented. The route exists; the operation does not.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/runs:
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List active runs (provider instances)
      description: |
        Every provider instance the cluster has running. Without `node`
        this is a broadcast: the coordinator asks each peer and merges
        the answers, so a slow or unreachable node shows up as missing
        rows rather than as an error. Name a `node` to ask exactly one.

        An unknown `node` is a 404 that names the nodes that do exist,
        which is usually faster than a separate lookup.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
        - in: query
          name: status
          schema: { type: string }
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Unknown `node`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [Runs]
      operationId: createRun
      summary: Start asynchronous run launch
      description: |
        Before starting the provider process, a schema-declared fraction_total GPU
        budget is compared with fresh per-device free memory. An oversized budget
        returns 409 with errors[].got containing required_mib, free_mib, device,
        holders (driver PIDs and known zzRouter run ownership) and attribution gaps.
        Unknown measurements or ambiguous device selection return 503. Multi-GPU
        admission requires full UUIDs in CUDA_VISIBLE_DEVICES. This is an engine
        allocation budget, not a complete model-weight/KV estimate. Layer and
        unified-memory estimation is currently unsupported; those launches retain
        their existing behavior. A memory snapshot cannot reserve against other
        workloads changing memory after the check.

        Returns 202 immediately with a pkg/jobs handle ID. Subscribe to
        launch progress (launching → waiting-for-health → running/failed)
        via `GET /zzrouter/v1/jobs/{job_id}/stream?node={node}`.

        Cancel an in-flight launch with `DELETE /zzrouter/v1/jobs/{job_id}` ,
        this terminates the process. Once the run reaches Running the job
        is terminal; use `DELETE /zzrouter/v1/runs/{id}` to stop the
        instance thereafter.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LaunchRunRequest' }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Launch accepted; watch job_id for readiness.
          headers:
            X-Request-ID:  { $ref: '#/components/headers/XRequestID' }
            X-API-Version: { $ref: '#/components/headers/XAPIVersion' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [accepted, id, provider, status, port]
                        properties:
                          accepted: { type: boolean }
                          id:       { type: string, description: "Instance ID" }
                          job_id:   { type: string, description: "Subscribe at /jobs/<job_id>/stream" }
                          deploy_job_id:
                            type: string
                            description: |
                              Populated when `auto_deploy:true` chains a
                              download. Subscribe for pull progress, then
                              `job_id` for launch readiness.
                          provider: { type: string }
                          status:   { type: string }
                          port:     { type: integer }
                          health_url: { type: string }
                          node:     { type: string }
        '400':
          description: >
            The request names something this node cannot launch: a model
            whose weights are not in the local model store, a parameter
            the provider's schema rejects, or a port outside the
            configured range. Retrying the same body cannot succeed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No provider by that name is configured on this node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: >
            The launch conflicts with current state: this model is
            already loaded, an instance already holds the port, or the
            model's local weights are incomplete and must be
            re-downloaded before it can start. A configured variant name
            that also identifies real weights conflicts until the variant
            is renamed or its from definition is removed. A fraction_total GPU budget
            exceeding fresh free device memory is refused before process start;
            errors[].got includes required_mib, free_mib and known holder attribution.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >
            The Idempotency-Key on this request was recorded against a different body. Change the key or send the original body; `code` is `idempotency_key_conflict`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: >
            The node cannot take the launch right now: no port is free
            in the provider's configured range, the instance cap is
            reached, or the node is shutting down. Unlike 400, the same
            request may succeed later.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: >
            A duplicate of a request that is still in flight waited out its bound for the original to answer. Retry shortly; `code` is `idempotency_wait_timeout`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/runs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get run details
      description: |
        One instance by id. The coordinator finds the owning node, so
        `node` is an optimization rather than a requirement: pass it
        when you already know the owner and want to skip the lookup.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            X-API-Version: { $ref: '#/components/headers/XAPIVersion' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Run not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Runs]
      operationId: deleteRun
      summary: Stop and remove a run
      description: |
        Stops the process and drops the instance. This is the right
        call once a run is up; cancelling the *launch* of a run that is
        still starting is `DELETE /zzrouter/v1/jobs/{id}` against the
        job id that `POST /runs` returned. Once the run reaches
        running, that launch job is terminal and only this route stops
        the instance.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200': { description: OK }
        '204': { description: No content }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Run not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/runs/{id}/logs:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Runs]
      operationId: listRunLogs
      summary: Stream or fetch run logs
      description: |
        Reads the instance's log file, on whichever node owns it. With
        `follow=true` the response is an open stream that keeps
        emitting; without it, the last `lines` lines come back and the
        request completes.

        `grep` and `regex` filter server-side, so a match-only read of
        a large log does not ship the whole file. `context` adds
        surrounding lines to each match and `max_matches` bounds the
        result. Passing both `grep` and `regex` is a 400: they are two
        spellings of one filter.

        A run whose log file has not appeared yet is waited on briefly
        rather than 404'd immediately, since a just-launched instance
        creates its file a moment after the run exists.
      parameters:
        - in: query
          name: follow
          description: Keep the connection open and stream new lines as they are written.
          schema: { type: boolean }
        - in: query
          name: lines
          description: How many trailing lines to return when not following.
          schema: { type: integer, minimum: 1, maximum: 10000, default: 100 }
        - in: query
          name: grep
          description: Literal substring filter. Mutually exclusive with `regex`.
          schema: { type: string }
        - in: query
          name: regex
          description: Regular-expression filter. Mutually exclusive with `grep`.
          schema: { type: string }
        - in: query
          name: context
          description: Lines of context to include around each match.
          schema: { type: integer, minimum: 0 }
        - in: query
          name: max_matches
          description: Cap on how many matches are returned.
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200':
          description: |
            Log text. A `follow` request streams and does not complete
            on its own; read it incrementally rather than to the end.
          content:
            text/plain:
              schema: { type: string }
        '400':
          description: Both `grep` and `regex` given, an invalid regex, or a parameter out of range.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No such run, or the run has no log file.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/runs/{id}/health:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Runs]
      operationId: getRunHealth
      summary: Health status for a specific run
      description: |
        Whether the instance is answering, as opposed to whether it
        exists. A run can be present and listed while its process is
        still loading a model and refusing requests, which is the case
        this endpoint distinguishes.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RunHealth' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Run not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/runs/{id}/restart:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Runs]
      operationId: restartRun
      summary: Restart a run (async; stop old, launch new under one job_id)
      description: |
        Stops the existing instance and launches a replacement with the
        same provider/model/parameters. Returns 202 with the NEW
        instance's job_id so agents subscribe to the relaunch progress
        via `/jobs/{job_id}/stream`.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '202':
          description: Restart accepted; watch job_id for readiness.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accepted: { type: boolean }
                          old_id:   { type: string }
                          id:       { type: string }
                          job_id:   { type: string }
                          provider: { type: string }
                          model:    { type: string }
                          status:   { type: string }
                          port:     { type: integer }
                          node:     { type: string }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Run not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/runs/ensure:
    post:
      tags: [Runs]
      operationId: ensureRuns
      summary: Ensure a model is running (idempotent warm-up)
      description: |
        Single verb the agent uses to make a model hot. Idempotent and
        retry-safe: if the model is already running anywhere in the
        cluster, returns 200 with the running-instance details. If
        cold, launches via the existing auto_deploy chain (downloads
        the model first if not in the local cache) and returns 202
        with `job_id` (and `deploy_job_id` when a download is needed)
        for stream subscription.

        The manager-level singleflight on LaunchInstance dedupes
        concurrent ensures by construction , there is no race where
        two callers each spawn a process.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnsureRunRequest' }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Model already running.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EnsureRunResponse' }
        '202':
          description: Launch (and possibly deploy) accepted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EnsureRunResponse' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '409':
          description: A configured variant name also identifies real weights; disambiguate the name before warming or launching it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Model not in catalog.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >
            The Idempotency-Key on this request was recorded against a different body. Change the key or send the original body; `code` is `idempotency_key_conflict`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: >
            A duplicate of a request that is still in flight waited out its bound for the original to answer. Retry shortly; `code` is `idempotency_wait_timeout`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/runs/preview:
    post:
      tags: [Runs]
      operationId: previewRuns
      summary: Preview a run configuration without launching
      description: |
        Resolves the final command line, port allocation and provider
        capabilities that `POST /runs` would use, without spawning
        anything. The answer to "what exactly is this going to run"
        before committing a GPU to it.

        `provider` is required. Preview renders one provider's launch
        command, so an omitted provider is a client error rather than
        something to guess at; `GET /zzrouter/v1/runs/capabilities`
        lists what this cluster can run.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewRunRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: |
            `provider` missing, or a provider that is not configured or
            not enabled on this cluster.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '409':
          description: A configured variant name also identifies real weights; disambiguate the name.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/runs/load:
    post:
      tags: [Runs]
      operationId: createRunsLoad
      summary: Load a model (async for local launches; idempotent warm-up)
      description: |
        Ensures a model is running on the target node. Three paths:

        - **Endpoint providers** (cloud / external service) , returns 200
          immediately after forwarding to the provider's load API.
        - **Already running / already starting** , returns 409 with the
          live instance's `job_id` (empty if the launch predates jobs
          wiring). Retries are idempotent.
        - **Fresh launch** , returns 202 with `job_id`. Subscribe via
          `/jobs/{job_id}/stream` for readiness.

        Which of the three you get is decided on the resolved model
        name, so a caller that launched a model by one of its aliases
        reaches its own run rather than a second copy of it. `force`
        turns the second path into the third: the running instance is
        stopped and replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoadModelRequest' }
      responses:
        '200':
          description: Model ready (endpoint provider path).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '202':
          description: Launch accepted; subscribe to job_id.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '409':
          description: Model already running/starting (dedupe hit).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /zzrouter/v1/runs/capabilities:
    get:
      tags: [Runs]
      operationId: listRunsCapabilities
      summary: List supported providers and their coarse capabilities
      description: |
        Which providers this cluster can launch, and whether each is
        enabled. Read it before `POST /runs` or `POST /runs/preview`:
        both reject a provider that is missing or disabled, and this is
        the list they are checked against.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          providers:
                            type: array
                            items:
                              type: object
                              properties:
                                type:     { type: string }
                                mode:     { type: string }
                                enabled:  { type: boolean }
                                protocol: { type: string }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: Provider configuration is not loaded on this node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/runs/providers/{provider}:
    parameters:
      - in: path
        name: provider
        required: true
        schema: { type: string, example: vllm }
    get:
      tags: [Runs]
      operationId: getRunsProvider
      summary: Get detailed capabilities for a provider type
      description: |
        What one provider supports: launch modes, protocol, and the
        features a run can ask for. The detailed form of a single row
        from `GET /zzrouter/v1/runs/capabilities`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProviderCapabilities' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Unknown provider type
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/runs/providers/{provider}/parameters:
    parameters:
      - in: path
        name: provider
        required: true
        schema: { type: string, example: vllm }
    get:
      tags: [Runs]
      operationId: listRunsProviderParameters
      summary: List configurable launch parameters for a provider type
      description: |
        The launch parameters a run may set for this provider, as
        request-level (Tier 4) overrides on `POST /runs`. This is the
        per-run view; the persisted four-tier configuration is
        `GET /zzrouter/v1/providers/{name}/resolved`, and what a
        provider accepts at all is
        `GET /zzrouter/v1/providers/{name}/schema`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AppParameters' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Unknown provider type
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers:
    get:
      tags: [Providers]
      operationId: listProviders
      summary: List installed providers with runtime status
      description: |
        Every provider this node knows about, with its runtime status.
        Filterable by name, key or running state, and `refresh=true` forces
        a status re-probe instead of answering from cache.

        Reads are cache-only by design: a provider list must never block on
        an upstream, so a cold cache leaves the upstream version fields
        empty rather than waiting for them.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
        - in: query
          name: refresh
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Provider' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: The provider list could not be built.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/catalog:
    get:
      tags: [Providers]
      operationId: getProvidersCatalog
      summary: List provider catalog (installed + available)
      description: |
        Provider definitions from configuration, including ones that are not
        installed. This is the "what could I install" list; `GET
        /zzrouter/v1/providers` is the "what is here" list.

        Registries are search-only and excluded by default. `kind=registry`
        returns just those, `kind=all` returns everything, and `type` narrows
        to cloud or local providers.
      parameters:
        - in: query
          name: type
          description: Filter by provider class.
          schema:
            type: string
            enum: [cloud, local]
        - in: query
          name: mode
          description: |
            By default, registries are excluded. Pass `mode=registry` for only
            registries, or `mode=all` for everything. `kind` is the canonical
            alias , when both are supplied, `kind` wins.
          schema:
            type: string
            enum: [registry, all]
        - in: query
          name: kind
          description: Canonical alias for `mode`. Same values.
          schema:
            type: string
            enum: [registry, all]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProviderCatalogEntry' }
        '400':
          description: Invalid enum value for `type`, `mode`, or `kind`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/providers/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [Providers]
      operationId: getProvider
      summary: Get provider details and status
      description: |
        Full detail for one provider on one node. `node` selects which node
        answers; without it, this node answers for itself.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            X-API-Version: { $ref: '#/components/headers/XAPIVersion' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Provider' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No provider by that name.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    patch:
      tags: [Providers]
      operationId: updateProvider
      summary: Update provider config (enable/disable, runtime fields)
      description: |
        Changes provider configuration. Two fields are supported: `enabled`,
        and `pinned_version` (a version to hold, or `""` to release the pin
        and follow the latest release).
        When the shipped template declares a pin, startup reconciliation restores
        that release-owned seed. An explicit install-call version overrides it.
        Pins on providers without a shipped seed remain operator-owned.

        A body with neither is a 400 rather than a no-op 200. `{"pinned_version":
        null}` lands there too: null into an optional field is
        indistinguishable from absent, so a caller carrying over the
        merge-patch convention from
        `PATCH /zzrouter/v1/providers/{name}/parameters` would otherwise get
        silence dressed up as success. Clear a pin with `""`.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
              additionalProperties: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Provider' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Provider not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Providers]
      operationId: deleteProvider
      summary: Start asynchronous provider uninstall
      description: |
        Starts an uninstall on the target node and returns immediately
        with a job ID. Subscribe to progress via
        `GET /zzrouter/v1/jobs/{job_id}/stream?node={node}`.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '202':
          description: Uninstall accepted; watch `job_id` for progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedJob' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Provider not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Instances still running for this provider.

  /zzrouter/v1/providers/{name}/install:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    post:
      tags: [Providers]
      operationId: createProviderInstall
      summary: Start asynchronous provider install
      description: |
        Starts a provider install on the target node and returns
        immediately with a job ID. Subscribe to progress via
        `GET /zzrouter/v1/jobs/{job_id}/stream?node={node}`. Cancel
        mid-install via `DELETE /zzrouter/v1/jobs/{job_id}`.
        Preflight runs synchronously on the request path , a
        prerequisite failure returns 400 before any job is created.
        A second POST for a provider already being installed returns
        the SAME job_id (idempotent retry) for artifact installers. A busy typed
        runtime refuses a conflicting install until its current job terminates.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallRequest' }
      responses:
        '202':
          description: Install accepted; watch `job_id` for progress.
          headers:
            X-Request-ID:  { $ref: '#/components/headers/XRequestID' }
            X-API-Version: { $ref: '#/components/headers/XAPIVersion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedJob' }
        '400':
          description: |
            Preflight prerequisites not met; no job was created. `code` is
            `preflight_failed` and `errors[]` names each failing check,
            with a `hint` where a remedy is known.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: >
            No provider by that name. The catalog at GET /zzrouter/v1/providers/catalog lists the installable ones.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Provider already installed; set force=true to reinstall.

  /zzrouter/v1/providers/{name}/verify:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    post:
      tags: [Providers]
      operationId: createProviderVerify
      summary: Verify provider connectivity (probes the health endpoint)
      description: |
        Synchronously probes the provider's configured health endpoint
        and returns a coarse ok/failed result with a human-readable
        hint. A successful probe also registers the provider with the
        runtime router.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200':
          description: OK , returned on both verified and verification-failed paths; branch on `data.status`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/VerifyResult' }
        '400':
          description: Provider has no endpoint or runtime config.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Provider not found in provider config.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/{name}/resolved:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    get:
      tags: [Providers]
      operationId: getProviderResolvedParameters
      summary: Effective parameters with the tier each value came from
      description: |
        Runs the tier resolution and reports both the winning value and
        where it was set, which is what turns "why is this flag 3072"
        into a one-request answer. Precedence, lowest first: provider
        defaults, model defaults, per-model, per-node, then the node x
        model cell.

        Model defaults (`tier: model-default`) are what the release
        ships for a model family on this engine, such as the chat
        template a family needs; `pattern` names the family pattern that
        matched. They are rewritten on every start and cannot be written
        through this API. Every other tier overrides them: set the key
        under `models.<model>` with `PATCH .../parameters`, or set an
        asset-typed key to `"auto"` to drop the shipped file.

        `node` and `model` select the cell to resolve. Omitting both
        resolves the defaults tier alone, which is not what a launch on
        a specific node would use.

        A named node resolves over the coordinator's existing mTLS route.
        Present file features inject only unoccupied flag keys, with
        `tier: feature:vision` and the manifest sha256 when known. Explicit
        opt-outs remain in force. Legacy unmanifested files have no digest.

        This is the read side of the parameter surface. Writes go to
        `PATCH /zzrouter/v1/providers/{name}/parameters`.
      parameters:
        - in: query
          name: node
          description: Node whose overrides participate. Omit for the defaults tier.
          schema: { type: string }
        - in: query
          name: model
          description: Model whose overrides participate.
          schema: { type: string }
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: |
                Hash of the provider's `config.yaml` on disk and the
                digests of its assets. Advisory: the write path does not
                honour `If-Match` yet. Absent when the file cannot be
                read.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedParameters' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No such provider.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/{name}/schema:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    get:
      tags: [Providers]
      operationId: getProviderSchema
      summary: Parameters this provider accepts
      description: |
        The union of the Go spine and the provider's own `schema.yaml`,
        which is what parameter writes are validated against. Read it
        before a `PATCH`: an unknown flag or an out-of-range value is
        rejected, and this endpoint is where the accepted set lives.

        `endpoints` appears for providers whose parameters differ per
        endpoint; a flat provider omits it entirely.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderParameterSchema' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No such provider.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/{name}/assets:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    get:
      tags: [Providers]
      operationId: listProviderAssets
      summary: Files this provider's asset-typed parameters can name
      description: |
        An asset is a small file a launch parameter of type `asset` takes
        by name; the node that launches resolves the name to the file's
        path in its own copy. The coordinator owns the set and peer-sync
        carries it to workers. `shipped` assets come with zzRouter and
        are restored on every start; `referenced_by` lists the
        parameters naming each one.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetList' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No such provider.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/{name}/assets/{asset}:
    parameters:
      - { in: path, name: name, required: true, schema: { type: string } }
      - { in: path, name: asset, required: true, schema: { type: string } }
    get:
      tags: [Providers]
      operationId: getProviderAsset
      summary: One asset's bytes
      description: The file as stored, byte for byte.
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          description: Not a valid asset name.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No such provider or asset.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      tags: [Providers]
      operationId: putProviderAsset
      summary: Create or replace an asset
      description: |
        The raw request body becomes the asset. Names are a single file
        name of letters, digits, `.`, `_` or `-`, not starting or ending
        with `.`. One asset is at most 1 MiB and a provider's assets at
        most 4 MiB and 64 files. The change reaches workers through
        provider sync, and the write waits for it as a parameter write
        does, reporting how far it got in `X-Provider-Sync`.
      parameters:
        - $ref: '#/components/parameters/RestartParam'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetWrite' }
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetWrite' }
        '400':
          description: Not a valid asset name, or `restart` is not `affected` (`errors[]` code `invalid_value`; nothing is written).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '403':
          description: The name belongs to an asset that ships with zzRouter.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such provider.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: Over the per-asset, per-provider or file-count limit.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Providers]
      operationId: deleteProviderAsset
      summary: Delete an asset
      description: |
        Refused while any parameter names the asset: removing it would
        make those launches fail. The 409 lists each such parameter.
      responses:
        '204': { description: Deleted. }
        '400':
          description: Not a valid asset name.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '403':
          description: The asset ships with zzRouter.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such provider or asset.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Still named by a parameter; one `errors[]` entry (code `asset_in_use`) per parameter, `key` its merge-patch path.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/{name}/parameters:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [Providers]
      operationId: listProviderParameters
      summary: Get provider-level parameters (CLI flags + env)
      description: |
        Parameters for this provider as resolved for this node, in the older
        flat shape. `GET /zzrouter/v1/providers/{name}/resolved` is the
        current read: it carries the same values plus the tier each came
        from, and it takes `node` and `model` so you can ask for the cell a
        launch would actually use.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AppParameters' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Provider not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      tags: [Providers]
      operationId: updateProviderParameters
      summary: "Retired: Replace provider-level parameters"
      description: |
        Retired. The route is still mounted and answers `410 Gone` with a
        pointer to its replacement: parameters are written with
        `PATCH /zzrouter/v1/providers/{name}/parameters` using RFC 7396
        merge-patch, which reaches every tier in one request.
      deprecated: true
      responses:
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '410':
          description: Gone , write parameters with the merge-patch route
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

    patch:
      tags: [Providers]
      operationId: patchProviderParameters
      summary: Write provider parameters (RFC 7396 merge-patch)
      description: |
        The single mutator for provider parameters. One request addresses
        every tier of the resolution tree:

        ```
        defaults.parameters
          -> models[m].parameters
          -> nodes[n].parameters
          -> nodes[n].models[m].parameters
        ```

        Three meanings for a value, per RFC 7396:

        - key absent  , inherit from the tier below
        - `key: ""`   , literal empty (an env var set to the empty string)
        - `key: null` , delete the key at this tier

        `null` is never persisted: after a patch the key is either present
        with a value or absent. Every leaf is validated against the merged
        schema (the Go spine union the provider's own `schema.yaml`), and a
        rejection names the offending key with a closed-enum `code`.

        Only the coordinator accepts writes. A worker answers `421` with a
        `Location` header naming its coordinator; worker config is a cache
        that peer-sync overwrites.

        A worker resolves a launch from that cache, so the write waits for
        the tree to reach every known worker before it answers, and reports
        how far it got in `X-Provider-Sync`: `complete` means the next
        launch anywhere in the cluster reads this value; `partial` means a
        worker was down or refused the push; `pending` means the push outran
        the wait. Under the last two, a launch on the node that missed it
        resolves the previous value until the next reconcile repairs it.

        The response is the resolution of one cell, as
        `GET /providers/{name}/resolved` would report it. `node` and
        `model` choose it; omitted, they default to the one node and the
        one model the patch wrote (when it wrote exactly one), so a write to
        `models.<m>` answers with `<m>`'s resolution. Otherwise the node is
        the coordinator and the model is none, which shows the defaults.
      parameters:
        - $ref: '#/components/parameters/RestartParam'
        - in: query
          name: node
          description: Node whose resolution the response shows. Defaults as described above.
          schema: { type: string }
        - in: query
          name: model
          description: Model whose resolution the response shows. Defaults as described above.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ProviderParametersPatch'
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderParametersPatch'
      responses:
        '200':
          description: OK , the resolved cell after the patch (see `node`, `model`)
          headers:
            X-Provider-Sync:
              description: |
                How far the new tree got before this response: `complete`
                (every known worker took it, and a node with no workers is
                trivially complete), `partial` (the round finished with one
                left behind), `pending` (still in flight when the write
                answered).
              schema:
                type: string
                enum: [complete, partial, pending]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResolvedParameters'
                  - type: object
                    properties:
                      runs: { $ref: '#/components/schemas/RunsReport' }
        '400':
          description: One or more leaves failed validation, or `restart` is not `affected` (nothing is written)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Provider not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '421':
          description: Misdirected , write to the coordinator named in Location
          headers:
            Location:
              description: Coordinator base URL that owns provider config
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: The model catalog is unavailable; variant names could not be checked and nothing was written.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/status:
    get:
      tags: [Providers]
      operationId: listProvidersStatus
      summary: List provider health, cooldowns, and rate-limit state
      description: |
        Aggregate list across every provider. For one provider's full
        status use `/providers/{name}/status`; for its service-manager
        state alone use `/providers/{name}/service/status`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProviderStatus' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: The status view could not be built.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/nodes:
    get:
      tags: [Nodes]
      operationId: listNodes
      summary: List cluster nodes
      description: |
        The cluster as this coordinator sees it: every paired node with its
        health, role and last-seen time. Keyed by node name, which is what
        every `?node=` parameter takes.

        The configured endpoint rows are a different list, keyed by
        `host:port`, reachable through the cluster endpoint routes. A node
        can be configured and unreachable, or reachable and unhealthy, and
        this is the view that says which.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
        - in: query
          name: refresh
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Node' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/nodes/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [Nodes]
      operationId: getNode
      summary: Get node details
      description: |
        One node by name, with the same health and role detail the list
        carries.
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            X-API-Version: { $ref: '#/components/headers/XAPIVersion' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Node' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Node not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/nodes/compatible:
    get:
      tags: [Nodes]
      operationId: getNodesCompatible
      summary: List nodes compatible with a model
      description: |
        Nodes that could run a given model, filtered by what each one has:
        provider support, and hardware where the model declares a
        requirement.

        It answers from declared capability, not from current load: a node
        listed here may still be too busy to take the run.
      parameters:
        - in: query
          name: model
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/ProviderParam'
        - $ref: '#/components/parameters/RegistryParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Node' }
        '400':
          description: Missing `model`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/deployments:
    get:
      tags: [Deployments]
      operationId: listDeployments
      summary: List active and recent deployments
      description: |
        Tracked deployments with live progress merged in, so a listing is
        enough to see how far each one has got. `active=true` hides the
        finished ones; `node` narrows to deployments targeting one node.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListEnvelope' }
        '401':
          description: Missing or invalid API key.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [Deployments]
      operationId: createDeployment
      summary: Start a deployment (async , returns the tracked Deployment)
      description: |
        Kicks off a multi-node model placement and returns immediately
        with the tracked Deployment record. Clients poll
        `GET /zzrouter/v1/deployments/{id}` until `status` reaches
        a terminal state.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeploymentRequest' }
      responses:
        '202':
          description: Deployment accepted.
          headers:
            Location:
              description: URL to poll for deployment status.
              schema: { type: string, format: uri }
            X-Request-ID:  { $ref: '#/components/headers/XRequestID' }
            X-API-Version: { $ref: '#/components/headers/XAPIVersion' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Deployment' }
        '400':
          description: >
            The body failed validation. `errors` lists one entry per offending field with the rule it broke; `code` is `bad_request`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
    delete:
      tags: [Deployments]
      operationId: deleteDeployments
      summary: Stop all active deployments on a node
      description: |
        Cancels deployments in bulk. Without `node` it cancels every active
        deployment cluster-wide; with `node` it cancels only the slices
        aimed at that node, leaving the rest of each deployment running.

        The response reports how many were cancelled.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401':
          description: Missing or invalid API key.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/deployments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Deployments]
      operationId: getDeployment
      summary: Get a deployment
      description: |
        One deployment with live progress merged, including per-node state.
        This is the poll target after `POST /zzrouter/v1/deployments`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Deployments]
      operationId: deleteDeployment
      summary: Cancel a deployment across all participating nodes
      description: |
        Cancels a deployment and stops every per-node download it started.
        Files already written are left in place; this stops work, it does not
        undo it.
      responses:
        '200': { description: OK }
        '204': { description: No content }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/deployments/{id}/nodes/{node}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: node
        required: true
        schema: { type: string }
    delete:
      tags: [Deployments]
      operationId: deleteDeploymentNode
      summary: Cancel a deployment on a single participating node
      description: |
        Cancels one node's slice of a deployment and leaves the others
        running. Returns the updated deployment with progress merged, so the
        new aggregate state comes back in the same round-trip.
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/keys:
    get:
      tags: [Keys]
      operationId: listKeys
      summary: List virtual API keys
      description: |
        Every virtual key on this node, with its quota configuration and
        lifecycle fields. Secrets are never returned: a key's plaintext
        exists once, in the response to `POST /zzrouter/v1/keys`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Key' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
    post:
      tags: [Keys]
      operationId: createKey
      summary: Create a virtual API key
      description: |
        Creates a virtual key and returns its plaintext exactly once. Store
        it at that moment; only an Argon2id hash is kept, so a lost key is
        reissued rather than recovered.

        `id` is caller-chosen and immutable. Without `team_id` the key gets
        its own personal team, which is immutable and grants every model;
        pass an existing `team_id` to scope the key to that team's model
        access and budget.

        Quota fields treat `0` as unenforced, not as a zero budget. The
        accepted fields are listed by `GET /zzrouter/v1/keys/schema`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateKeyRequest' }
      responses:
        '201':
          description: |
            Created. The response body includes the raw key material
            exactly once; clients must persist it immediately.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CreateKeyResponse' }
        '400':
          description: >
            The body failed validation. `errors` lists one entry per offending field with the rule it broke; `code` is `bad_request`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/keys/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Keys]
      operationId: getKey
      summary: Get key details
      description: |
        One key's configuration and lifecycle fields, never its secret.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Key' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Key not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    patch:
      tags: [Keys]
      operationId: updateKey
      summary: Update a key
      description: |
        PATCH semantics , nil fields are left untouched. Team binding is
        immutable; pass `suspended: true/false` to toggle the suspension
        state. `spend_limit: 0` means unenforced, not "$0 hard cap".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateKeyRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Key' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Key not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Keys]
      operationId: deleteKey
      summary: Delete a key
      description: |
        Purges the key, any pending budget reservations, and the
        associated spend ledger entry.
      responses:
        '200': { description: OK }
        '204': { description: No content }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Key not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/keys/{id}/rotate:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Keys]
      operationId: rotateKey
      summary: Rotate the secret for a key
      description: |
        Issues a new secret and invalidates the old one. The response
        shape matches `POST /keys` , the raw key material is returned
        exactly once.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CreateKeyResponse' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Key not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/keys/{id}/usage:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Keys]
      operationId: getKeyUsage
      summary: Get usage/spend stats for a key
      description: |
        This key's consumption in the current window: requests, tokens and
        spend, against whatever limits it carries. Spend counts settled
        requests plus what in-flight ones are holding, since a reservation
        that has not settled is still committed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/KeyUsage' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Key not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/system:
    get:
      tags: [System]
      operationId: getSystem
      summary: Aggregated system info (cluster-wide)
      description: |
        Returns the system info for the targeted node. Omit `node` or
        pass `*` for cluster-wide aggregation, pass a node name for a
        single host.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SystemInfo' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/server/routes:
    get:
      tags: [Server]
      operationId: listServerRoutes
      summary: Every route this node has mounted
      description: |
        A literal dump of the running gin engine, not a hand-kept list:
        a route appears here because this process serves it. That makes
        it the honest answer to "what can I call on this node", which
        differs by role, since a worker mounts neither the compat
        surface nor the coordinator-only cluster operations.

        Each entry carries the classification an agent needs before
        calling: which surface it belongs to, which credential it
        wants, whether it streams, whether it answers 202 with a job
        id, and whether it is retired.

        `retired` marks a route that is still mounted but only ever
        answers `410 Gone`. It is derived from the mounted handler, so
        it cannot drift from the routing table. Treat those as
        documentation of a removal, not as callable.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [routes, count]
                properties:
                  count: { type: integer, description: Length of `routes`. }
                  routes:
                    type: array
                    items: { $ref: '#/components/schemas/RouteSpec' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/server/identity:
    get:
      tags: [Server]
      operationId: getServerIdentity
      summary: Local node identity (this node only)
      description: |
        Which config this process actually runs. Diagnoses a node whose
        CLI and server read different files.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          server:       { type: string }
                          cluster:      { type: boolean }
                          cluster_mode: { type: string }
                          config_path:  { type: string }
                          endpoint:     { type: string }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/server/logs:
    get:
      tags: [Server]
      operationId: listServerLogs
      summary: List instance log files on this node
      description: |
        This node's own process log, tail-first. Node-local: it is the
        zzrouter-node log, not the log of any provider a run started, which
        is `GET /zzrouter/v1/runs/{id}/logs`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListEnvelope' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: The log file could not be read.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/discover:
    get:
      tags: [Discovery]
      operationId: getDiscover
      summary: Discover all cluster resources
      description: |
        Runs a live mDNS scan plus a local hardware scan.

        mDNS has no completion signal, so this call runs until its
        deadline (10s) rather than returning as soon as it has found
        everything, unless background discovery is already running and
        can answer from cache. Budget for it: it is the slowest
        endpoint on the node. For just the hardware view, which does
        not scan the network, use /zzrouter/v1/discover/hardware.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: The scan failed on the target node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/discover/hardware/gpus:
    get:
      tags: [Discovery]
      operationId: listDiscoverHardwareGpus
      summary: GPU hardware scan (per node)
      description: |
        Raw per-host scan; `node` targets one node, `*` asks every node.
        For a flattened per-GPU inventory across the cluster with
        per-host errors, use `/cluster/hardware/gpus`.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: The scan failed on the target node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/cluster/endpoints/{address}:
    parameters:
      - in: path
        name: address
        required: true
        schema: { type: string, example: "192.0.2.10:9090" }
    delete:
      tags: [Cluster]
      operationId: deleteClusterEndpoint
      summary: Remove a cluster endpoint row from the coordinator config
      description: |
        Keyed by exact host:port. This removes the config row, not the
        runtime node; the runtime view is GET /nodes, keyed by name.
      responses:
        '200': { description: OK }
        '204': { description: No content }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Cluster endpoint not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/cluster/connect:
    post:
      tags: [Cluster]
      operationId: connectClusterEndpoint
      summary: Probe a candidate cluster endpoint before joining
      description: |
        Performs a handshake + version check against a single URL
        without persisting anything. Used by the UI to validate an
        address before joining via the pairing flow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectToClusterNodeRequest' }
      responses:
        '200':
          description: Connected.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ClusterConnection' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: Failed to connect or verify the candidate.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/cluster/validate:
    post:
      tags: [Cluster]
      operationId: validateClusterEndpoints
      summary: Validate every currently-configured cluster endpoint
      description: |
        Walks `node.yaml` endpoints, probes each one, and returns a
        per-endpoint report. On mixed results the response also
        carries an `X-Status-Code: 206` header as a soft warning.
      responses:
        '200':
          description: Validation complete (see `data.unhealthy_hosts` for partial failures).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ClusterValidationReport' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/cluster/pair:
    post:
      tags: [Cluster]
      operationId: pairWithCoordinator
      summary: Open, reuse, regenerate or cancel this node's pairing window
      description: |
        Worker-side half of pairing. The node opens a short-lived
        window and prints a code; an operator carries that code to the
        coordinator and posts it to
        `/zzrouter/v1/cluster/pairing/accept`, which signs the node's
        CSR and wakes its parked long-poll.

        One endpoint covers the whole window lifecycle, and the body
        selects which:

        | Body | Effect |
        |---|---|
        | `{coordinator_url, coordinator_ca_fingerprint}` | Opens a window, or reuses an active one |
        | `{}` | Poll. Reports the active window, or `no_active_window` plus the node's current `mode` |
        | `{"regenerate": true}` | Replaces the current code with a fresh one |
        | `{"cancel": true}` | Closes the window |

        The pairing inputs live on the request, never in `node.yaml`:
        they are needed once, at pairing time. They are required on the
        call that opens a window and ignored on the others.

        Polling is the intended completion check. A successful pair
        closes the window and flips `mode` to `worker`, so a poller
        sees `status: no_active_window` with `mode: worker` and knows
        it succeeded, rather than re-opening a window on a node that
        just finished pairing. A window that expired instead reports
        `mode: unclaimed`, and `error` carries the background loop's
        last terminal failure exactly once.

        Auth: admin key, except from loopback. A CLI on the same
        machine is exempt so an operator does not have to reproduce the
        daemon's environment to pair the box in front of them.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClusterPairRequest' }
      responses:
        '200':
          description: |
            Window state. Note that `no_active_window` is a 200: it
            reports a fact about this node, not a failed request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterPairResponse' }
        '400':
          description: |
            Node is not unclaimed (the detail names the current mode,
            so a paired worker can be told from a coordinator), or
            `coordinator_url` is missing, or the CA fingerprint is not
            hex.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: Cluster listener not initialized on this node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/cluster/reset:
    post:
      tags: [Cluster]
      operationId: resetClusterPairing
      summary: Revert this worker to unclaimed
      description: |
        Wipes the stored coordinator URL and CA so the node can pair
        with a different coordinator, or with the same one after its CA
        was regenerated. The node's own identity keypair survives, so
        re-pairing the same box is not a new identity.

        Synchronous: a 200 means the mode has already flipped, so the
        caller can pair immediately without polling for the transition.
        This is the local counterpart to the coordinator's
        `POST /zzrouter/v1/cluster/decommission-worker`, which reaches
        the worker over mTLS instead.

        Auth: admin key, except from loopback.
      responses:
        '200':
          description: Reset complete; the node is unclaimed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: reset }
        '400':
          description: Node is not in worker mode, so there is nothing to reset.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: Cluster listener not initialized on this node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/cluster/pairing/pending:
    get:
      tags: [Cluster]
      operationId: listPendingPairings
      summary: List pairing requests waiting for acceptance
      description: |
        Coordinator-only. Shows what is queued for an operator who has
        lost track of an in-flight pairing.

        The code is deliberately not returned. It is read off the
        worker, which is what makes it evidence that the operator has
        access to the machine being admitted; serving it from the
        coordinator would turn a listing into an admission ticket.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending:
                    type: array
                    items: { $ref: '#/components/schemas/PendingPairing' }
        '400':
          description: This node is not a coordinator (the detail names its mode).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: Cluster listener not initialized on this node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/cluster/pairing/accept:
    post:
      tags: [Cluster]
      operationId: acceptPairing
      summary: Accept a worker's pairing code
      description: |
        Coordinator-only. Takes the code an operator read off the
        worker, signs the CSR that worker stashed with its request,
        burns the code, and wakes the worker's parked long-poll. The
        worker is then admitted to cluster membership so dispatch and
        broadcast start routing to it.

        No certificate material comes back here. It goes to the worker
        over its own long-poll: the admin who accepts a pairing never
        handles the key.

        Codes are single-use and time-limited, which is why an already
        consumed code is a `409` and an expired one a `410`. Both mean
        "ask the worker for a fresh code", not "retry this one".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The pairing code printed by the worker.
      responses:
        '200':
          description: Paired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingAcceptance' }
        '400':
          description: |
            Malformed code, CSR or signing failure, or this node is not
            a coordinator.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No pending request carries that code.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Code already consumed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: Code expired. Have the worker generate a new one.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Cluster listener not initialized, or the pairing store has stopped.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/cluster/decommission-worker:
    post:
      tags: [Cluster]
      operationId: decommissionWorker
      summary: Send a paired worker back to unclaimed
      description: |
        Coordinator-only, and the reverse of accepting a pairing. The
        coordinator reaches the worker over mTLS, the worker reverts to
        unclaimed and acknowledges, and this coordinator then drops it
        from the endpoint registry and from `node.yaml` so dispatch
        stops routing there.

        The worker keeps its identity keypair, so the same node can be
        re-paired later. To bar it instead, revoke its fingerprint.

        The two drops are reported separately in the response because
        they are best-effort: the worker has already acknowledged the
        leave, so a registry or config failure is drift to reconcile
        rather than grounds for failing an operator action that
        already took effect on the other side.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecommissionWorkerRequest' }
      responses:
        '200':
          description: |
            Worker acknowledged the leave. Check `endpoint_drop` and
            `config_drop` before assuming the coordinator's own state
            is clean.
          content:
            application/json:
              schema:
                type: object
                required: [status, worker_addr, endpoint_drop, config_drop]
                properties:
                  status:        { type: string, example: decommissioned }
                  worker_addr:   { type: string }
                  endpoint_drop: { type: boolean, description: Whether the endpoint registry row was removed. }
                  config_drop:   { type: boolean, description: Whether the `node.yaml` row was removed. }
        '400':
          description: This node is not a coordinator, or the request is invalid.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '502':
          description: |
            The worker could not be reached, refused the leave, or the
            mTLS handshake failed. Nothing was dropped locally.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Cluster listener not initialized on this node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/cluster/revoke-worker:
    post:
      tags: [Cluster]
      operationId: revokeWorker
      summary: Deny a worker's certificate identity
      description: |
        Coordinator-only. Appends the worker's SPKI fingerprint to the
        persistent deny list. Every later mTLS handshake presenting
        that public key is refused, inbound and outbound, and the
        worker's own renewal loop reads the structured 403 and reverts
        itself to unclaimed.

        Keyed on the SPKI fingerprint, not the certificate serial:
        serials roll on every renewal, so a serial would revoke one
        certificate while the identity behind it kept renewing.
        `serial` is accepted as forensic metadata only.

        Idempotent. Re-revoking updates the reason and timestamp
        instead of failing.

        Use this when an identity should be barred. To retire a node
        you still trust, decommission it instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeWorkerRequest' }
      responses:
        '200':
          description: Revoked. `fingerprint` echoes the canonical stored form.
          content:
            application/json:
              schema:
                type: object
                required: [status, fingerprint]
                properties:
                  status:      { type: string, example: revoked }
                  fingerprint: { type: string, description: Canonical lowercase hex. }
        '400':
          description: |
            Fingerprint is not 64 hex characters (an optional `sha256:`
            prefix is accepted), or this node is not a coordinator. The
            display form with an ellipsis is rejected rather than
            stored as a value that could never match a real key.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: Cluster listener not initialized on this node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/cluster/hardware/gpus:
    get:
      tags: [Cluster]
      operationId: listClusterGpus
      summary: Flat GPU inventory across the cluster
      description: |
        One row per GPU, each tagged with the node it lives on: the
        shape to walk when the question is "where is there a free
        80 GB card". The coordinator's own inventory plus each peer's,
        collected over mTLS.

        Degrades per host. A peer that fails to answer becomes an entry
        in `errors` while every other row is still returned, and
        `summary` reports how many hosts answered. When any host fails,
        the envelope's `message` says "partially retrieved", so a
        caller that needs completeness can branch on either signal.

        `gpus` and `errors` are always present, empty rather than null,
        so a client needs no nil check.

        For raw per-host scan output, use
        `GET /zzrouter/v1/discover/hardware/gpus`.
      responses:
        '200':
          description: OK, possibly partial. Check `data.summary.failed_hosts`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ClusterGPUInventory' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: The fan-out itself failed, so no inventory could be built.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ==========================================================================
  # Jobs , the async contract every 202 points at.
  # ==========================================================================

  /zzrouter/v1/jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List jobs
      description: |
        Every asynchronous operation (install, upgrade, uninstall, model
        download, run launch) reports through a job. A 202 response carries
        the `job_id` plus the URLs to watch it.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
        - in: query
          name: kind
          schema: { type: string }
          description: Filter by producer, e.g. `install` or `inference_log`.
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/JobEvent' }
                      metadata:
                        type: object
                        properties:
                          node:
                            type: string
                            description: |
                              The node whose registry answered. Same shape
                              whether the jobs are local or came from
                              `?node=<peer>`.
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/jobs/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get a job's latest state
      description: |
        Poll this when a streaming connection is impractical. The job is
        finished when `phase` is `done` or `failed`; nothing else is
        terminal, and `done` means the work completed, not that the request
        was accepted.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobEvent' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No such job.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Jobs]
      operationId: deleteJob
      summary: Cancel a job
      description: |
        Requests cancellation. Note that cancelling a job does not
        necessarily abort work already handed to an external downloader ,
        check the job's terminal phase rather than assuming.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '202':
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean }
                  job_id:   { type: string }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No such job.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/jobs/{id}/stream:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Jobs]
      operationId: getJobStream
      summary: SSE stream of a job's progress
      description: |
        Server-Sent Events. Each event `data:` line is a JSON-encoded
        `JobEvent`. The stream closes once the job reaches a terminal
        phase. Send the same `X-API-Key` header as any other management
        call, and disable response buffering.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200':
          description: SSE stream of JobEvent frames.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No such job.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/{name}/versions:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    get:
      tags: [Providers]
      operationId: listProviderVersions
      summary: What upstream publishes, and how each node compares
      description: |
        Answers "is there anything to upgrade here?" , `update_available`
        plus `upgrade_url` say so directly, without the caller having to
        reduce the per-node status list.

        Served from a cache with a configurable TTL. Pass `refresh=true`
        to force a lookup.

        After an upgrade on THIS node, `installed` is current the moment
        the job reports `done`. After an upgrade on a remote node it can
        lag by up to one cluster health interval (30s) while the
        coordinator re-probes that node , the job's terminal phase is
        authoritative, and `refresh=true` collapses the wait.
      parameters:
        - in: query
          name: refresh
          schema: { type: boolean }
          description: Bypass the cache and re-resolve upstream.
      responses:
        '200':
          description: OK. An unreachable upstream is still a 200 , the installed versions remain reportable and `reason` carries the failure.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProviderVersionsReport' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No such provider.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/usage/models:
    get:
      tags: [Usage]
      operationId: listUsageModels
      summary: Per-model usage since node start
      description: |
        Attribution-free totals: no virtual key and no team required.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelUsageReport' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/usage/models/{model}:
    parameters: [{ in: path, name: model, required: true, schema: { type: string } }]
    get:
      tags: [Usage]
      operationId: getUsageModel
      summary: Usage for one model since node start
      description: |
        Without `provider`, a model name served by several providers is
        summed , which is what a caller asking about "the model" rather
        than "this deployment" wants.
      parameters:
        - in: query
          name: provider
          schema: { type: string }
          description: Scope to one deployment.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelUsageReport' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No usage recorded for this model since node start.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/inference-logs/{id}/payload:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [InferenceLogs]
      operationId: getInferenceLogPayload
      summary: Retained request and response bodies for one entry
      description: |
        Bodies are retained for a SHORTER window than the metadata ring, so
        an entry that still exists can 404 here once its bodies have aged
        out. Check `payload_available` on the entry first.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Entry not found, or its bodies are no longer retained.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/inference-logs:
    get:
      tags: [InferenceLogs]
      operationId: listInferenceLogs
      summary: Query inference log entries
      description: |
        Recent inference requests from the in-memory ring, newest first,
        with model, node, latency, tokens, cost and outcome. Bounded by
        capacity rather than by time, so a busy node holds a shorter window.

        Prompts and completions are not here; `GET
        /zzrouter/v1/inference-logs/{id}/payload` serves those separately
        for the entries that captured them.
      parameters:
        - in: query
          name: model
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [success, error]
        - in: query
          name: since
          schema:
            type: string
            description: Duration (e.g. `5m`) or RFC3339 timestamp.
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/InferenceLogEntry' }
        '400':
          description: Invalid enum value for `status`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  # ==========================================================================
  # The rest of the management surface. Not a tier boundary: the operations
  # below range from fully schema'd to summary-plus-errors, and the drift
  # tests hold all of them to the same rule about existing.
  # ==========================================================================

  /zzrouter/v1/runs/{id}/probes:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Runs]
      operationId: getRunProbes
      summary: Probe status for a run
      description: |
        Lifecycle state of one instance: its status, when it started,
        and where its log file lives. Use it when a run is not
        answering and you want to know whether it is still starting or
        has already failed, then read the named log file through
        `GET /zzrouter/v1/runs/{id}/logs`.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [instance_id, status]
                        properties:
                          instance_id: { type: string }
                          status:      { type: string }
                          started_at:  { type: string, format: date-time }
                          log_file:    { type: string, description: Path on the owning node. }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No such run.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: This node has no provider manager.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/runs/metrics:
    get:
      tags: [Runs]
      operationId: listRunsMetrics
      summary: Runtime metrics for runs
      description: |
        Counters for the run manager on this node: what it has
        launched, what is alive, what failed. Node-local, so a
        coordinator answers for itself and not for the cluster.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: The run manager is not initialized on this node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/runs/config:
    get:
      tags: [Runs]
      operationId: getRunsConfig
      summary: Get run configuration
      description: |
        The run manager's own settings on this node: port range, launch
        timeouts and similar. Distinct from provider parameters, which
        are per provider and live under
        `GET /zzrouter/v1/providers/{name}/resolved`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: The run manager is not initialized on this node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    patch:
      tags: [Runs]
      operationId: updateRunsConfig
      summary: "Not implemented: update run configuration"
      description: |
        Mounted but unimplemented: every call answers `501`. It is
        described here so the route catalog and this spec agree about
        what the surface contains, not because there is anything to
        call. Change run-manager settings in `node.yaml` and restart.
      responses:
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '501':
          description: Not implemented. The route exists; the operation does not.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/runs/ports:
    get:
      tags: [Runs]
      operationId: listRunsPorts
      summary: List allocated ports
      description: |
        Which ports this node's run manager has handed out, and to
        which instance. Useful when a launch fails on a port conflict,
        or when a process is listening and you need to know which run
        owns it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: The run manager is not initialized on this node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/runs/batch:
    post:
      tags: [Runs]
      operationId: createRunsBatch
      summary: Launch several runs in one request
      description: |
        Launches each entry in turn on this node and reports both
        outcomes: `launched` carries the instances that started,
        `failed` carries the ones that did not and why. A partial
        result is the normal case, not an error, so read both lists
        rather than branching on the status alone.

        Unlike `POST /zzrouter/v1/runs` this returns no job id, so
        there is nothing to subscribe to; the work is already done when
        the response arrives. Launch runs one at a time through
        `POST /runs` when you want per-run readiness events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instances]
              properties:
                instances:
                  type: array
                  items: { $ref: '#/components/schemas/LaunchRunRequest' }
      responses:
        '202':
          description: |
            Processed. Check `data.failed` before assuming everything
            started.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          launched:
                            type: array
                            items:
                              type: object
                              properties:
                                id:       { type: string }
                                provider: { type: string }
                                port:     { type: integer }
                          failed:
                            type: array
                            items:
                              type: object
                              properties:
                                provider: { type: string }
                                error:    { type: string }
        '400':
          description: Malformed body or an unknown field.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '503':
          description: The run manager is not initialized on this node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/runs/validate/config:
    post:
      tags: [Runs]
      operationId: createRunsValidateConfig
      summary: Validate that a provider can be launched here
      description: |
        Checks a provider and launch mode against this node before a
        run is attempted: that the provider is configured, that its
        binary or interpreter is present, and that the mode is one this
        node supports. Cheaper than a failed launch, and the failure
        message names what is missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, launch_mode]
              properties:
                provider: { type: string }
                launch_mode:
                  type: string
                  enum: [native]
                  description: Only `native` is accepted today.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: Missing field, unknown launch mode, or a provider this node cannot launch.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/runs/validate/files:
    post:
      tags: [Runs]
      operationId: createRunsValidateFile
      summary: Validate file mount paths
      description: |
        Checks each path a run would mount and reports what is wrong
        with the ones that will not work: missing, unreadable, or not
        the kind of entry the mount expects. Every path is reported, so
        one call answers for a whole mount list.

        See `GET /zzrouter/v1/runs/examples/file-mounts` for shapes
        that are known to work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Validation ran. The result says which paths are usable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: Malformed body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/runs/examples/file-mounts:
    get:
      tags: [Runs]
      operationId: listRunsExamplesFileMounts
      summary: Example file mount configurations
      description: |
        Worked examples of the file-mount block a run accepts, narrowed
        by provider or by use case. Reference material for composing a
        `POST /runs` body, not a description of this node's state.
      parameters:
        - in: query
          name: provider
          description: Narrow to examples for one provider.
          schema: { type: string }
        - in: query
          name: use_case
          description: Narrow to a scenario, e.g. a local model directory or a config file.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  # --------------------------------------------------------------------------
  # Teams , per-team ownership of virtual keys, member merge patches, quotas.
  # See internal/server/teams_controller.go.
  # --------------------------------------------------------------------------

  /zzrouter/v1/teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: List teams
      description: |
        Every team, with quotas and model access. Membership is not listed
        here: a key belongs to exactly one team, so the membership view is
        `GET /zzrouter/v1/teams/{id}/keys`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
    post:
      tags: [Teams]
      operationId: createTeam
      summary: Create a shared team
      description: |
        Admin-only. Always creates a `kind: shared` team , personal
        teams are auto-created by `POST /keys` and cannot be minted
        directly. The team id must not begin with the personal-team
        prefix.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Team' }
        '400':
          description: >
            The body failed validation. `errors` lists one entry per offending field with the rule it broke; `code` is `bad_request`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '409':
          description: Team id already exists
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/teams/schema:
    get:
      tags: [Teams]
      operationId: getTeamsSchema
      summary: Fields accepted when creating or updating a team
      description: |
        Same two-map shape as `GET /zzrouter/v1/keys/schema`, and the
        same quota convention: `0` is unenforced.

        Membership is not here, because it is not a team field. A key
        belongs to exactly one team, so it is moved with
        `PATCH /zzrouter/v1/keys/{id}` and a `team_id`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AccessFieldSchema' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/teams/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Teams]
      operationId: getTeam
      summary: Get a team
      description: |
        One team's quotas and model access. The model list is intersected
        with each member key's own access, so a team grant widens nothing a
        key was not already allowed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    patch:
      tags: [Teams]
      operationId: updateTeam
      summary: Update team metadata (merge semantics)
      description: |
        Admin-or-owner. Field-level PATCH semantics , omitted fields are
        left untouched. `kind` is immutable.

        Membership is not a team field. A key belongs to exactly one
        team, so it is moved with
        `PATCH /zzrouter/v1/keys/{id}` and a `team_id`; this route
        answers `400` if a `members` object is sent. `GET /teams/{id}/keys`
        lists the current members.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTeamRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '403': { $ref: '#/components/responses/MgmtForbidden' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Teams]
      operationId: deleteTeam
      summary: Delete a team (admin-only)
      description: |
        Fails with 409 if the team still has members , remove them
        individually via PATCH merge-patch first.
      responses:
        '200': { description: OK }
        '204': { description: No content }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Team still has members
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/teams/{id}/keys:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Teams]
      operationId: listTeamKeys
      summary: List virtual keys belonging to a team
      description: |
        The keys that belong to this team. This is the membership view;
        membership is changed with `PATCH /zzrouter/v1/keys/{id}` and a
        `team_id`, not through the team.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TeamKeys' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/teams/{id}/usage:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Teams]
      operationId: getTeamUsage
      summary: Get usage and spend stats aggregated for a team
      description: |
        The team's consumption in the current window, aggregated across its
        keys, against the team's own limits. A request can be inside a key's
        budget and outside its team's.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TeamUsage' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/teams/{id}/usage/reset:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    post:
      tags: [Teams]
      operationId: resetTeamUsage
      summary: Reset the rolling usage window for a team (admin-only)
      description: |
        Zeroes the team's usage counters and starts a new window. Admin-only.
        Per-key counters are separate; resetting the team does not reset them.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TeamUsage' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # --------------------------------------------------------------------------
  # Keys , supplementary ops not in the base /keys CRUD block.
  # --------------------------------------------------------------------------

  /zzrouter/v1/keys/{id}/usage/reset:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    post:
      tags: [Keys]
      operationId: resetKeyUsage
      summary: Reset the rolling usage window for a key
      description: |
        Zeroes this key's usage counters and starts a new window. Admin-only,
        and it edits history: the counters are what budget enforcement reads,
        so a reset makes a key that was refused spend again.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/KeyUsage' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Key not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/keys/schema:
    get:
      tags: [Keys]
      operationId: getKeysSchema
      summary: Fields accepted when creating or updating a virtual key
      description: |
        Two field maps, `create` and `update`, because they differ:
        `id` is required at creation and immutable afterwards, so it is
        absent from `update`.

        Read the quota fields carefully. `0` means unenforced, not "no
        budget", and `min: 0` is how the schema says so. `reset_period`
        is ignored unless `spend_limit` is above zero.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AccessFieldSchema' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/keys/reload:
    post:
      tags: [Keys]
      operationId: reloadKeys
      summary: Reload keys.yaml from disk
      description: |
        Re-reads the on-disk keys store, invalidates the auth cache, and
        applies any external changes. Intended for out-of-band edits.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '500':
          description: The store could not be re-read; the in-memory keys are unchanged.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # --------------------------------------------------------------------------
  # Providers , install multi-step, service lifecycle, parameter surfaces.
  # --------------------------------------------------------------------------

  /zzrouter/v1/providers/instances:
    post:
      tags: [Providers]
      operationId: createProvidersInstance
      summary: Add a provider instance (e.g. connect a remote Ollama daemon)
      description: |
        Creates an `external/<name>.yaml` entry so a remote provider (currently
        Ollama) becomes a first-class routing target. Coordinator-only: workers
        register this route as a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: Missing field, invalid name, unparseable endpoint URL, or an unsupported `type`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }

  /zzrouter/v1/providers/{name}/environment:
    get:
      operationId: getProviderEnvironment
      tags: [Providers]
      summary: Observe a managed provider runtime on one node
      description: >
        Admin-only, bounded read-only probes. No packages, host settings or model weights are changed.
        Driver inventory is cached hardware evidence; cuda_version there is the driver's maximum.
        cuda_runtime distinguishes torch's build from the runtime library actually loaded.
        toolkit reports the nvcc selected by CUDA_HOME, CUDA_PATH or PATH. Missing observations are unknown.
        Kernel capability comes from the release schema; package presence is not proof of the kernel path used.
        Host findings explain human remediation and supported API workarounds. Requires a node supporting
        runtime_environment_v1. No coordinator fallback for an unsupported worker.
      security: [{ AdminKey: [] }]
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
        - { in: query, name: node, schema: { type: string }, description: 'Node name; empty targets coordinator.' }
        - { in: query, name: runtime, schema: { type: string }, description: 'Optional runtime declared by the provider schema, such as mlx-vlm.' }
      responses:
        '200':
          description: Observed environment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProviderEnvironment' }
        '400': { description: Runtime undeclared or diagnostics unsupported, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '403': { description: Admin required }
        '404': { description: Provider or managed runtime unavailable }
        '500': { description: Observation failed or node response contract unsupported }

  /zzrouter/v1/providers/{name}/status:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    get:
      tags: [Providers]
      operationId: getProviderStatus
      summary: Aggregate status (install + service + running instances) for a provider
      description: |
        One provider's combined view. The all-providers list is
        `/providers/status`; the raw service-manager state is
        `/providers/{name}/service/status`.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProviderStatus' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Provider not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/{name}/upgrade:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    post:
      tags: [Providers]
      operationId: createProviderUpgrade
      summary: Start asynchronous provider upgrade
      description: |
        Returns 202 with a job ID. Subscribe via
        `GET /zzrouter/v1/jobs/{job_id}/stream?node={node}`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallRequest' }
      responses:
        '202':
          description: Upgrade accepted; watch `job_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedJob' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: Provider not installed.
        '409':
          description: Instances still running for this provider.

  /zzrouter/v1/providers/{name}/service/status:
    parameters:
      - { in: path, name: name, required: true, schema: { type: string } }
      - { in: query, name: node, schema: { type: string }, description: Target node; defaults to the coordinator. }
    get:
      tags: [Providers]
      operationId: getProviderServiceStatus
      summary: Observe daemon supervision and endpoint readiness
      description: |
        Reports zzRouter, systemd, launchd, nssm or external ownership, desired and actual process state, endpoint health, and bounded last-exit diagnostics. Observing an external daemon never starts it.
        Worker execution uses the existing cluster mTLS route. Admin key required.
      responses:
        '200':
          description: Current supervision and readiness state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderServiceStatus' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '403': { description: External provider lifecycle cannot be changed. }
        '404': { description: Provider is not configured. }
        '408': { description: Lifecycle operation was cancelled or timed out. }
        '409': { description: Provider is disabled; enable it before starting. }
        '502': { description: Target node is unreachable. }
        '503': { description: Lifecycle or explicitly configured host service manager is unavailable. }

  /zzrouter/v1/providers/{name}/service/start:
    parameters:
      - { in: path, name: name, required: true, schema: { type: string } }
      - { in: query, name: node, schema: { type: string }, description: Target node; defaults to the coordinator. }
    post:
      tags: [Providers]
      operationId: createProviderServiceStart
      summary: Start an enabled managed daemon
      description: |
        Starts the managed daemon on its owning node. Requires an enabled provider and managed installation evidence. Waits up to 30 seconds for endpoint readiness; inspect running and healthy separately.
        Worker execution uses the existing cluster mTLS route. Admin key required.
      responses:
        '200':
          description: Current supervision and readiness state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderServiceStatus' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '403': { description: External provider lifecycle cannot be changed. }
        '404': { description: Provider is not configured. }
        '408': { description: Lifecycle operation was cancelled or timed out. }
        '409': { description: Provider is disabled; enable it before starting. }
        '502': { description: Target node is unreachable. }
        '503': { description: Lifecycle or explicitly configured host service manager is unavailable. }

  /zzrouter/v1/providers/{name}/service/stop:
    parameters:
      - { in: path, name: name, required: true, schema: { type: string } }
      - { in: query, name: node, schema: { type: string }, description: Target node; defaults to the coordinator. }
    post:
      tags: [Providers]
      operationId: createProviderServiceStop
      summary: Stop a managed daemon and suppress automatic restart
      description: |
        Stops the managed daemon. A manual stop suppresses zzRouter restarts for this node lifetime; start or restart resumes supervision. Host service ownership is preserved.
        Worker execution uses the existing cluster mTLS route. Admin key required.
      responses:
        '200':
          description: Current supervision and readiness state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderServiceStatus' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '403': { description: External provider lifecycle cannot be changed. }
        '404': { description: Provider is not configured. }
        '408': { description: Lifecycle operation was cancelled or timed out. }
        '409': { description: Provider is disabled; enable it before starting. }
        '502': { description: Target node is unreachable. }
        '503': { description: Lifecycle or explicitly configured host service manager is unavailable. }

  /zzrouter/v1/providers/{name}/service/restart:
    parameters:
      - { in: path, name: name, required: true, schema: { type: string } }
      - { in: query, name: node, schema: { type: string }, description: Target node; defaults to the coordinator. }
    post:
      tags: [Providers]
      operationId: createProviderServiceRestart
      summary: Restart a managed daemon
      description: |
        Restarts the managed daemon through its selected supervisor. Existing detached processes are only terminated when their executable and fixed daemon arguments match the managed installation.
        Worker execution uses the existing cluster mTLS route. Admin key required.
      responses:
        '200':
          description: Current supervision and readiness state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderServiceStatus' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '403': { description: External provider lifecycle cannot be changed. }
        '404': { description: Provider is not configured. }
        '408': { description: Lifecycle operation was cancelled or timed out. }
        '409': { description: Provider is disabled; enable it before starting. }
        '502': { description: Target node is unreachable. }
        '503': { description: Lifecycle or explicitly configured host service manager is unavailable. }

  /zzrouter/v1/providers/{name}/service/apply:
    parameters:
      - { in: path, name: name, required: true, schema: { type: string } }
      - { in: query, name: node, schema: { type: string }, description: Target node; defaults to the coordinator. }
    post:
      tags: [Providers]
      operationId: createProviderServiceApply
      summary: Apply configured environment through the managed lifecycle owner
      description: |
        Applies the resolved node environment through the same managed ownership gate, restarting when needed. Connected external daemons cannot be changed.
        Worker execution uses the existing cluster mTLS route. Admin key required.
      responses:
        '200':
          description: Environment apply result (applied, restarted, healthy, env_vars_applied).
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '403': { description: External provider lifecycle cannot be changed. }
        '404': { description: Provider is not configured. }
        '408': { description: Lifecycle operation was cancelled or timed out. }
        '409': { description: Provider is disabled; enable it before starting. }
        '502': { description: Target node is unreachable. }
        '503': { description: Lifecycle or explicitly configured host service manager is unavailable. }

  /zzrouter/v1/providers/{name}/install/status:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    get:
      tags: [Providers]
      operationId: getProviderInstallStatus
      summary: Multi-step install progress
      description: |
        Progress of an install running on the target node, shaped for
        polling. A `data` of null means nothing is installing, which is an
        answer rather than an error.

        The coordinator relays to whichever node `?node=` names, so an
        install started on a worker is readable from here.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InstallProgress' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No provider by that name, or the target node is unknown.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/{name}/install/plan:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    post:
      tags: [Providers]
      operationId: createProviderInstallPlan
      summary: Compute install plan without executing
      description: |
        Returns the steps an install would run, plus `current_state`
        showing what is already on disk. Managed Python plans resolve dependencies
        in a temporary managed venv without installing the engine. No active runtime
        is replaced and no job is created. The response contains a plan_id, field
        provenance, authority fingerprints and a dependency inventory.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InstallPlan' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No provider by that name, or the target node is unknown.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/{name}/install/preflight:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    post:
      tags: [Providers]
      operationId: createProviderInstallPreflight
      summary: Run preflight checks for an install
      description: |
        Checks the target node's prerequisites before an install is
        attempted: interpreter, GPU tooling, network reachability, disk. It
        changes nothing, and it answers synchronously with a report of what
        passed and what did not.

        Run it before `POST /zzrouter/v1/providers/{name}/install`. A failed
        preflight is much cheaper to read than a failed install.
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No provider by that name, or the target node is unknown.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/{name}/install/execute-step:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    post:
      tags: [Providers]
      operationId: createProviderInstallExecuteStep
      summary: Execute a single install step
      description: |
        Runs one step of the install plan. Async: the response is `202`
        with a job id, and progress plus the terminal step result
        arrive on `GET /zzrouter/v1/jobs/{id}/stream`.

        Paired with the verify-step route, this is how an agent drives
        an install one step at a time instead of launching the whole
        thing and watching. `step` is the one-based step number in the
        plan from `POST /zzrouter/v1/providers/{name}/install/plan`.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/InstallRequest'
                - type: object
                  required: [step]
                  properties:
                    step: { type: integer, minimum: 1 }
              description: Typed Python execution requires expected_plan_id from the accepted preview. A stale identity returns 409.
      responses:
        '202':
          description: Step accepted. Subscribe to `job_id` for progress and the result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: "`step` is negative."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No provider by that name, or the target node is unknown.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/{name}/install/disposable/{plan_id}:
    parameters:
      - { in: path, name: name, required: true, schema: { type: string } }
      - { in: path, name: plan_id, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
      - $ref: '#/components/parameters/NodeParam'
      - { in: query, name: runtime, schema: { type: string }, description: Declared runtime ID. }
    delete:
      tags: [Providers]
      operationId: deleteProviderDisposableRuntime
      summary: Remove a disposable managed runtime after its runs stop
      description: Deletes only the derived managed plan directory. Refuses while provider runs are active. Does not change the active installation or host packages.
      responses:
        '200': { description: Disposable runtime removed or already absent. }
        '400': { description: Invalid plan identity or undeclared runtime. }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404': { description: Provider is not configured. }
        '409': { description: Stop provider runs before cleanup. }

  /zzrouter/v1/providers/{name}/install/verify:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    post:
      tags: [Providers]
      operationId: createProviderInstallVerify
      summary: Verify a completed install
      description: |
        Checks install integrity. Managed Python runtimes also run pip check,
        declared startup imports, CUDA companion build consistency and
        device availability. Checks return name, passed, actual and reason.
        This does not load model weights or smoke-test generation.
        Legacy node results are unsupported, never promoted to a pass.
        Synchronous. Use it after an install job reports success, because a
        job that finished is not the same claim as a provider that works.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version: { type: string }
                runtime: { type: string, description: Declared runtime ID; defaults to the provider base runtime. }
      responses:
        '200':
          description: Verification completed; inspect data.all_ok and individual checks.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InstallVerifyResult' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No provider by that name, or the target node is unknown.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /zzrouter/v1/providers/{name}/install/verify-step:
    parameters: [{ in: path, name: name, required: true, schema: { type: string } }]
    post:
      tags: [Providers]
      operationId: createProviderInstallVerifyStep
      summary: Verify a single install step
      description: |
        Verifies one step of the install plan rather than the whole install,
        for driving a stepwise install by hand. `step` is the one-based
        step number in the plan from
        `POST /zzrouter/v1/providers/{name}/install/plan`. Synchronous.
      parameters:
        - $ref: '#/components/parameters/NodeParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/InstallRequest'
                - type: object
                  required: [step]
                  properties:
                    step: { type: integer, minimum: 1 }
      responses:
        '200': { description: OK }
        '400':
          description: "`step` is negative."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/MgmtUnauthorized' }
        '404':
          description: No provider by that name, or the target node is unknown.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

