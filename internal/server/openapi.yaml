  # =========================================================================
  # Ollama-compatible /api/* routes
  # =========================================================================
  #
  # zzRouter exposes a subset of Ollama's HTTP API so the Ollama CLI and
  # Ollama-compatible tools (Open WebUI, Obsidian plugins, etc.) can use
  # zzRouter as a drop-in replacement for an Ollama daemon.
  #
  # Error envelope: Ollama's native protocol uses a deliberately minimal
  # shape , `{"error": "<message>"}`. zzRouter emits the same shape via
  # `internal/server/responder_ollama.go`. Do NOT reference the OpenAI
  # error components from /api/* operations; they have a different
  # vocabulary and would confuse clients.
  #
  # The authoritative route list is at the bottom of
  # internal/server/routes_compat.go. The drift-check test
  # openapi_drift_api_test.go enforces path:method parity between code
  # and spec on this surface (same contract as /v1/* drift).
  # =========================================================================

  /api/version:
    get:
      tags: [OllamaCompat]
      operationId: ollamaGetVersion
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Ollama version endpoint (required for Ollama CLI compat)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: string }
        '500': { $ref: '#/components/responses/OllamaInternal' }

  /api/me:
    post:
      tags: [OllamaCompat]
      operationId: ollamaMe
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Ollama account handshake (proxied to upstream daemon)
      description: >
        Ollama CLI v0.20+ calls POST /api/me on every command as an
        account-status handshake. When an upstream Ollama endpoint is
        configured the request is proxied through unchanged so the
        daemon's per-host keypair drives the response. When no upstream
        is configured the server synthesizes a 401 in the native Ollama
        shape so the CLI's "endpoint exists" check still passes.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: OK , proxied upstream response.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/OllamaUnauthorized' }
        '500': { $ref: '#/components/responses/OllamaInternal' }
        '502': { $ref: '#/components/responses/OllamaBadGateway' }

  /api/tags:
    get:
      tags: [OllamaCompat]
      operationId: ollamaListTags
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: List models (Ollama shape)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/OllamaUnauthorized' }
        '500': { $ref: '#/components/responses/OllamaInternal' }

  /api/ps:
    get:
      tags: [OllamaCompat]
      operationId: ollamaListRunningModels
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: List running models (Ollama shape)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/OllamaUnauthorized' }
        '500': { $ref: '#/components/responses/OllamaInternal' }

  /api/generate:
    post:
      tags: [OllamaCompat]
      operationId: ollamaGenerate
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Generate completion (Ollama shape)
      description: |
        Image-bearing input is admitted before endpoint selection and replica
        fallback. Present vision replicas are preferred; when none is present,
        unknown replicas remain usable. If every target is known ineligible,
        the request returns 400 in this surface's error envelope with a fix.
        An explicit unsupported-image backend 500 is classified as invalid
        input, without retry or deployment/provider cooldown. Genuine server
        failures keep their status. Errors before stream opening remain HTTP
        errors; after committed cold-progress headers they travel in-band.
        Images are recognized in the top-level `images` array.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: OK , JSON body or NDJSON stream.
          content:
            application/json: { schema: { type: object } }
            application/x-ndjson: { schema: { type: string } }
        '400': { $ref: '#/components/responses/OllamaBadRequest' }
        '401': { $ref: '#/components/responses/OllamaUnauthorized' }
        '409': { $ref: '#/components/responses/OllamaModelNameConflict' }
        '404': { $ref: '#/components/responses/OllamaNotFound' }
        '500': { $ref: '#/components/responses/OllamaInternal' }
        '502': { $ref: '#/components/responses/OllamaBadGateway' }
        '503': { $ref: '#/components/responses/OllamaUnavailable' }

  /api/chat:
    post:
      tags: [OllamaCompat]
      operationId: ollamaChat
      security: [{ InferenceBearer: [] }, { InferenceKey: [] }, {}]
      summary: Chat completion (Ollama shape)
      description: |
        Image-bearing input is admitted before endpoint selection and replica
        fallback. Present vision replicas are preferred; when none is present,
        unknown replicas remain usable. If every target is known ineligible,
        the request returns 400 in this surface's error envelope with a fix.
        An explicit unsupported-image backend 500 is classified as invalid
        input, without retry or deployment/provider cooldown. Genuine server
        failures keep their status. Errors before stream opening remain HTTP
        errors; after committed cold-progress headers they travel in-band.
        Images are recognized in each message's `images` array.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: OK , JSON body or NDJSON stream.
          content:
            application/json: { schema: { type: object } }
            application/x-ndjson: { schema: { type: string } }
        '400': { $ref: '#/components/responses/OllamaBadRequest' }
        '401': { $ref: '#/components/responses/OllamaUnauthorized' }
        '409': { $ref: '#/components/responses/OllamaModelNameConflict' }
        '404': { $ref: '#/components/responses/OllamaNotFound' }
        '500': { $ref: '#/components/responses/OllamaInternal' }
        '502': { $ref: '#/components/responses/OllamaBadGateway' }
        '503': { $ref: '#/components/responses/OllamaUnavailable' }

  /api/embeddings:
    post:
      tags: [OllamaCompat]
