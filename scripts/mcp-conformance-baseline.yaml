server:
  # Reference fixture tools are absent from zzRouter.
  - tools-call-simple-text
  - tools-call-image
  - tools-call-audio
  - tools-call-embedded-resource
  - tools-call-mixed-content
  - tools-call-error
  - tools-call-with-progress
  # Reference logging, sampling and elicitation tools are absent.
  - tools-call-with-logging
  - tools-call-sampling
  - tools-call-elicitation
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums
  # Resource operations and reference fixtures are unsupported.
  - resources-read-text
  - resources-read-binary
  - resources-templates-read
  - resources-subscribe
  - resources-unsubscribe
  # Prompt fixtures and completion are unsupported.
  - prompts-get-simple
  - prompts-get-with-args
  - prompts-get-embedded-resource
  - prompts-get-with-image
  - completion-complete
  # Stateless transport provides no session for concurrent SSE streams.
  - server-sse-multiple-streams
